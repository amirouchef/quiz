<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Mock Exam 3</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one calm column, like a stained-slide study sheet. Hematoxylin indigo for structure, eosin pink for emphasis. */
:root{
  --bg:#FAF6FA; --surface:#FFFFFF; --fg:#241B35; --muted:#6B5F7E; --line:#E4DBEA;
  --hema:#3A2E8C; --hema-ink:#FFFFFF; --hema-soft:#ECE8F8; --eosin:#C42E79;
  --ok:#17694A; --ok-bg:#E1F3EA; --bad:#A8231B; --bad-bg:#FBE6E3;
  --f-display:'Bricolage Grotesque',system-ui,sans-serif;
  --f-body:'Public Sans',system-ui,-apple-system,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#130F1D; --surface:#1D1830; --fg:#EEE9F7; --muted:#A79BBD; --line:#352C4E;
    --hema:#A99BFF; --hema-ink:#150F2E; --hema-soft:#2A2350; --eosin:#F26CA9;
    --ok:#5CD6A0; --ok-bg:#123628; --bad:#FF8A80; --bad-bg:#3A1A1E; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#130F1D; --surface:#1D1830; --fg:#EEE9F7; --muted:#A79BBD; --line:#352C4E;
  --hema:#A99BFF; --hema-ink:#150F2E; --hema-soft:#2A2350; --eosin:#F26CA9;
  --ok:#5CD6A0; --ok-bg:#123628; --bad:#FF8A80; --bad-bg:#3A1A1E; color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--fg); font:16px/1.55 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:20px 56px;
}
.wrap{max-width:760px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
h1{font-size:clamp(28px,6.4vw,42px);line-height:1.08;letter-spacing:-.01em;margin:6px 0 10px}
h2{font-size:clamp(19px,4.4vw,24px);line-height:1.3;font-weight:600}
h3{font-size:15px;font-weight:600}
p{margin:0}
.eyebrow{font:500 12px var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--eosin)}
.lead{color:var(--muted);max-width:60ch}
.mono{font-family:var(--f-mono)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--eosin);outline-offset:2px}

/* stage ribbon */
.ribbon{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px;margin:22px 0 6px}
.ribbon div{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--hema);border-radius:8px;padding:8px 10px;min-width:0}
.ribbon div:nth-child(1){border-top-color:color-mix(in srgb,var(--hema) 40%,var(--line))}
.ribbon div:nth-child(2){border-top-color:color-mix(in srgb,var(--hema) 55%,var(--line))}
.ribbon div:nth-child(3){border-top-color:color-mix(in srgb,var(--hema) 72%,var(--line))}
.ribbon div:nth-child(5){border-top-color:var(--eosin)}
.ribbon b{display:block;font-family:var(--f-display);font-size:15px}
.ribbon span{font:500 12px var(--f-mono);color:var(--muted)}
.cap{font-size:13px;color:var(--muted);margin-bottom:26px}

.sec-title{margin:26px 0 10px;font:500 12px var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--hema-soft);padding:5px;border-radius:12px}
.seg button{border:0;background:transparent;padding:10px 8px;border-radius:9px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--hema);color:var(--hema-ink)}
.mode-note{margin-top:10px;color:var(--muted);font-size:14.5px;min-height:2.9em}

.scopes{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px}
.scope{display:block;position:relative;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:11px 14px;cursor:pointer;min-width:0}
.scope input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.scope:has(input:checked){border-color:var(--hema);background:var(--hema-soft)}
.scope:has(input:focus-visible){outline:3px solid var(--eosin);outline-offset:2px}
.scope:has(input:disabled){opacity:.5;cursor:not-allowed}
.sc-name{display:block;font-weight:600;line-height:1.3}
.sc-meta{display:block;font-size:13px;color:var(--muted);margin:2px 0 7px}
.meter{display:block;height:5px;background:var(--line);border-radius:3px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--hema);border-radius:3px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--hema);background:var(--hema);color:var(--hema-ink);border-radius:11px;padding:12px 20px;font-weight:600}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--hema)}
.btn.small{padding:8px 13px;font-size:14px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.flagged{border-color:var(--eosin);color:var(--eosin)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row.between{justify-content:space-between}
.start{margin-top:24px}
.linkish{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;font-size:14px}

/* quiz */
.topbar{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-bottom:10px}
.tag{font:500 12px var(--f-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.tag b{color:var(--eosin);font-weight:500}
.clock{font:500 15px var(--f-mono);font-variant-numeric:tabular-nums}
.score{font:500 14px var(--f-mono);font-variant-numeric:tabular-nums;color:var(--muted)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:22px}
.bar i{display:block;height:100%;background:var(--hema);transition:width .25s}
.qtext{margin-bottom:18px}
.lvl{display:inline-block;margin-top:8px;font:500 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:20px;padding:2px 9px}
.opts{display:grid;gap:9px;margin:0;padding:0;list-style:none}
.opt{width:100%;display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;line-height:1.45}
.opt:hover:not([disabled]){border-color:var(--hema)}
.opt .l{font:500 13px var(--f-mono);display:grid;place-items:center;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);color:var(--muted)}
.opt.sel{border-color:var(--hema);background:var(--hema-soft)}
.opt.sel .l{background:var(--hema);color:var(--hema-ink);border-color:var(--hema)}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.ok .l{background:var(--ok);border-color:var(--ok);color:var(--bg)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt.bad .l{background:var(--bad);border-color:var(--bad);color:var(--bg)}
.opt.dim{opacity:.62}
.opt[disabled]{cursor:default}
.fb{margin-top:16px;border-radius:12px;padding:14px 16px;display:grid;gap:6px}
.fb.good{background:var(--ok-bg)}
.fb.miss{background:var(--bad-bg)}
.fb strong{font-family:var(--f-display);font-size:17px}
.fb.good strong{color:var(--ok)}
.fb.miss strong{color:var(--bad)}
.foot{margin-top:22px}
.nav{display:flex;flex-wrap:wrap;gap:6px;margin-top:22px}
.nav button{width:34px;height:34px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);font:500 12px var(--f-mono);font-variant-numeric:tabular-nums;padding:0}
.nav button.a{background:var(--hema-soft);border-color:var(--hema)}
.nav button.f{border-color:var(--eosin);box-shadow:inset 0 -3px 0 var(--eosin)}
.nav button.c{background:var(--hema);color:var(--hema-ink);border-color:var(--hema)}
.warn{margin-top:16px;background:var(--hema-soft);border-radius:12px;padding:14px 16px;display:grid;gap:10px}

/* results */
.big{font-family:var(--f-display);font-size:clamp(54px,16vw,88px);line-height:1;font-weight:700;color:var(--hema);font-variant-numeric:tabular-nums}
.big small{font-size:.4em;color:var(--muted);font-weight:600}
.breakdown{display:grid;gap:10px;margin-top:6px}
.brow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center}
.brow .meter{grid-column:1/-1;height:7px}
.brow .meter i.low{background:var(--eosin)}
.num{font:500 13px var(--f-mono);font-variant-numeric:tabular-nums;color:var(--muted)}
.rev{display:grid;gap:12px;margin-top:12px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:8px;min-width:0}
.item .q{font-weight:600}
.item .yours,.item .right{font-size:15px}
.item .yours b{color:var(--bad)}
.item .right b{color:var(--ok)}
.item .ex{font-size:14.5px;color:var(--muted)}

/* flashcards */
.card{display:block;width:100%;min-height:260px;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:24px 22px;position:relative}
.card.back{background:var(--hema-soft);border-color:var(--hema)}
.card .side{font:500 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--eosin);margin-bottom:12px;display:block}
.card .ans{font-family:var(--f-display);font-size:clamp(19px,4.6vw,24px);line-height:1.3;font-weight:600;display:block;margin-bottom:12px}
.card .ex{color:var(--muted);display:block}
.hint{font-size:13px;color:var(--muted);margin-top:8px}

@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>

<script>
/* Mock exam 3: questions drawn from the Lessons 2 to 8 banks. Row: section(lesson), question, CORRECT, wrong1-3, explanation, level. */
const SECS=[{"k":"L2","n":"Lesson 2 · Odontogenesis"},{"k":"L3","n":"Lesson 3 · Eruption"},{"k":"L4","n":"Lesson 4 · Pulp"},{"k":"L5","n":"Lesson 5 · Dentin"},{"k":"L6","n":"Lesson 6 · Enamel"},{"k":"L7","n":"Lesson 7 · Cementum and periodontium"},{"k":"L8","n":"Lesson 8 · Oral cavity"}];
const RAW=[
["L2","Which statement describes the dental papilla in the EARLY bell stage?","No odontoblastic differentiation has occurred yet","Odontoblasts are already secreting predentin","Mineralized dentin is already present","It has already become mature dental pulp","[Lesson 2 · Odontogenesis · Bell stage and apposition] Odontoblast differentiation and unmineralized predentin appear in the late bell stage.",2],
["L2","Overactivation of the EDA receptor (EDAr) via TNF leads to…","additional teeth with aberrant morphology","agenesis of all teeth","absence of cementum","premature root closure","[Lesson 2 · Odontogenesis · Signalling molecules and genes] Too little signalling gives missing teeth; overactivation gives extra teeth (supernumerary) with aberrant shape.",3],
["L2","How many epithelial growths (buds) form in each jaw by the 8th week?","10","16","20","32","[Lesson 2 · Odontogenesis · Timeline and numbers] Ten per jaw, 20 in total, matching the 20 primary teeth. The 32 refers to permanent tooth germs formed later.",1],
["L2","Which tissue does NOT derive from the dental sac (follicle)?","Dentin","Cementum","Periodontal ligament","Alveolar bone","[Lesson 2 · Odontogenesis · Foundations and tissue origins] The dental sac gives cementum, periodontal ligament and alveolar bone. Dentin comes from the dental papilla.",3],
["L2","The transition from bud to cap marks…","the beginning of morphological differences between tooth germs that give rise to different types of teeth","the first deposition of dentin","the formation of Hertwig's sheath","the end of crown formation","[Lesson 2 · Odontogenesis · Bud and cap stages] At this transition germs start to differ, which later gives incisors, canines, premolars and molars. Pax9 and Msx1 are needed for these transitions.",2],
["L2","FGFs in dental development…","stimulate epithelial and mesenchymal proliferation and induce Msx1 expression","inhibit the formation of tooth germs","are expressed only after tooth eruption","cause supernumerary roots","[Lesson 2 · Odontogenesis · Signalling molecules and genes] FGFs mediate growth and differentiation, stimulate division of epithelial and mesenchymal cells, and induce Msx1.",2],
["L2","Which pairing of tooth germ components and their derivatives is INCORRECT?","Ectomesenchyme → dental papilla → enamel","Ectoderm → enamel organ → enamel","Ectomesenchyme → dental papilla → dentin–pulp complex","Ectomesenchyme → dental sac → cementum","[Lesson 2 · Odontogenesis · Initiation and induction] Enamel comes from the ectodermal enamel organ. The papilla is ectomesenchymal and gives the dentin–pulp complex.",3],
["L2","The vestibular lamina…","proliferates, then degenerates to form the vestibular sulcus between the cheek and the tooth zone","gives rise to the 10 buds of each jaw","forms the enamel knot","differentiates into the dental papilla","[Lesson 2 · Odontogenesis · Initiation and induction] The vestibular lamina is located toward the exterior. Its cells enlarge, then degenerate and leave a cleft: the vestibular sulcus.",2],
["L2","Hypodontia is defined as the congenital absence of…","1 to 6 teeth","more than 6 teeth","all teeth","only third molars","[Lesson 2 · Odontogenesis · Anomalies of odontogenesis] Hypodontia: 1–6 teeth missing. Oligodontia: more than 6. Anodontia: complete absence.",1],
["L2","After root formation, the epithelial sheath curves inward to form the…","diaphragm, which defines the root limit and the primary apical foramen","cervical loop, which defines the crown limit","enamel knot, which defines the cusps","vestibular sulcus, which defines the vestibule","[Lesson 2 · Odontogenesis · Root formation] Nerves and vessels enter the pulp chamber through the apical foramen. At this point the dental papilla becomes the dental pulp.",2],
["L2","At which stage do morphogenesis and histogenesis converge?","Bell stage","Bud stage","Cap stage","Dental lamina stage","[Lesson 2 · Odontogenesis · Foundations and tissue origins] The two phases meet at the bell stage, where cell differentiation begins while the crown pattern is being completed.",1],
["L2","Which pairing from dental sac cell differentiation is INCORRECT?","Fibroblasts → cementum","Cementoblasts → cementum","Fibroblasts → periodontal ligament","Osteoblasts → alveolar bone","[Lesson 2 · Odontogenesis · Root formation] Cementoblasts form cementum; fibroblasts form the periodontal ligament; osteoblasts form alveolar bone.",3],
["L2","Histogenesis (cytodifferentiation) consists of…","the formation of enamel, dentin and pulp within the patterns already formed","the development of coronal and radicular patterns by division, displacement and organization of parts","the differentiation of the vestibular lamina","the migration of neural crest cells into the maxillary process","[Lesson 2 · Odontogenesis · Foundations and tissue origins] Morphogenesis builds the patterns (crown and root); histogenesis fills them with tissues. Do not swap the two definitions.",2],
["L2","Embryology is best defined as the study of…","the progressive growth and differentiation that occur during the early stages of embryonic development","the eruption sequence of primary and permanent teeth","the structure of fully differentiated adult tissues","the genetic mutations that cause congenital malformations","[Lesson 2 · Odontogenesis · Foundations and tissue origins] Embryology covers the progressive growth and differentiation of the early embryo. It is the framework in which odontogenesis takes place.",1],
["L3","What is used as a fixed reference point to describe accommodating growth?","The inferior dental canal, from which the apexes move 2–3 mm","The cementoenamel junction, from which the crowns move 7 mm","The occlusal plane, from which the crowns move 2–3 mm","The alveolar crest, from which the apexes move 1 mm","[Lesson 3 · Eruption · Post-eruptive stage] The apexes of the teeth are moved 2–3 mm from the inferior dental canal, which is the fixed reference.",3],
["L3","Which description matches premolars and molars, as grouped in the lesson?","Grinding or shredding, with 2 or 3 roots and crowns with 4 or 5 cusps","Cutting, with one root and flat coronal edges","Tearing, with one large conical root","Cutting, with a conical crown and 3 roots","[Lesson 3 · Eruption · Eruption, tooth types and diphyodonty] Premolars and molars are the grinding teeth: 2 or 3 roots and crowns with 4 or 5 cusps.",2],
["L3","Root resorption of deciduous teeth starts on the ___ surface, and the tooth is shed with…","lingual; much of its pulp chamber intact","buccal; its pulp completely necrotic","lingual; no pulp at all","buccal; its pulp intact","[Lesson 3 · Eruption · Rhizoclasia and replacement] Resorption occurs on the lingual surface; deciduous teeth are shed with much of the pulp chamber intact.",2],
["L3","Rhizoclasia is…","the resorption of hard root tissues (roots and alveolar bone) and soft tissues (pulp, PDL)","the formation of root dentin by odontoblasts","the deposit of secondary cementum at the apex","the fusion of the oral and reduced enamel epithelium","[Lesson 3 · Eruption · Rhizoclasia and replacement] Rhizoclasia is the resorption of the hard root tissues and of the soft tissues, pulp and periodontal ligament.",1],
["L3","Rhizoclasia is caused by…","a sac or pericoronal tissue that covers the crowns of the unerupted permanent teeth","Hertwig's sheath of the primary tooth","the gubernacular cord of the primary tooth","Malassez remains","[Lesson 3 · Eruption · Rhizoclasia and replacement] The pericoronal tissue around the unerupted tooth drives the resorption. Deciduous teeth have no gubernacular cord.",3],
["L3","Which statement about accommodating growth timing is correct?","It occurs earlier in girls than in boys","It occurs earlier in boys than in girls","It occurs at the same age in both sexes","It occurs only in the mandible","[Lesson 3 · Eruption · Post-eruptive stage] Accommodating growth occurs earlier in girls than in boys.",2],
["L3","Primary canines erupt at about…","16–23 months","6–12 months","13–19 months","22–33 months","[Lesson 3 · Eruption · Primary and mixed dentition] Canines: 16–23 months. Central incisors 6–12, lateral incisors 9–16, first molars 13–19, second molars 22–33.",2],
["L3","Interproximal wear in the mandible can reach more than…","7 mm","1 mm","2 mm","12 mm","[Lesson 3 · Eruption · Post-eruptive stage] Wear at the proximal contact points can be considerable: more than 7 mm in the mandible.",2],
["L3","If a permanent tooth germ is congenitally missing or in an aberrant position, the deciduous tooth…","has its replacement delayed","is exfoliated earlier","is replaced as usual","is replaced by a supernumerary tooth","[Lesson 3 · Eruption · Rhizoclasia and replacement] The pressure of the erupting permanent tooth plays an important role. Without it, replacement is delayed.",2],
["L3","Why is a complete, occluding primary dentition important?","It sets up an integrated circuit of neuromuscular reflexes that stimulate jaw development and TMJ growth","It determines how many permanent teeth will form","It prevents Hertwig's sheath from forming too early","It makes the permanent teeth erupt before 6 years","[Lesson 3 · Eruption · Primary and mixed dentition] The complete occlusal primary dentition is a necessary stage for craniofacial and occlusal development and growth.",2],
["L3","Which primary teeth erupt first?","Central incisors (6–12 months)","Lateral incisors (9–16 months)","First molars (13–19 months)","Canines (16–23 months)","[Lesson 3 · Eruption · Primary and mixed dentition] The central incisors erupt first, at 6–12 months.",1],
["L3","Where do permanent premolars develop?","Between the divergent roots of the deciduous molars","Apical to the roots of the deciduous canines","On the buccal side of the deciduous molar crowns","Inside the pulp chamber of the deciduous molars","[Lesson 3 · Eruption · Rhizoclasia and replacement] Premolars develop between the divergent roots of deciduous molars and erupt in an occlusal direction.",2],
["L3","Tooth movement results from a balance between…","tissue destruction (bone, connective tissue, epithelium) and tissue formation (bone, PDL, root)","enamel formation and dentin formation","bone resorption only","pulp growth and root resorption","[Lesson 3 · Eruption · Intraosseous movement and molecules] Eruption needs the simultaneous removal and formation of tissue.",2],
["L3","The gubernacular cord is…","a strand of fibrous tissue containing remnants of the dental lamina that connects the follicle to the lamina propria of the oral mucosa","a bundle of PDL fibers anchored in the cementum","a strand of epithelium derived from Hertwig's sheath","a vascular channel from the pulp to the apical foramen","[Lesson 3 · Eruption · Periodontal ligament and gubernacular cord] The gubernacular cord maintains the connection of the fibrocellular follicle with the oral mucosa.",2],
["L4","What is the main role of the pulp ground substance?","It is the medium for transporting nutrients from the vasculature to the cells and waste metabolites back to the vasculature","It provides the mineral for dentin formation","It synthesizes the dentin matrix","It produces antibodies","[Lesson 4 · Pulp · Fibers and ground substance] The ground substance carries nutrients to the cells and waste from the cells to the vasculature.",1],
["L4","Pulp dendritic cells…","possess MHC II and capture and present foreign antigen to T cells, starting the primary immune response","synthesize collagen and ground substance","differentiate into odontoblasts","phagocytose dead cells and lack MHC II","[Lesson 4 · Pulp · Fibroblasts, stem and inflammatory cells] Dendritic cells have MHC II and present antigen to T cells. They lie around the odontoblast layer in unerupted teeth and below it in erupted teeth.",2],
["L4","Which change does NOT occur in the pulp with aging?","An increase in pulp volume and vascular supply","Pulp volume reduction","A decrease in irrigation and innervation","A gradual decrease of the cell population","[Lesson 4 · Pulp · Aging and pulp stones] With age the pulp volume, blood supply, innervation and cell numbers all decrease.",2],
["L4","What is the correct order of the pulp layers from the periphery to the center?","Odontoblastic zone → cell-free zone of Weil → cell-rich zone → pulp core","Cell-rich zone → cell-free zone of Weil → odontoblastic zone → pulp core","Odontoblastic zone → cell-rich zone → cell-free zone of Weil → pulp core","Pulp core → cell-rich zone → cell-free zone of Weil → odontoblastic zone","[Lesson 4 · Pulp · Histological layers] From outside in: odontoblastic zone, Weil's cell-free zone, cell-rich zone and pulp core.",1],
["L4","Which are the main cells of the pulp, especially in the crown?","Fibroblasts","Odontoblasts","Dendritic cells","Macrophages","[Lesson 4 · Pulp · Fibroblasts, stem and inflammatory cells] Fibroblasts are the main cells of the pulp, particularly in the crown. Odontoblasts are the specific cells.",1],
["L4","Which structure is found in Weil's cell-free zone?","Raschkow's nerve plexus, together with fibroblasts and dendritic cells","The von Korff plexus","The main vessels and nerve trunks","A high density of mesenchymal cells","[Lesson 4 · Pulp · Histological layers] Weil's zone is poor in cells but contains Raschkow's plexus, fibroblasts and dendritic cells. The main trunks lie in the core.",2],
["L4","What forms when the vessels branch and decrease in caliber in the coronal region?","The subodontoblastic capillary plexus","Raschkow's plexus","The von Korff plexus","The periodontal plexus","[Lesson 4 · Pulp · Blood and lymphatic circulation] Coronal vessels form the subodontoblastic capillary plexus. Raschkow's is a nerve plexus and von Korff's is made of collagen.",2],
["L4","How does blood flow to the crown compare with the root?","The blood reaching the crown is almost twice that of the root","The blood reaching the crown is half that of the root","They are equal","The crown receives ten times more blood","[Lesson 4 · Pulp · Blood and lymphatic circulation] The crown receives almost twice as much blood as the root region.",2],
["L4","Odontoblasts are…","the specific cells of the pulp, forming a peripheral layer whose processes extend toward the dentin","the main cells of the pulp in the crown","the reserve cells that differentiate according to the stimulus","inflammatory cells that remove dead cells","[Lesson 4 · Pulp · Odontoblasts and dentinal fluid] Odontoblasts are the specific cells of the pulp. They form a layer at the periphery and extend a process toward the dentin.",1],
["L4","Which statement about sympathetic innervation is correct?","Sympathetic C fibers from the superior cervical ganglion control arteriolar caliber (vasomotor function) and release noradrenaline","Sympathetic fibers release acetylcholine and VIP","Sympathetic A-delta fibers conduct pain","Sympathetic fibers originate in the trigeminal ganglion and cause vasodilation","[Lesson 4 · Pulp · Innervation] Sympathetic C fibers are efferent, slow, vasomotor and use catecholamine (noradrenaline).",3],

["L4","Ectomesenchymal cells of the pulp are also called…","undifferentiated mesenchymal cells, although they derive from the ectoderm of the neural crests","mature fibroblasts of mesodermal origin","odontoblasts of endodermal origin","monocytes of bone marrow origin","[Lesson 4 · Pulp · Fibroblasts, stem and inflammatory cells] They are called undifferentiated mesenchymal cells, but they come from the ectoderm of the neural crests.",1],
["L4","Lymph from the pulp of the anterior lower teeth drains to the…","submental lymph nodes","submandibular and deep cervical lymph nodes","parotid lymph nodes","retropharyngeal lymph nodes","[Lesson 4 · Pulp · Blood and lymphatic circulation] Anterior lower teeth drain to the submental nodes. Anterior and posterior upper teeth drain to the submandibular and deep cervical nodes.",3],
["L5","What happens to predentin during dentin formation?","It gradually mineralizes into dentin, but a layer of predentin always remains between pulp and dentin","It is completely replaced by dentin when the tooth erupts","It stays unchanged and never mineralizes","It disappears with age and is replaced by pulp","[Lesson 5 · Dentin · Predentin, coronal and root dentin] Predentin mineralizes as non-collagenous matrix proteins are incorporated at the mineralization front, yet its thickness remains constant because new predentin is formed continuously.",2],
["L5","What separates undifferentiated papilla cells from the inner enamel epithelium at the beginning?","An acellular zone containing a few fine collagen fibrils","A layer of predentin","A thick layer of cementum","The stellate reticulum","[Lesson 5 · Dentin · Odontoblast life cycle] An acellular zone with few collagen fibrils lies between the papilla and the inner epithelium. Later it becomes cellular as odontoblasts differentiate.",2],

["L5","On a radiograph, dentin appears…","darker than enamel, because its mineral content is lower","brighter than enamel, because it contains more mineral","as bright as enamel","as dark as the pulp chamber","[Lesson 5 · Dentin · Physical properties] Radiopacity depends on mineral content. Dentin is less radiopaque than enamel (so it looks darker) but more radiopaque than bone, and the pulp is radiolucent.",2],

["L5","How does root dentin formation differ from coronal dentin formation?","Apposition is slower, calcospherites are smaller, and the collagen fibers of cementum mix with those of dentin","Apposition is faster and calcospherites are larger","It begins before enamel formation is complete","It is identical in pattern and speed","[Lesson 5 · Dentin · Dentinogenesis] Root dentin starts once enamel formation is complete under induction of the inner epithelium and Hertwig's sheath. The pattern of mineralization is similar but slower, with smaller calcospherites and a different orientation of collagen.",2],
["L5","Which description fits the young odontoblast?","Cells that develop adhesion and communicating junctions, change polarity, enlarge, and show the nucleus away from the inner enamel epithelium","Round cells with no junctions that still divide","Cells that already secrete mantle dentin","Flat cells without polarity","[Lesson 5 · Dentin · Odontoblast life cycle] Young odontoblasts develop adhesive junctions and communication, polarize, increase in volume, become cylindrical and form the odontoblastic process.",2],
["L5","Where is interglobular dentin most frequent?","In circumpulpal dentin just below the mantle dentin","In predentin","In enamel","In the cementum","[Lesson 5 · Dentin · Secondary structural units] Interglobular dentin is greater in the circumpulpal dentin just beneath the mantle dentin.",3],
["L5","Where does coronal dentin formation begin and how does it spread?","At the bell stage in the papilla under the inner enamel epithelium (cusp tip), then down the cusp slope toward the cervical loop","In the root, then toward the cusps","At the cervical loop, then toward the cusp tip","At the apical foramen, then toward the cervical region","[Lesson 5 · Dentin · Predentin, coronal and root dentin] Coronal dentin begins at the bell stage next to the inner enamel epithelium and extends down the cusp slope to the cervical loop while it thickens.",2],
["L5","What are von Korff fibers?","Large-diameter type III collagen fibrils with fibronectin, extending from the odontoblasts toward the inner enamel epithelium","Thin type I fibrils located in secondary dentin","Elastic fibers of the pulp","Nerve fibers entering the tubules","[Lesson 5 · Dentin · Dentinogenesis] Von Korff fibers are the first secreted matrix of mantle dentin: large type III collagen fibrils (0.1 to 0.2 µm) associated with fibronectin.",2],
["L5","How do the amelodentinal (CAD) and cementodentinal (CCD) junctions differ?","CAD is a sharp line because of differences in origin and structure, while CCD is not clearly distinguishable because of similarities","CCD is a sharp line, and CAD is not distinguishable","Both are equally indistinct","Both are equally sharp","[Lesson 5 · Dentin · Secondary structural units] The CAD is sharp because enamel and dentin differ in origin and structure. The CCD is hard to distinguish because dentin and cementum are similar.",2],
["L5","Interglobular dentin is…","a non-mineralized or hypomineralized area caused by lack of fusion of calcospherites, linked to vitamin D deficiency or high fluoride at the time of dentin formation","a hypermineralized layer around the tubules","tertiary dentin formed after caries","dentin without any tubules","[Lesson 5 · Dentin · Secondary structural units] In these areas the globular zones of mineralization have not fused properly. Czermak spaces are the hypomineralized spaces between globules.",2],
["L5","Which three mechanisms have been proposed to explain dentin sensitivity?","Direct innervation of dentin, odontoblasts as receptors, and the hydrodynamic theory","Direct innervation, thermal expansion of enamel, and cementum receptors","Osmotic theory, electrical theory, and hydrodynamic theory","Odontoblast receptors, ameloblast receptors and cementoblast receptors","[Lesson 5 · Dentin · Innervation, aging and dentinogenesis imperfecta] The three mechanisms in the lesson are: dentin with nerve endings, odontoblasts coupled to pulp nerves, and fluid movement in the tubules detected by pulp nerve endings.",1],

["L6","How do enamel crystals look on sections?","Elongated hexagons on perpendicular sections and rectangles on parallel sections","Round on both sections","Triangles on perpendicular sections and squares on parallel sections","Needles on both sections","[Lesson 6 · Enamel · Composition] The crystals form elongated hexagons in perpendicular section and rectangles in parallel section. They are built from unit cells of calcium and phosphate ions.",2],

const QS=RAW.map((r,i)=>({id:i+1,s:r[0],q:r[1],c:r[2],w:[r[3],r[4],r[5]],e:r[6],l:r[7]}));

<script>
(function(){
const LET=['A','B','C','D'];
const LVL={1:'Recall',2:'Understand',3:'Tricky'};
const STAGES=[['Lessons 2 to 8','all topics'],['Mixed order','no lesson grouping'],['Exam mode','no feedback until the end'],['Review','explanation for each mistake']];
const KEY='dental-mock3-qb-v1';
const app=document.getElementById('app');
let store={done:{}};
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&s.done)store=s}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}}
const $=s=>document.querySelector(s);
function esc(t){return String(t).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function secName(k){return SECS.find(s=>s.k===k).n}
function fmt(ms){const t=Math.floor(ms/1000);return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')}
const isOk=it=>it.pick!==null&&it.opts[it.pick].ok;

let mode='practice',scope='all',S=null,C=null,timer=null,resetAsk=false;

const MODE_NOTE={
 practice:'One question at a time. You see right away whether you were correct and read the explanation.',
 exam:'No feedback until you finish. Move back and forth, flag questions, and watch the clock.',
 cards:'The question on the front, the answer and its explanation on the back. Good for a last pass.'
};

function poolFor(sc){
 if(sc==='all')return QS.slice();
 if(sc==='weak')return QS.filter(q=>store.done[q.id]==='w');
 return QS.filter(q=>q.s===sc);
}

/* ---------- HOME ---------- */
function home(){
 clearInterval(timer);S=null;C=null;
 const weak=poolFor('weak').length;
 if(scope==='weak'&&!weak)scope='all';
 const tried=QS.filter(q=>store.done[q.id]).length;
 const right=QS.filter(q=>store.done[q.id]==='c').length;
 const rows=[{k:'all',n:'All sections'}].concat(SECS).map(s=>{
  const p=poolFor(s.k),c=p.filter(q=>store.done[q.id]==='c').length;
  return `<label class="scope"><input type="radio" name="scope" value="${s.k}" ${scope===s.k?'checked':''}><span class="sc-name">${esc(s.n)}</span><span class="sc-meta">${p.length} questions · ${c} answered correctly</span><span class="meter"><i style="width:${Math.round(c/p.length*100)}%"></i></span></label>`;
 }).join('')+`<label class="scope"><input type="radio" name="scope" value="weak" ${scope==='weak'?'checked':''} ${weak?'':'disabled'}><span class="sc-name">My mistakes</span><span class="sc-meta">${weak?weak+' questions you last got wrong':'Nothing to review yet'}</span><span class="meter"><i style="width:${weak?Math.round(weak/QS.length*100):0}%;background:var(--eosin)"></i></span></label>`;
 app.innerHTML=`
 <p class="eyebrow">Dental Tissues · Lessons 2 to 8</p>
 <h1>Mock Exam 3</h1>
 <p class="lead">${QS.length} single-answer questions with a full explanation for each one, drawn evenly from Lessons 2 to 8 (odontogenesis, eruption, pulp, dentin, enamel, cementum and periodontium, oral cavity) and mixed in random order. Choose Exam mode, finish without looking anything up, then read the explanation of every mistake.</p>
 <div class="ribbon" aria-label="Exam format">${STAGES.map(s=>`<div><b>${s[0]}</b><span>${s[1]}</span></div>`).join('')}</div>
 <p class="cap">Pick the Exam mode for real conditions; the results show your score for each lesson. Progress so far: ${right} of ${QS.length} answered correctly${tried?`, ${tried} attempted`:''}.</p>
 <p class="sec-title">1 · Mode</p>
 <div class="seg" role="group" aria-label="Mode">
  ${[['practice','Practice'],['exam','Exam'],['cards','Flashcards']].map(m=>`<button type="button" data-a="mode" data-v="${m[0]}" aria-pressed="${mode===m[0]}">${m[1]}</button>`).join('')}
 </div>
 <p class="mode-note" id="mnote">${MODE_NOTE[mode]}</p>
 <p class="sec-title">2 · Scope</p>
 <div class="scopes">${rows}</div>
 <div class="start row between">
  <button type="button" class="btn" data-a="start">Start</button>
  ${resetAsk?`<span class="row"><span class="tag">Erase saved progress?</span><button type="button" class="btn ghost small" data-a="reset-yes">Erase</button><button type="button" class="btn ghost small" data-a="reset-no">Keep</button></span>`:`<button type="button" class="linkish" data-a="reset">Reset progress</button>`}
 </div>`;
}

/* ---------- SESSION ---------- */
function startSession(m,pool){
 if(!pool.length)return;
 S={mode:m,i:0,t0:Date.now(),ask:false,over:false,rf:'wrong',
  list:shuffle(pool).map(q=>({q,opts:shuffle([{t:q.c,ok:true}].concat(q.w.map(t=>({t,ok:false})))),pick:null,flag:false}))};
 clearInterval(timer);
 if(m==='exam'){timer=setInterval(()=>{const e=$('#clock');if(e)e.textContent=fmt(Date.now()-S.t0)},1000)}
 quiz();
}

function quiz(){
 const ex=S.mode==='exam',it=S.list[S.i],q=it.q,n=S.list.length;
 const ans=it.pick!==null,reveal=!ex&&ans;
 const nDone=S.list.filter(x=>x.pick!==null).length;
 const good=S.list.filter(isOk).length,bad=nDone-good;
 const opts=it.opts.map((o,k)=>{
  let cls='opt';
  if(ex&&it.pick===k)cls+=' sel';
  if(reveal){if(o.ok)cls+=' ok';else if(it.pick===k)cls+=' bad';else cls+=' dim'}
  return `<li><button type="button" class="${cls}" data-a="pick" data-i="${k}" ${reveal?'disabled':''}><span class="l">${LET[k]}</span><span>${esc(o.t)}</span></button></li>`;
 }).join('');
 let fb='';
 if(reveal){
  const ok=isOk(it);
  fb=`<div class="fb ${ok?'good':'miss'}" role="status"><strong>${ok?'Correct':'Not quite'}</strong>${ok?'':`<p><b>Answer:</b> ${esc(q.c)}</p>`}<p>${esc(q.e)}</p></div>`;
 }
 const last=S.i===n-1;
 let foot;
 if(ex){
  const un=n-nDone;
  foot=`<div class="row between foot">
   <span class="row"><button type="button" class="btn ghost" data-a="prev" ${S.i===0?'disabled':''}>Previous</button><button type="button" class="btn ghost" data-a="next" ${last?'disabled':''}>Next</button></span>
   <span class="row"><button type="button" class="btn ghost small ${it.flag?'flagged':''}" data-a="flag" aria-pressed="${it.flag}">${it.flag?'Flagged':'Flag'}</button><button type="button" class="btn small" data-a="finish">Finish exam</button></span>
  </div>
  ${S.ask?`<div class="warn" role="alert"><p>${un?`You left ${un} question${un>1?'s':''} unanswered. They will count as wrong.`:'All questions answered.'} Finish and see your results?</p><div class="row"><button type="button" class="btn small" data-a="finish-yes">Finish</button><button type="button" class="btn ghost small" data-a="finish-no">Keep going</button></div></div>`:''}
  <div class="nav" aria-label="Question navigator">${S.list.map((x,k)=>`<button type="button" data-a="jump" data-i="${k}" class="${x.pick!==null?'a':''} ${x.flag?'f':''} ${k===S.i?'c':''}" aria-label="Question ${k+1}${x.flag?', flagged':''}${x.pick!==null?', answered':''}">${k+1}</button>`).join('')}</div>`;
 }else{
  foot=`<div class="row between foot"><button type="button" class="linkish" data-a="home">Quit</button><button type="button" class="btn" data-a="${last?'finish-yes':'next'}" ${ans?'':'disabled'}>${last?'See results':'Next question'}</button></div>`;
 }
 app.innerHTML=`
 <div class="topbar"><span class="tag">Question ${S.i+1} of ${n} · <b>${esc(secName(q.s))}</b></span>
  ${ex?`<span class="clock" id="clock">${fmt(Date.now()-S.t0)}</span>`:`<span class="score" aria-label="Score so far">✓ ${good} · ✗ ${bad}</span>`}</div>
 <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="${n}" aria-valuenow="${ex?nDone:S.i+(ans?1:0)}"><i style="width:${(ex?nDone:S.i+(ans?1:0))/n*100}%"></i></div>
 <div class="qtext" id="q"><h2>${esc(q.q)}</h2><span class="lvl">${LVL[q.l]}</span></div>
 <ul class="opts">${opts}</ul>${fb}${foot}`;
 window.scrollTo(0,0);
}

function pick(k){
 const it=S.list[S.i];
 if(S.mode==='practice'){
  if(it.pick!==null)return;
  it.pick=k;store.done[it.q.id]=it.opts[k].ok?'c':'w';save();
 }else{it.pick=k}
 quiz();
}

function finish(){
 clearInterval(timer);
 S.list.forEach(it=>{if(S.mode==='exam'){store.done[it.q.id]=isOk(it)?'c':'w'}});
 save();S.end=Date.now();S.over=true;results();
}

/* ---------- RESULTS ---------- */
function results(){
 const L=S.list,n=L.length,ok=L.filter(isOk).length,pct=Math.round(ok/n*100);
 const verdict=pct>=85?'Exam-ready on this set. Keep the weak spots fresh.':pct>=70?'Solid base. Tighten the sections marked in pink.':'Keep drilling. Redo your mistakes, then try again.';
 const secs=SECS.map(s=>{const l=L.filter(x=>x.q.s===s.k);if(!l.length)return '';const c=l.filter(isOk).length,p=Math.round(c/l.length*100);
  return `<div class="brow"><span>${esc(s.n)}</span><span class="num">${c}/${l.length}</span><span class="meter"><i class="${p<70?'low':''}" style="width:${p}%"></i></span></div>`}).join('');
 const wrong=L.filter(x=>!isOk(x));
 const shown=S.rf==='wrong'?wrong:L;
 const rev=shown.map(it=>{const k=L.indexOf(it);
  const yours=it.pick===null?'<b>No answer</b>':`<b>${esc(it.opts[it.pick].t)}</b>`;
  return `<article class="item"><span class="tag">Question ${k+1} · ${esc(secName(it.q.s))}</span><p class="q">${esc(it.q.q)}</p>
  ${isOk(it)?'':`<p class="yours">Your answer: ${yours}</p>`}<p class="right">Correct: <b>${esc(it.q.c)}</b></p><p class="ex">${esc(it.q.e)}</p></article>`}).join('');
 app.innerHTML=`
 <p class="eyebrow">${S.mode==='exam'?'Exam':'Practice'} complete · ${fmt(S.end-S.t0)}</p>
 <div class="big">${ok}<small> / ${n}</small></div>
 <h2 style="margin-top:8px">${pct}% · ${verdict}</h2>
 <div class="row start"><button type="button" class="btn" data-a="retry" ${wrong.length?'':'disabled'}>Redo my ${wrong.length} mistake${wrong.length===1?'':'s'}</button><button type="button" class="btn ghost" data-a="home">Back to start</button></div>
 <p class="sec-title">By section</p><div class="breakdown">${secs}</div>
 <p class="sec-title">Review</p>
 <div class="row"><button type="button" class="btn small ${S.rf==='wrong'?'':'ghost'}" data-a="rf" data-v="wrong">Mistakes (${wrong.length})</button><button type="button" class="btn small ${S.rf==='all'?'':'ghost'}" data-a="rf" data-v="all">All questions</button></div>
 <div class="rev">${rev||'<p class="lead">No mistakes in this run.</p>'}</div>`;
 window.scrollTo(0,0);
}

/* ---------- FLASHCARDS ---------- */
function cards(pool){
 if(!pool.length)return;
 C={list:shuffle(pool),i:0,f:false};renderCard();
}
function renderCard(){
 const q=C.list[C.i],n=C.list.length;
 app.innerHTML=`
 <div class="topbar"><span class="tag">Card ${C.i+1} of ${n} · <b>${esc(secName(q.s))}</b></span><button type="button" class="linkish" data-a="home">Back to start</button></div>
 <div class="bar"><i style="width:${(C.i+1)/n*100}%"></i></div>
 <button type="button" class="card ${C.f?'back':''}" id="card" data-a="flip" aria-live="polite">
  ${C.f?`<span class="side">Answer</span><span class="ans">${esc(q.c)}</span><span class="ex">${esc(q.e)}</span>`:`<span class="side">Question</span><h2>${esc(q.q)}</h2>`}
 </button>
 <p class="hint">Tap the card or press Space to flip. Arrow keys move between cards.</p>
 <div class="row between foot"><button type="button" class="btn ghost" data-a="cprev" ${C.i===0?'disabled':''}>Previous</button><button type="button" class="btn" data-a="cnext" ${C.i===n-1?'disabled':''}>Next card</button></div>`;
}

/* ---------- EVENTS ---------- */
app.addEventListener('change',e=>{if(e.target.name==='scope')scope=e.target.value});
app.addEventListener('click',e=>{
 const b=e.target.closest('[data-a]');if(!b||b.disabled)return;
 const a=b.dataset.a,v=b.dataset.v,i=b.dataset.i!==undefined?+b.dataset.i:null;
 switch(a){
  case 'mode':mode=v;document.querySelectorAll('.seg button').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.v===mode)));$('#mnote').textContent=MODE_NOTE[mode];break;
  case 'start':{const p=poolFor(scope);if(mode==='cards')cards(p);else startSession(mode,p);break}
  case 'reset':resetAsk=true;home();break;
  case 'reset-no':resetAsk=false;home();break;
  case 'reset-yes':store={done:{}};save();resetAsk=false;home();break;
  case 'pick':pick(i);break;
  case 'next':if(S.i<S.list.length-1){S.i++;S.ask=false;quiz()}break;
  case 'prev':if(S.i>0){S.i--;S.ask=false;quiz()}break;
  case 'jump':S.i=i;S.ask=false;quiz();break;
  case 'flag':S.list[S.i].flag=!S.list[S.i].flag;quiz();break;
  case 'finish':S.ask=true;quiz();break;
  case 'finish-no':S.ask=false;quiz();break;
  case 'finish-yes':finish();break;
  case 'home':home();break;
  case 'rf':S.rf=v;results();break;
  case 'retry':startSession('practice',S.list.filter(x=>!isOk(x)).map(x=>x.q));break;
  case 'flip':C.f=!C.f;renderCard();break;
  case 'cnext':if(C.i<C.list.length-1){C.i++;C.f=false;renderCard()}break;
  case 'cprev':if(C.i>0){C.i--;C.f=false;renderCard()}break;
 }
});
document.addEventListener('keydown',e=>{
 if(e.metaKey||e.ctrlKey||e.altKey)return;
 if(S&&!S.over&&$('#q')){
  const k='1234'.indexOf(e.key),k2='abcd'.indexOf(e.key.toLowerCase());
  const idx=k>-1?k:k2;
  if(idx>-1&&idx<4){pick(idx);return}
  if(e.key==='ArrowRight'){const nx=S.list[S.i].pick!==null||S.mode==='exam';if(nx&&S.i<S.list.length-1){S.i++;S.ask=false;quiz()}}
  if(e.key==='ArrowLeft'&&S.mode==='exam'&&S.i>0){S.i--;S.ask=false;quiz()}
 }else if(C&&$('#card')){
  if(e.key===' '&&document.activeElement===document.body){e.preventDefault();C.f=!C.f;renderCard()}
  if(e.key==='ArrowRight'&&C.i<C.list.length-1){C.i++;C.f=false;renderCard()}
  if(e.key==='ArrowLeft'&&C.i>0){C.i--;C.f=false;renderCard()}
 }
});
home();
})();
</script>

</body></html>
