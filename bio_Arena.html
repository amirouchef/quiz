<style>

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10161c;--card:#19212a;--ink:#e8edf2;--mut:#93a0ad;--line:#2b3641;--acc:#4fd1c2;--accbg:#12332f;--ok:#6ee79a;--okbg:#12311f;--bad:#ff8a8a;--badbg:#3a1a1a;--gold:#f5b556}}
:root[data-theme="dark"]{--bg:#10161c;--card:#19212a;--ink:#e8edf2;--mut:#93a0ad;--line:#2b3641;--acc:#4fd1c2;--accbg:#12332f;--ok:#6ee79a;--okbg:#12311f;--bad:#ff8a8a;--badbg:#3a1a1a;--gold:#f5b556}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:26px;margin:6px 0 4px}.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--acc);font-weight:700;margin:0}
.lead{color:var(--mut);margin:0 0 18px}
.modes{display:grid;gap:10px}
.m{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;color:var(--ink);font:inherit;cursor:pointer}
.m b{display:block;font-size:17px}.m span{color:var(--mut);font-size:14px}.m:active{transform:scale(.99)}
.m small{float:right;color:var(--gold);font-weight:700}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:22px 0 8px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:700;margin-bottom:10px}
.pill{background:var(--accbg);color:var(--acc);border-radius:99px;padding:4px 12px;font-size:14px}
.bar{height:6px;background:var(--line);border-radius:9px;overflow:hidden;margin-bottom:16px}.bar i{display:block;height:100%;background:var(--acc);width:100%}
.q{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.q .t{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}.q p{margin:6px 0 0;font-size:18px;font-weight:600}
.o{display:block;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;font:inherit;color:var(--ink);cursor:pointer}
.o.ok{background:var(--okbg);border-color:var(--ok)}.o.no{background:var(--badbg);border-color:var(--bad)}
.fb{border-radius:12px;padding:12px 14px;margin:10px 0;font-size:15px}.fb.ok{background:var(--okbg)}.fb.no{background:var(--badbg)}
.btn{display:block;width:100%;background:var(--acc);color:#fff;border:0;border-radius:12px;padding:14px;font:inherit;font-weight:700;cursor:pointer}
:root:not([data-theme="light"]) .btn{color:#07211e}
.btn.g{background:transparent;color:var(--acc);border:1.5px solid var(--acc);margin-top:8px}
.big{font-size:48px;font-weight:800;text-align:center;margin:8px 0 0}.c{text-align:center;color:var(--mut);margin:0 0 14px}
.miss{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;font-size:14px}.miss b{display:block}
.hid{display:none}
</style></head><body><main id="app"></main>

ess at the elastic limit","The area of the elastic zone","The slope of the curve","Final resistance = maximum stress before fracture.",1],["C","Ductility is the plastic deformation obtained by:","Traction forces","Compression forces","Shear forces","Torsion","Ductility = traction. Malleability = compression.",1],["C","Malleability is the plastic deformation obtained by:","Compressive forces","Traction forces","Cyclic forces","Heat","Example: gold-rich alloys for inlays and onlays.",1],["C","An example of a ductile material given in the slides is:","An orthodontic wire","A gypsum cast","Enamel","Porcelain","Orthodontic wire for ductility; gold alloys for malleability.",1],["C","Brittleness (fragility) is characterised by:","A short plastic zone and a tendency to break","A long plastic zone","A high resilience","A low elastic modulus","Fragility is the opposite of ductility/malleability.",1],["C","Toughness is:","The quantity of energy absorbed until fracture occurs","The energy stored elastically","The elastic modulus","The proportional limit","Toughness = resistance to fracture = energy absorbed until fracture.",1],["C","On a graph, a rigid and resistant material shows:","A steep line and a high final resistance","A flat line","A very long plastic zone with low stress","A line below the others","Rigid: high elastic modulus (steep). Resistant: high final stress.",2],["C","On a graph, a flexible, malleable and low-resistance material shows:","A shallow slope, a long plastic zone and a low final stress","A steep slope and a short plastic zone","A very high final stress","No plastic zone","Low EM (flexible), long plastic zone (malleable), low final stress.",3],["D","The rate of loading is:","The speed at which a force is applied to a material","The number of cycles before fracture","The temperature of the test","The area of the sample","It can change the mechanical properties.",1],["D","The faster a material is loaded:","The higher its proportional limit and final resis ax is placed:","On top of the flame, not inside it","Inside the flame","Far away","In water","Slide 41.",2],["L","Heating in hot water is:","More uniform but the wax can be partially dissolved","Slow","Faster","Not possible","Slide 41.",3],["L","Heating in a thermostat oven is:","Slow but with controlled temperature","Fast","Uncontrolled","Impossible","Slide 41.",2],["L","Creep (flow) of wax is:","The capacity to deform under light pressure (plastic deformation)","Elastic recovery","Hardening","Contraction","Slide 42.",1],["L","Elastic memory of wax is:","The capacity to recover its initial shape after manipulation","Permanent deformation","Hardness","Flow","Slide 43.",2],["L","Distortion of wax is:","The degree of permanent deformation due to residual tension","Elastic recovery","Flow","Strength","Slide 43.",1],["L","Distortion is due to residual tensions from:","Thermal changes and dimensional changes","Humidity only","Colour","Setting","Slide 43.",2],["L","How to minimize wax distortion?","Uniform heating, fast coating, cold storage","Slow coating","Warm storage","Uneven heating","Slide 45.",1],["L","Fast coating of a wax pattern prevents:","Contraction of the pattern","Expansion","Colouring","Hardening","Coating rigidity prevents contraction.",2],["L","The mechanical properties of waxes (strength, PL, EM) are:","Low, and they decrease when temperature rises","High","Constant","Increase with temperature","Slide 46.",1],["L","Paraffin EM decreases by:","91% from 24 to 30 °C","58% from 23 to 37 °C","10%","0%","Slide 46.",3],["L","Carnauba EM decreases by:","58% from 23 to 37 °C","91% from 24 to 30 °C","10%","0%","Slide 46.",3],["L","Modelling compounds are:","Thermoplastic material plus filler, also called Godiva","Pure wax","Hydrocolloids","Cement","Slide 48.",1],["L","Fillers in modelling compounds include:","Talc, chalk, barium sulfate","Beeswax","Shellac","Water","They increase resistance and consistency and reduce flow.",1],["L","Plasticizers such as stearic acid:","Help disperse the fillers","Colour","Harden","Reduce flow","Slide 49.",2],["L","Lubricants such as glycerine:","Provide suitable working consistency at intraoral temperature","Harden","Colour","Disperse filler","Slide 49.",2],["L","High-fusion modelling compounds soften at:","More than 60 °C and are used for individual trays","50-60 °C","Less than 50 °C","Room temperature","Slide 50.",2],["L","Medium-fusion modelling compounds soften at:","50-60 °C, used for impressions","More than 60 °C","Less than 50 °C","80 °C","Slide 50.",2],["L","ADA Type I modelling compound is:","Low fusion (55-65 °C), edentulous impressions, bars or sheets","High fusion","For trays","Hard","Slide 51. Note: it overlaps with the 'medium fusion' range of slide 50.",3],["L","ADA Type II modelling compound is:","High fusion (70 °C or more), for individualized trays","Low fusion","For edentulous impressions","Soft","Slide 51.",2],["L","Linear thermal expansion coefficient of modelling compounds:","0.3-0.4% from mouth to room temperature","4-6%","40%","None","Slide 52.",3],["L","Modelling compounds are manipulated with:","Dry heating at the right temperature to avoid burns, and poured immediately","Wet heating","A freezer","No heat","Slide 54.",2],["L","Modelling compounds are presented as:","Bars and tablets","Powder","Liquid","Paste","Slide 53.",1]]};
const $=s=>document.querySelector(s);
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const TOPICS={Props:'Properties',Imp:'Impressions',Gyp:'Gypsum',Wax:'Waxes'};
const MAP={A:'Props',B:'Props',C:'Props',D:'Props',E:'Props',F:'Imp',G:'Imp',H:'Imp',I:'Gyp',J:'Gyp',K:'Wax',L:'Wax'};
const LES={A:'Lesson 1',B:'Lesson 2',C:'Lesson 2',D:'Lesson 2',E:'Lesson 2',F:'Lesson 3',G:'Lesson 3',H:'Lesson 3',I:'Lesson 4',J:'Lesson 4',K:'Lesson 5',L:'Lesson 5'};
const POOL={Props:[],Imp:[],Gyp:[],Wax:[]};
D.mcq.forEach(r=>POOL[MAP[r[0]]].push({t:MAP[r[0]],tag:LES[r[0]],q:r[1],c:r[2],w:[r[3],r[4],r[5]],e:r[6]}));
const ALL=[].concat(POOL.Props,POOL.Imp,POOL.Gyp,POOL.Wax);
// ---- game state
let G=null,T0=null,TI=null;
const MODES={
 blitz:{n:'Blitz 90 s',d:'Answer as many as you can in 90 seconds. Streaks add bonus points.',time:90},
 survie:{n:'Survival',d:'3 lives. How far can you go?',lives:3},
 run:{n:'Run of 20',d:'20 questions, then your score and the ones to review.',len:20}
};
function home(){
  clearInterval(TI);G=null;
  const b=store.get('bbest')||{};
  $('#app').innerHTML=`<p class="eyebrow">Dental Biomaterials</p><h1>Biomaterials Arena</h1>
  <p class="lead">${ALL.length} quick questions from the five lessons. Pick a mode, pick a topic, play a few rounds. Every miss comes back at the end.</p>
  <h3>Topic</h3><div class="modes" id="tp">
   ${[['mix','Everything','Lessons 1 to 5'],['Props','Properties','Forces, stress-strain, biocompatibility'],['Imp','Impressions','Techniques, viscosities, alginate'],['Gyp','Gypsum','Types, setting, properties'],['Wax','Waxes','Waxes and modelling compounds']].map(x=>`<button class="m" data-tp="${x[0]}"><b>${x[1]}</b><span>${x[2]}</span></button>`).join('')}
  </div><div id="md" class="hid"><h3>Mode</h3><div class="modes">
   ${Object.keys(MODES).map(k=>`<button class="m" data-md="${k}"><b>${MODES[k].n}${b[k+'|'+sel]!=null?`<small>Best ${b[k+'|'+sel]}</small>`:''}</b><span>${MODES[k].d}</span></button>`).join('')}
  </div></div>`;
  document.querySelectorAll('[data-tp]').forEach(e=>e.onclick=()=>{sel=e.dataset.tp;home2()});
}
let sel='mix';
function home2(){
  const b=store.get('bbest')||{};
  $('#app').innerHTML=`<p class="eyebrow">Topic · ${sel==='mix'?'Everything':TOPICS[sel]}</p><h1>Choose a mode</h1><p class="lead"><a href="#" id="bk" style="color:var(--acc)">← change topic</a></p>
  <div class="modes">${Object.keys(MODES).map(k=>`<button class="m" data-md="${k}"><b>${MODES[k].n}${b[k+'|'+sel]!=null?`<small>Best ${b[k+'|'+sel]}</small>`:''}</b><span>${MODES[k].d}</span></button>`).join('')}</div>`;
  $('#bk').onclick=e=>{e.preventDefault();home()};
  document.querySelectorAll('[data-md]').forEach(e=>e.onclick=()=>start(e.dataset.md));
}
function start(m){
  const pool=sel==='mix'?ALL:POOL[sel];
  G={m,q:sh(pool),i:0,score:0,streak:0,best:0,lives:MODES[m].lives||0,miss:[],ok:0,tot:0,done:false};
  if(MODES[m].time){T0=Date.now()+MODES[m].time*1000;TI=setInterval(tick,250)}
  next();
}
function tick(){const l=Math.max(0,Math.ceil((T0-Date.now())/1000));const e=$('#tm');if(e)e.textContent=l+' s';const f=$('#pg');if(f)f.style.width=(l/MODES[G.m].time*100)+'%';if(l<=0&&!G.locked)end()}
function hud(){
  const M=MODES[G.m];
  const left=M.time?`<span class="pill" id="tm">${Math.ceil((T0-Date.now())/1000)} s</span>`:M.lives?`<span class="pill">${'♥'.repeat(G.lives)||'—'}</span>`:`<span class="pill">${G.tot+1} / ${M.len}</span>`;
  return `<div class="top">${left}<span>Score ${G.score}${G.streak>=3?' · 🔥'+G.streak:''}</span></div><div class="bar"><i id="pg" style="width:${M.time?Math.max(0,(T0-Date.now())/(M.time*10)):M.len?(G.tot/M.len*100):100}%"></i></div>`;
}
function next(){
  G.locked=false;
  if(G.i>=G.q.length)G.q=sh(G.q),G.i=0;
  const q=G.cur=G.q[G.i++];
  const opts=sh([q.c,...q.w]);
  $('#app').innerHTML=hud()+`<div class="q"><div class="t">${q.tag}</div><p>${esc(q.q)}</p></div><div id="op">${opts.map(o=>`<button class="o" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div><div id="fb"></div>`;
  document.querySelectorAll('.o').forEach(b=>b.onclick=()=>ans(b));
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function ans(b){
  if(G.locked)return;G.locked=true;const q=G.cur,ok=b.dataset.v===q.c;G.tot++;
  document.querySelectorAll('.o').forEach(x=>{if(x.dataset.v===q.c)x.classList.add('ok');else if(x===b)x.classList.add('no')});
  if(ok){G.ok++;G.streak++;G.best=Math.max(G.best,G.streak);G.score+=10+Math.min(G.streak-1,5)*2}
  else{G.streak=0;G.miss.push(q);if(G.lives)G.lives--}
  const M=MODES[G.m];
  const over=(M.lives&&G.lives<=0)||(M.len&&G.tot>=M.len);
  $('#fb').innerHTML=`<div class="fb ${ok?'ok':'no'}"><b>${ok?'Correct':'Not quite'}</b><br>${esc(q.e)}</div><button class="btn" id="nx">${over?'See results':'Next'}</button>`;
  $('#nx').onclick=()=>over?end():next();
  if(M.time&&ok){setTimeout(()=>{if(G&&G.locked&&!G.done&&!over)next()},900)}
  $('#nx').focus&&0;
}
function end(){
  if(G.done)return;G.done=true;clearInterval(TI);
  const b=store.get('bbest')||{},k=G.m+'|'+sel;const nb=b[k]==null||G.score>b[k];if(nb){b[k]=G.score;store.set('bbest',b)}
  const pct=G.tot?Math.round(G.ok/G.tot*100):0;
  const uniq=[...new Map(G.miss.map(q=>[q.q,q])).values()];
  $('#app').innerHTML=`<p class="eyebrow">${MODES[G.m].n}</p><div class="big">${G.score}</div><p class="c">${nb?'New best score · ':''}${G.ok} / ${G.tot} correct (${pct}%) · best streak ${G.best}</p>
  ${uniq.length?`<h3>To review (${uniq.length})</h3>${uniq.map(q=>`<div class="miss"><b>${esc(q.q)}</b>${esc(q.e)}</div>`).join('')}<button class="btn" id="rm">Replay only my misses</button>`:'<p class="c">Flawless. Nothing to review.</p>'}
  <button class="btn g" id="ag">Play again</button><button class="btn g" id="hm">Menu</button>`;
  $('#ag').onclick=()=>start(G.m);$('#hm').onclick=home;
  if(uniq.length)$('#rm').onclick=()=>{const m=G.m;G={m,q:sh(uniq),i:0,score:0,streak:0,best:0,lives:0,miss:[],ok:0,tot:0,done:false};MODES.rv={n:'Misses',d:'',len:uniq.length};G.m='rv';next()};
}
home();
</script></body></html>
