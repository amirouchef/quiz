<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Dental Eruption Question Bank</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one calm column, like a stained-slide study sheet. Hematoxylin indigo for structure, eosin pink for emphasis. */
:root{
  --bg:#FAF6FA; --surface:#FFFFFF; --fg:#241B35; --muted:#6B5F7E; --line:#E4DBEA;
  --hema:#3A2E8C; --hema-ink:#FFFFFF; --hema-soft:#ECE8F8; --eosin:#C42E79;
  --ok:#17694A; --ok-bg:#E1F3EA; --bad:#A8231B; --bad-bg:#FBE6E3;
  --f-display:'Bricolage Grotesque',system-ui,sans-serif;
  --f-body:'Public Sans',system-ui,-apple-system,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#130F1D; --surface:#1D1830; --fg:#EEE9F7; --muted:#A79BBD; --line:#352C4E;
    --hema:#A99BFF; --hema-ink:#150F2E; --hema-soft:#2A2350; --eosin:#F26CA9;
    --ok:#5CD6A0; --ok-bg:#123628; --bad:#FF8A80; --bad-bg:#3A1A1E; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#130F1D; --surface:#1D1830; --fg:#EEE9F7; --muted:#A79BBD; --line:#352C4E;
  --hema:#A99BFF; --hema-ink:#150F2E; --hema-soft:#2A2350; --eosin:#F26CA9;
  --ok:#5CD6A0; --ok-bg:#123628; --bad:#FF8A80; --bad-bg:#3A1A1E; color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--fg); font:16px/1.55 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:20px 56px;
}
.wrap{max-width:760px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
h1{font-size:clamp(28px,6.4vw,42px);line-height:1.08;letter-spacing:-.01em;margin:6px 0 10px}
h2{font-size:clamp(19px,4.4vw,24px);line-height:1.3;font-weight:600}
h3{font-size:15px;font-weight:600}
p{margin:0}
.eyebrow{font:500 12px var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--eosin)}
.lead{color:var(--muted);max-width:60ch}
.mono{font-family:var(--f-mono)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--eosin);outline-offset:2px}

/* stage ribbon */
.ribbon{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px;margin:22px 0 6px}
.ribbon div{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--hema);border-radius:8px;padding:8px 10px;min-width:0}
.ribbon div:nth-child(1){border-top-color:color-mix(in srgb,var(--hema) 40%,var(--line))}
.ribbon div:nth-child(2){border-top-color:color-mix(in srgb,var(--hema) 55%,var(--line))}
.ribbon div:nth-child(3){border-top-color:color-mix(in srgb,var(--hema) 72%,var(--line))}
.ribbon div:nth-child(5){border-top-color:var(--eosin)}
.ribbon b{display:block;font-family:var(--f-display);font-size:15px}
.ribbon span{font:500 12px var(--f-mono);color:var(--muted)}
.cap{font-size:13px;color:var(--muted);margin-bottom:26px}

.sec-title{margin:26px 0 10px;font:500 12px var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--hema-soft);padding:5px;border-radius:12px}
.seg button{border:0;background:transparent;padding:10px 8px;border-radius:9px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--hema);color:var(--hema-ink)}
.mode-note{margin-top:10px;color:var(--muted);font-size:14.5px;min-height:2.9em}

.scopes{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px}
.scope{display:block;position:relative;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:11px 14px;cursor:pointer;min-width:0}
.scope input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.scope:has(input:checked){border-color:var(--hema);background:var(--hema-soft)}
.scope:has(input:focus-visible){outline:3px solid var(--eosin);outline-offset:2px}
.scope:has(input:disabled){opacity:.5;cursor:not-allowed}
.sc-name{display:block;font-weight:600;line-height:1.3}
.sc-meta{display:block;font-size:13px;color:var(--muted);margin:2px 0 7px}
.meter{display:block;height:5px;background:var(--line);border-radius:3px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--hema);border-radius:3px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--hema);background:var(--hema);color:var(--hema-ink);border-radius:11px;padding:12px 20px;font-weight:600}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--hema)}
.btn.small{padding:8px 13px;font-size:14px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.flagged{border-color:var(--eosin);color:var(--eosin)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row.between{justify-content:space-between}
.start{margin-top:24px}
.linkish{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;font-size:14px}

/* quiz */
.topbar{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-bottom:10px}
.tag{font:500 12px var(--f-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.tag b{color:var(--eosin);font-weight:500}
.clock{font:500 15px var(--f-mono);font-variant-numeric:tabular-nums}
.score{font:500 14px var(--f-mono);font-variant-numeric:tabular-nums;color:var(--muted)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:22px}
.bar i{display:block;height:100%;background:var(--hema);transition:width .25s}
.qtext{margin-bottom:18px}
.lvl{display:inline-block;margin-top:8px;font:500 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:20px;padding:2px 9px}
.opts{display:grid;gap:9px;margin:0;padding:0;list-style:none}
.opt{width:100%;display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;line-height:1.45}
.opt:hover:not([disabled]){border-color:var(--hema)}
.opt .l{font:500 13px var(--f-mono);display:grid;place-items:center;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);color:var(--muted)}
.opt.sel{border-color:var(--hema);background:var(--hema-soft)}
.opt.sel .l{background:var(--hema);color:var(--hema-ink);border-color:var(--hema)}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.ok .l{background:var(--ok);border-color:var(--ok);color:var(--bg)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt.bad .l{background:var(--bad);border-color:var(--bad);color:var(--bg)}
.opt.dim{opacity:.62}
.opt[disabled]{cursor:default}
.fb{margin-top:16px;border-radius:12px;padding:14px 16px;display:grid;gap:6px}
.fb.good{background:var(--ok-bg)}
.fb.miss{background:var(--bad-bg)}
.fb strong{font-family:var(--f-display);font-size:17px}
.fb.good strong{color:var(--ok)}
.fb.miss strong{color:var(--bad)}
.foot{margin-top:22px}
.nav{display:flex;flex-wrap:wrap;gap:6px;margin-top:22px}
.nav button{width:34px;height:34px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);font:500 12px var(--f-mono);font-variant-numeric:tabular-nums;padding:0}
.nav button.a{background:var(--hema-soft);border-color:var(--hema)}
.nav button.f{border-color:var(--eosin);box-shadow:inset 0 -3px 0 var(--eosin)}
.nav button.c{background:var(--hema);color:var(--hema-ink);border-color:var(--hema)}
.warn{margin-top:16px;background:var(--hema-soft);border-radius:12px;padding:14px 16px;display:grid;gap:10px}

/* results */
.big{font-family:var(--f-display);font-size:clamp(54px,16vw,88px);line-height:1;font-weight:700;color:var(--hema);font-variant-numeric:tabular-nums}
.big small{font-size:.4em;color:var(--muted);font-weight:600}
.breakdown{display:grid;gap:10px;margin-top:6px}
.brow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center}
.brow .meter{grid-column:1/-1;height:7px}
.brow .meter i.low{background:var(--eosin)}
.num{font:500 13px var(--f-mono);font-variant-numeric:tabular-nums;color:var(--muted)}
.rev{display:grid;gap:12px;margin-top:12px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:8px;min-width:0}
.item .q{font-weight:600}
.item .yours,.item .right{font-size:15px}
.item .yours b{color:var(--bad)}
.item .right b{color:var(--ok)}
.item .ex{font-size:14.5px;color:var(--muted)}

/* flashcards */
.card{display:block;width:100%;min-height:260px;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:24px 22px;position:relative}
.card.back{background:var(--hema-soft);border-color:var(--hema)}
.card .side{font:500 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--eosin);margin-bottom:12px;display:block}
.card .ans{font-family:var(--f-display);font-size:clamp(19px,4.6vw,24px);line-height:1.3;font-weight:600;display:block;margin-bottom:12px}
.card .ex{color:var(--muted);display:block}
.hint{font-size:13px;color:var(--muted);margin-top:8px}

@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>

<script>
/* Each row: section, question, CORRECT answer, wrong 1, wrong 2, wrong 3, explanation, level (1 recall, 2 understand, 3 tricky). Option order is shuffled at runtime. */
const SECS=[
 {k:'A',n:'Eruption, tooth types and diphyodonty'},
 {k:'B',n:'Primary and mixed dentition'},
 {k:'C',n:'Permanent dentition'},
 {k:'D',n:'Movements and stages'},
 {k:'E',n:'Pre-eruptive stage'},
 {k:'F',n:'Eruptive stage and root formation'},
 {k:'G',n:'Periodontal ligament and gubernacular cord'},
 {k:'H',n:'Intraosseous movement and molecules'},
 {k:'I',n:'Post-eruptive stage'},
 {k:'J',n:'Rhizoclasia and replacement'}
];
const RAW=[
/* A. Eruption, tooth types, diphyodonty */
['A',"Eruption is best defined as…","the emergence of the tooth in the oral cavity, as the tooth in formation migrates from inside the jaw to take its place in the dental arch","the formation of the crown inside the jaw before root development begins","the replacement of the primary teeth by the permanent teeth","the movement of an erupted tooth to compensate for occlusal wear","Eruption is the emergence of the tooth in the oral cavity: the incomplete tooth, still inside the jaw, migrates to the oral environment and takes its place in the dental arch.",1],
['A',"Why do teeth need a considerable movement during eruption?","To reach the occlusal plane, which is required for them to be functional","To complete the formation of the crown","To separate from the dental lamina remnants","To form the epithelial diaphragm","In order to be functional, teeth must travel a long way from their position in the jaw up to the occlusal plane.",1],
['A',"A tooth that cuts, is uniradicular and has flat, sharp coronal edges is a…","incisor","canine","premolar","molar","Incisors cut; they have a single root and flat, sharp edges. Canines tear, and premolars and molars grind.",1],
['A',"Which description matches the canines?","They tear food, with a large and strong root and a conical crown","They cut food, with a single thin root and flat sharp edges","They grind food, with 2 or 3 roots","They shred food, with crowns of 4 or 5 cusps","Canines tear. They have a large, strong root and a conical projection crown. Grinding and 4–5 cusps belong to premolars and molars.",1],
['A',"Which description matches premolars and molars, as grouped in the lesson?","Grinding or shredding, with 2 or 3 roots and crowns with 4 or 5 cusps","Cutting, with one root and flat coronal edges","Tearing, with one large conical root","Cutting, with a conical crown and 3 roots","Premolars and molars are the grinding teeth: 2 or 3 roots and crowns with 4 or 5 cusps.",2],
['A',"Diphyodonty is…","the condition of having two sets of teeth","the condition of having teeth of different shapes","the continuous replacement of teeth throughout life","the condition of having a single set of teeth that is never replaced","Humans are diphyodont: a primary set is followed by a permanent set.",1],
['A',"Which statement best explains why the primary dentition must be replaced?","Teeth cannot increase in size once formed, so the larger adult jaws need a second, larger set","Primary teeth have no roots and cannot function","Primary teeth lack enamel and wear out within a few months","Permanent teeth form from the same germ as primary teeth and push them out","Replacement is an adaptation: infant jaws accommodate only a few small teeth, adult jaws need more and larger teeth, and formed teeth cannot grow.",2],
['A',"Which statement about the reasons for replacement is INCORRECT?","Once formed, teeth can grow in size to follow the growth of the jaws","An infant's jaws can accommodate only a few small teeth","Larger adult jaws require more and larger teeth","Teeth cannot increase in size once they are formed","Teeth cannot grow once formed. That is precisely why a second, larger set is needed. The three other statements are the lesson's arguments.",3],

/* B. Primary and mixed dentition */
['B',"What is the correct order of the three types of dentition?","Deciduous → mixed → permanent","Mixed → deciduous → permanent","Deciduous → permanent → mixed","Permanent → mixed → deciduous","The dentition goes from deciduous (primary), through mixed, to permanent.",1],
['B',"The primary dentition begins and ends at about…","6–8 months and 30–32 months","3–4 months and 24 months","6 years and 12 years","12 months and 48 months","It begins with the first teeth at 6–8 months and ends around 30–32 months.",1],
['B',"How many tooth germs form the primary dentition?","20","16","24","32","The primary dentition has 20 tooth germs: 4 central incisors, 4 lateral incisors, 4 canines and 8 molars. The 32 is the permanent set.",1],
['B',"Which primary teeth erupt first?","Central incisors (6–12 months)","Lateral incisors (9–16 months)","First molars (13–19 months)","Canines (16–23 months)","The central incisors erupt first, at 6–12 months.",1],
['B',"Primary canines erupt at about…","16–23 months","6–12 months","13–19 months","22–33 months","Canines: 16–23 months. Central incisors 6–12, lateral incisors 9–16, first molars 13–19, second molars 22–33.",2],
['B',"Which is the correct average eruption sequence of the primary teeth?","Central incisors → lateral incisors → first molars → canines → second molars","Central incisors → lateral incisors → canines → first molars → second molars","Central incisors → first molars → lateral incisors → canines → second molars","Lateral incisors → central incisors → first molars → canines → second molars","The first molars (13–19 months) come before the canines (16–23 months). This is the classic trap.",3],
['B',"Why is a complete, occluding primary dentition important?","It sets up an integrated circuit of neuromuscular reflexes that stimulate jaw development and TMJ growth","It determines how many permanent teeth will form","It prevents Hertwig's sheath from forming too early","It makes the permanent teeth erupt before 6 years","The complete occlusal primary dentition is a necessary stage for craniofacial and occlusal development and growth.",2],
['B',"The mixed dentition begins and ends with…","the eruption of the first permanent tooth (about 6 years) and the exfoliation of the last temporary tooth","the eruption of the first primary tooth and the eruption of the first permanent tooth","the exfoliation of the first primary tooth and the eruption of the third molars","the eruption of the first permanent molar and the eruption of the wisdom teeth","Mixed dentition starts at about six years with the first permanent tooth and ends when the last temporary tooth is shed.",2],
['B',"Which teeth erupt in the EARLY stage of the mixed dentition?","Incisors and the first permanent molars","Premolars only","Second and third molars","Canines and second molars","Early stage: the anterior sector (incisors) and the first permanent molar. Late stage: the premolars, with the wisdom teeth much later.",2],
['B',"Why is the first permanent molar considered so important?","It acts as a pillar for the correct development and occlusion","It replaces the primary first molar","It is the last tooth of the mixed dentition to erupt","It is the first tooth to be shed","The first permanent molar is a pillar for correct development and occlusion. It erupts behind the primary molars and replaces none of them.",2],

/* C. Permanent dentition */
['C',"Permanent teeth begin to erupt at about…","6 years and continue for another six years, reaching 21 years for wisdom teeth","12 years and continue until 18 years","3 years and continue until 12 years","6 years and finish at 21 years for all teeth","Permanent eruption starts at 6 years and lasts another six years (to 12). Wisdom teeth can reach 21 years.",2],
['C',"Which pair of permanent teeth erupts first?","First molars (6–7 years) and central incisors (6–8 years)","Lateral incisors (8–9 years) and first premolars (9–11 years)","Mandibular canines (10–12 years) and second premolars (10–12 years)","Second molars (12–13 years) and third molars (17–21 years)","The first molars (6–7 y) and the central incisors (6–8 y) open the permanent dentition.",1],
['C',"Which statement about permanent canines is correct?","Mandibular canines erupt at 10–12 years, maxillary canines at 11–13 years","Maxillary canines erupt at 10–12 years, mandibular canines at 11–13 years","Both canines erupt at 6–8 years","Canines erupt before the lateral incisors","Mandibular canines come slightly before maxillary ones: 10–12 versus 11–13 years.",3],
['C',"First permanent premolars erupt at about…","9–11 years","6–7 years","10–12 years","12–13 years","First premolars: 9–11 years. Second premolars: 10–12 years.",2],
['C',"Third molars (wisdom teeth) erupt at about…","17–21 years","12–13 years","13–15 years","21–25 years","Third molars: 17–21 years, behind the second molars (12–13 years).",1],

/* D. Movements and stages */
['D',"Which essential movement is horizontal (longitudinal)?","Translation","Axial (vertical)","Rotation","Inclination","Translation is the horizontal or longitudinal movement.",1],
['D',"The movement of the tooth toward the occlusal plane is called…","axial or vertical movement","translation","rotation","inclination","Axial (vertical) movement brings the tooth toward the occlusal plane.",1],
['D',"Inclination (tilting or tipping) is…","a movement in the transverse axis, forward or backward","a movement around the tooth's own axis","a horizontal movement along the arch","a movement toward the occlusal plane","Inclination is tilting in the transverse axis. Rotation is the movement around the tooth's own axis.",2],
['D',"Which sequence and labelling of the eruption stages is correct?","Pre-eruptive → eruptive (pre-functional) → post-eruptive (functional)","Pre-functional → pre-eruptive → functional","Eruptive (functional) → pre-eruptive → post-eruptive (pre-functional)","Pre-eruptive (functional) → eruptive → post-eruptive (pre-functional)","Stage 1 is pre-eruptive, stage 2 is eruptive (pre-functional) and stage 3 is post-eruptive (functional).",2],
['D',"How does the lesson describe the process of eruption?","A complex series of events in a continuous process that moves the tooth in three-dimensional space","A single event that occurs when the crown breaks through the gingiva","A purely vertical movement that stops at the gingival margin","A process driven only by root growth","Eruption is continuous and three-dimensional, not a single event.",1],
['D',"Which stage does the lesson label 'functional'?","Post-eruptive stage","Pre-eruptive stage","Eruptive stage","Replacement stage","The post-eruptive stage is the functional one: the tooth already chews.",1],

/* E. Pre-eruptive stage */
['E',"At the pre-eruptive stage, the tooth germ…","lies inside the maxilla or mandible and has complete coronal development","has finished its root and touches the antagonist","is already in the oral cavity","is a bud without enamel organ","Pre-eruptive: the germ is inside the jaw bone with its crown fully developed.",1],
['E',"The pre-eruptive stage ends with…","the beginning of Hertwig's sheath formation, when root formation is initiated","contact of the tooth with the antagonist","the gingival break","the fusion of the oral epithelium with the reduced enamel epithelium","It ends when Hertwig's sheath starts forming. Root formation then marks the start of the eruptive stage.",2],
['E',"The pre-eruptive stage begins at the…","follicular (apposition) stage","bud stage","cap stage","moment of root formation","It begins at the follicular (apposition) stage, when hard tissue deposition starts.",2],
['E',"Which movement is the only one present during the pre-eruptive stage?","Translation (lateral displacement)","Axial movement toward the occlusal plane","Rotation around the tooth's own axis","Inclination in the transverse axis","Only translation (lateral displacement) occurs while the enamel organ matures inside the bone.",2],
['E',"Where does the pre-eruptive movement take place?","Inside the bone, while the enamel organ matures","In the oral cavity after the gingival break","After contact with the antagonist","Only after root completion","Pre-eruptive movements are made by the germs within the jaw tissues.",1],
['E',"Which is NOT a listed feature of the pre-eruptive stage?","Formation of one third of the root","Complete coronal development","Reduced enamel (dental) epithelium","A tooth socket that favors the primitive alveolus","One third of the root formed belongs to the eruptive stage, when movement becomes axial.",3],
['E',"Compared with permanent germs, temporary germs show…","rapid development and complex, mainly lateral movements","slow development and mainly vertical movements","slow development and complex lateral movements","rapid development and simple vertical movements","Temporary germs: rapid, complex, lateral. Permanent germs: slower (they are larger), less complex, vertical.",3],
['E',"Pre-eruptive tooth movement is performed by…","deciduous and permanent germs within the jaw tissues, before they begin to erupt","the erupted tooth, to compensate for wear","only the permanent germs, after exfoliation of the primary tooth","the root apex after contact with the antagonist","Pre-eruptive movement is made by both deciduous and permanent germs inside the jaw.",2],

/* F. Eruptive stage and root formation */
['F',"The eruptive stage moves the tooth from…","its position within the bone to its occlusal location in the mouth","the occlusal plane back toward the alveolar crest","the dental lamina to the dental papilla","its position in the oral mucosa to the bone","The eruptive stage (pre-functional) brings the tooth from its position inside the bone to its occlusal location.",1],
['F',"The eruptive stage starts with ___ and ends with ___.","root formation; contact with the antagonist tooth","crown completion; Hertwig's sheath formation","contact with the antagonist; tooth loss","the gingival break; exfoliation of the primary tooth","Start: root formation. End: contact of the tooth with the antagonist, when the post-eruptive stage begins.",2],
['F',"When do the tooth movements become axial until eruption?","When about one third of the root is formed","When the crown is complete","When the root is complete","When the tooth touches the antagonist","Once 1/3 of the root is formed, the movements become axial until eruption.",2],
['F',"Which set lists the factors involved in the eruptive stage?","Root formation, periodontal ligament development, gubernacular cord","Crown formation, enamel maturation, dental lamina","Root formation, enamel knot, vestibular lamina","Periodontal ligament, enamel organ, stellate reticulum","The three factors discussed: root formation, PDL development and the gubernacular cord.",2],
['F',"Root formation starts with the proliferation of…","Hertwig's epithelial root sheath, forming the epithelial diaphragm","the gubernacular cord, forming the epithelial diaphragm","the stellate reticulum, forming the cervical loop","the dental sac, forming cementoid","Proliferation of Hertwig's epithelial root sheath (the root-inducing phenomenon) forms the epithelial diaphragm.",1],
['F',"What does Hertwig's sheath induce in the adjacent dental pulp cells?","Differentiation into odontoblasts that form root dentin","Differentiation into cementoblasts that form cementum","Differentiation into osteoblasts that form alveolar bone","Differentiation into fibroblasts that form the PDL","Cells overlying the inner layer of the sheath induce pulp cells to become odontoblasts. Cementoblasts come from the dental sac.",2],
['F',"Mesenchymal cells of the dental sac differentiate into…","cementoblasts, osteoblasts and fibroblasts","odontoblasts, ameloblasts and fibroblasts","cementoblasts, odontoclasts and osteoclasts","ameloblasts, cementoblasts and osteoblasts","Sac cells give cementoblasts (cementum), osteoblasts (bone) and fibroblasts (PDL).",2],
['F',"The remnants of Hertwig's sheath left in the periodontium are called…","Malassez remains, which have a regenerative function","gubernacular remnants","reduced enamel epithelium","junctional epithelium","Remnants of the sheath move toward the periphery and persist as Malassez remains.",1],
['F',"Is root formation necessary for a tooth to erupt?","No: rootless teeth erupt, but root growth may influence eruption","Yes: no tooth can erupt without a root","Yes: root growth is the only force behind eruption","No: the root has no influence at all","The lesson says root formation is not necessary for eruption (rootless teeth erupt), but it may influence it.",3],
['F',"How can root growth favor eruption?","The root grows downward, giving an upward thrust through a pressure difference, and increases the length of the tooth","It contracts and pulls the tooth toward the oral epithelium","It replaces the PDL with bone","It fuses the reduced enamel epithelium with the oral epithelium","Root growth in the bone increases tooth length and thrusts the tooth upward.",2],

/* G. PDL and gubernacular cord */
['G',"The periodontal ligament traction theory proposes that…","PDL fibroblasts contract and connect with collagen fibers of bone and cementum, moving the tooth toward the alveolar ridge until it contacts the antagonist","the dental papilla pushes the tooth toward the oral cavity","the gubernacular cord pulls the tooth through the bone","the pressure of the stellate reticulum lifts the crown","The theory says contractile fibroblasts link bone and root cementum collagen fibers, drawing the tooth toward the alveolar ridge.",2],
['G',"Periodontal fibroblasts favor eruption because they…","synthesize and degrade collagen simultaneously (remodeling) and have high contractile capacity","only synthesize collagen and never degrade it","differentiate into odontoclasts","secrete enamel matrix","Remodeling plus a high contractile capacity is the key to the traction theory.",2],
['G',"Which observation argues AGAINST the PDL as a determining factor of eruption?","There are cases where the PDL is present but the tooth does not erupt","Fibroblasts have high tensile strength","The PDL is formed and renewed continuously","Fibroblasts synthesize and degrade collagen","For: the tensile strength of fibroblasts. Against: cases where the PDL is present yet the tooth does not erupt.",3],
['G',"Periodontal fibers are formed between…","the cementum and the alveolar bone","the enamel and the dentin","the dentin and the pulp","the cementum and the gingival epithelium","Periodontal fibers run from the cementum to the bone.",2],
['G',"Which cell of the dental sac forms the collagen fibers and ground substance of the PDL?","Fibroblast","Cementoblast","Osteoblast","Odontoblast","Sac cells differentiate into cementoblasts, osteoblasts and fibroblasts. Fibroblasts form the PDL matrix.",1],
['G',"The gubernacular cord is…","a strand of fibrous tissue containing remnants of the dental lamina that connects the follicle to the lamina propria of the oral mucosa","a bundle of PDL fibers anchored in the cementum","a strand of epithelium derived from Hertwig's sheath","a vascular channel from the pulp to the apical foramen","The gubernacular cord maintains the connection of the fibrocellular follicle with the oral mucosa.",2],
['G',"The gubernacular cord is present in…","permanent teeth, not in deciduous teeth","deciduous teeth only","both deciduous and permanent teeth","neither of them","The lesson stresses it: present in permanent teeth, not in deciduous.",1],
['G',"Why is the alveolar bone compared to a gruyère cheese?","It has holes in which the periodontal ligament is anchored, besides its anchorage in the cementum","It is dense and compact, without holes","It is soft and fills with Hertwig's sheath","It resorbs completely after eruption","The PDL must anchor inside the bone holes and on the cementum.",2],

/* H. Intraosseous movement and molecules */
['H',"Extraosseous eruptive movement is the one that goes…","from the gingival break to the occlusal plane","inside the jaw","from birth to the first gingival break","only along the arch, horizontally","Intraosseous: inside the jaw. Extraosseous: from the gingival break to the occlusal plane.",2],
['H',"Which eruptive movement takes place inside the jaw, before the tooth breaks through the gingiva?","Intraosseous","Extraosseous","Post-eruptive","Interproximal","Intraosseous movement happens inside the jaw.",1],
['H',"Tooth movement results from a balance between…","tissue destruction (bone, connective tissue, epithelium) and tissue formation (bone, PDL, root)","enamel formation and dentin formation","bone resorption only","pulp growth and root resorption","Eruption needs the simultaneous removal and formation of tissue.",2],
['H',"Which molecule induces tooth eruption and restores bone resorption?","CSF-1 (colony stimulating factor)","EGF","TGF-α","FGF4","CSF-1 induces eruption and restores bone resorption. EGF and TGF-α accelerate eruption.",2],
['H',"Which pair of growth factors accelerates eruption?","EGF and TGF-α","CSF-1 and Msx1","BMP4 and Lef1","Pax9 and AXIN2","EGF and TGF-α accelerate eruption. The other pairs belong to odontogenesis or to its anomalies.",2],

/* I. Post-eruptive stage */
['I',"The post-eruptive stage starts and ends with…","contact and chewing function of the antagonist; tooth loss","root formation; contact with the antagonist","the gingival break; completion of the root","birth; the eruption of the third molars","It starts when the antagonist makes contact and chews. It ends with tooth loss.",1],
['I',"Post-eruptive tooth movement is performed by…","the erupted tooth, to keep its position in occlusion as the jaws grow and the tooth wears","the germ inside the bone","the dental sac before root formation","the primary tooth during rhizoclasia","It keeps the erupted tooth in occlusion while the jaws grow, and compensates for wear.",2],
['I',"Compared with the eruptive stage, post-eruptive movements are…","slower and performed after the tooth reaches its functional position","faster and performed inside the bone","identical in speed and direction","purely rotational","They are slower and happen after the occlusal plane has been reached.",2],
['I',"Which is NOT a feature of post-eruptive movements?","Moving the tooth from the bone to the gingival break","Accommodating growing jaws","Compensating continuous occlusal abrasion","Accommodating interproximal abrasion","Moving from the bone to the gingival break is an eruptive (intraosseous) movement.",3],
['I',"The accommodation of jaw growth ends…","toward the end of the second decade (14–18 years), when jaw growth ceases","at 6 years","at 21 years, with the wisdom teeth","at tooth loss","It is related to condylar growth and ends when jaw growth ceases.",2],
['I',"What is used as a fixed reference point to describe accommodating growth?","The inferior dental canal, from which the apexes move 2–3 mm","The cementoenamel junction, from which the crowns move 7 mm","The occlusal plane, from which the crowns move 2–3 mm","The alveolar crest, from which the apexes move 1 mm","The apexes of the teeth are moved 2–3 mm from the inferior dental canal, which is the fixed reference.",3],
['I',"Which statement about accommodating growth timing is correct?","It occurs earlier in girls than in boys","It occurs earlier in boys than in girls","It occurs at the same age in both sexes","It occurs only in the mandible","Accommodating growth occurs earlier in girls than in boys.",2],
['I',"Compensation for occlusal wear is characterized by…","deposition of secondary cementum at the apex, balancing abrasion, only after the tooth has moved","deposition of secondary dentin in the crown before the tooth has moved","resorption of the apex by odontoclasts","new enamel deposition on the occlusal surface","It uses the same mechanisms as eruptive movement; secondary cementum at the apex balances the physiological abrasion.",2],
['I',"Interproximal wear in the mandible can reach more than…","7 mm","1 mm","2 mm","12 mm","Wear at the proximal contact points can be considerable: more than 7 mm in the mandible.",2],

/* J. Rhizoclasia and replacement */
['J',"Rhizoclasia is…","the resorption of hard root tissues (roots and alveolar bone) and soft tissues (pulp, PDL)","the formation of root dentin by odontoblasts","the deposit of secondary cementum at the apex","the fusion of the oral and reduced enamel epithelium","Rhizoclasia is the resorption of the hard root tissues and of the soft tissues, pulp and periodontal ligament.",1],
['J',"Root resorption of deciduous teeth starts on the ___ surface, and the tooth is shed with…","lingual; much of its pulp chamber intact","buccal; its pulp completely necrotic","lingual; no pulp at all","buccal; its pulp intact","Resorption occurs on the lingual surface; deciduous teeth are shed with much of the pulp chamber intact.",2],
['J',"Where do permanent premolars develop?","Between the divergent roots of the deciduous molars","Apical to the roots of the deciduous canines","On the buccal side of the deciduous molar crowns","Inside the pulp chamber of the deciduous molars","Premolars develop between the divergent roots of deciduous molars and erupt in an occlusal direction.",2],
['J',"Rhizoclasia is caused by…","a sac or pericoronal tissue that covers the crowns of the unerupted permanent teeth","Hertwig's sheath of the primary tooth","the gubernacular cord of the primary tooth","Malassez remains","The pericoronal tissue around the unerupted tooth drives the resorption. Deciduous teeth have no gubernacular cord.",3],
['J',"Which cells remove mineralized tissue during rhizoclasia?","Odontoclasts (dentinoclasts and cementoclasts)","Odontoblasts and cementoblasts","Fibroblasts and macrophages","Ameloblasts and osteoblasts","Hard tissue removal is done by odontoclasts, which are histologically similar to osteoclasts.",1],
['J',"Odontoclasts derive from…","monocytes that migrate from blood vessels and fuse into multinucleated cells","odontoblasts of the dental pulp","fibroblasts of the PDL","cells of Hertwig's sheath","They arise from monocytes, migrate from blood vessels to the resorption site and fuse. They show a ruffled border.",2],
['J',"Dentinoclasts and cementoclasts resorb, respectively…","dentin and cementum","cementum and dentin","enamel and dentin","bone and cementum","Dentinoclasts resorb dentin; cementoclasts resorb cementum.",2],
['J',"How does cell death occur in the PDL during rhizoclasia?","Without inflammation, by necrosis or by apoptosis","With intense inflammation, by necrosis only","By osteoclast resorption of the fibers","By hyperplasia of the fibroblasts","Cell death occurs without inflammation: necrosis (cytotoxic alterations) or apoptosis, with phagocytosis by macrophages or undamaged fibroblasts.",3],
['J',"If a permanent tooth germ is congenitally missing or in an aberrant position, the deciduous tooth…","has its replacement delayed","is exfoliated earlier","is replaced as usual","is replaced by a supernumerary tooth","The pressure of the erupting permanent tooth plays an important role. Without it, replacement is delayed.",2],
['J',"Why is exfoliation accelerated by the erupting permanent tooth?","Pressure causes root loss and loss of supporting tissue, so the tooth supports less chewing force","The pressure thickens the PDL","The pressure stimulates cementoblasts","The permanent tooth pulls the primary tooth upward","Less support means less chewing force is tolerated, so exfoliation speeds up.",2],
['J',"Which statement about the replacement pattern is correct?","Mandibular primary teeth exfoliate before their maxillary counterparts, except the second molars","Maxillary primary teeth exfoliate before mandibular ones, except the canines","Replacement is asymmetrical between right and left","Exfoliation occurs earlier in boys than in girls","Replacement is symmetrical; mandibular teeth go first except the second molars; exfoliation is earlier in girls.",3]
];
const QS=RAW.map((r,i)=>({id:i+1,s:r[0],q:r[1],c:r[2],w:[r[3],r[4],r[5]],e:r[6],l:r[7]}));

</script>

<script>
(function(){
const LET=['A','B','C','D'];
const LVL={1:'Recall',2:'Understand',3:'Tricky'};
const STAGES=[['Pre-eruptive','inside the bone'],['Eruptive','root to antagonist'],['Post-eruptive','function to tooth loss']];
const KEY='dental-eruption-qb-v1';
const app=document.getElementById('app');
let store={done:{}};
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&s.done)store=s}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}}
const $=s=>document.querySelector(s);
function esc(t){return String(t).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function secName(k){return SECS.find(s=>s.k===k).n}
function fmt(ms){const t=Math.floor(ms/1000);return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')}
const isOk=it=>it.pick!==null&&it.opts[it.pick].ok;

let mode='practice',scope='all',S=null,C=null,timer=null,resetAsk=false;

const MODE_NOTE={
 practice:'One question at a time. You see right away whether you were correct and read the explanation.',
 exam:'No feedback until you finish. Move back and forth, flag questions, and watch the clock.',
 cards:'The question on the front, the answer and its explanation on the back. Good for a last pass.'
};

function poolFor(sc){
 if(sc==='all')return QS.slice();
 if(sc==='weak')return QS.filter(q=>store.done[q.id]==='w');
 return QS.filter(q=>q.s===sc);
}

/* ---------- HOME ---------- */
function home(){
 clearInterval(timer);S=null;C=null;
 const weak=poolFor('weak').length;
 if(scope==='weak'&&!weak)scope='all';
 const tried=QS.filter(q=>store.done[q.id]).length;
 const right=QS.filter(q=>store.done[q.id]==='c').length;
 const rows=[{k:'all',n:'All sections'}].concat(SECS).map(s=>{
  const p=poolFor(s.k),c=p.filter(q=>store.done[q.id]==='c').length;
  return `<label class="scope"><input type="radio" name="scope" value="${s.k}" ${scope===s.k?'checked':''}><span class="sc-name">${esc(s.n)}</span><span class="sc-meta">${p.length} questions · ${c} answered correctly</span><span class="meter"><i style="width:${Math.round(c/p.length*100)}%"></i></span></label>`;
 }).join('')+`<label class="scope"><input type="radio" name="scope" value="weak" ${scope==='weak'?'checked':''} ${weak?'':'disabled'}><span class="sc-name">My mistakes</span><span class="sc-meta">${weak?weak+' questions you last got wrong':'Nothing to review yet'}</span><span class="meter"><i style="width:${weak?Math.round(weak/QS.length*100):0}%;background:var(--eosin)"></i></span></label>`;
 app.innerHTML=`
 <p class="eyebrow">Dental Eruption · Lesson 3</p>
 <h1>Dental Eruption Question Bank</h1>
 <p class="lead">${QS.length} single-answer questions with a full explanation for each one, built from the Lesson 3 slides: types of dentition, the three eruption stages, the factors behind eruption, post-eruptive movements and rhizoclasia.</p>
 <div class="ribbon" aria-label="Eruption stages">${STAGES.map(s=>`<div><b>${s[0]}</b><span>${s[1]}</span></div>`).join('')}</div>
 <p class="cap">The three eruption stages as taught in the lesson. Progress so far: ${right} of ${QS.length} answered correctly${tried?`, ${tried} attempted`:''}.</p>
 <p class="sec-title">1 · Mode</p>
 <div class="seg" role="group" aria-label="Mode">
  ${[['practice','Practice'],['exam','Exam'],['cards','Flashcards']].map(m=>`<button type="button" data-a="mode" data-v="${m[0]}" aria-pressed="${mode===m[0]}">${m[1]}</button>`).join('')}
 </div>
 <p class="mode-note" id="mnote">${MODE_NOTE[mode]}</p>
 <p class="sec-title">2 · Scope</p>
 <div class="scopes">${rows}</div>
 <div class="start row between">
  <button type="button" class="btn" data-a="start">Start</button>
  ${resetAsk?`<span class="row"><span class="tag">Erase saved progress?</span><button type="button" class="btn ghost small" data-a="reset-yes">Erase</button><button type="button" class="btn ghost small" data-a="reset-no">Keep</button></span>`:`<button type="button" class="linkish" data-a="reset">Reset progress</button>`}
 </div>`;
}

/* ---------- SESSION ---------- */
function startSession(m,pool){
 if(!pool.length)return;
 S={mode:m,i:0,t0:Date.now(),ask:false,over:false,rf:'wrong',
  list:shuffle(pool).map(q=>({q,opts:shuffle([{t:q.c,ok:true}].concat(q.w.map(t=>({t,ok:false})))),pick:null,flag:false}))};
 clearInterval(timer);
 if(m==='exam'){timer=setInterval(()=>{const e=$('#clock');if(e)e.textContent=fmt(Date.now()-S.t0)},1000)}
 quiz();
}

function quiz(){
 const ex=S.mode==='exam',it=S.list[S.i],q=it.q,n=S.list.length;
 const ans=it.pick!==null,reveal=!ex&&ans;
 const nDone=S.list.filter(x=>x.pick!==null).length;
 const good=S.list.filter(isOk).length,bad=nDone-good;
 const opts=it.opts.map((o,k)=>{
  let cls='opt';
  if(ex&&it.pick===k)cls+=' sel';
  if(reveal){if(o.ok)cls+=' ok';else if(it.pick===k)cls+=' bad';else cls+=' dim'}
  return `<li><button type="button" class="${cls}" data-a="pick" data-i="${k}" ${reveal?'disabled':''}><span class="l">${LET[k]}</span><span>${esc(o.t)}</span></button></li>`;
 }).join('');
 let fb='';
 if(reveal){
  const ok=isOk(it);
  fb=`<div class="fb ${ok?'good':'miss'}" role="status"><strong>${ok?'Correct':'Not quite'}</strong>${ok?'':`<p><b>Answer:</b> ${esc(q.c)}</p>`}<p>${esc(q.e)}</p></div>`;
 }
 const last=S.i===n-1;
 let foot;
 if(ex){
  const un=n-nDone;
  foot=`<div class="row between foot">
   <span class="row"><button type="button" class="btn ghost" data-a="prev" ${S.i===0?'disabled':''}>Previous</button><button type="button" class="btn ghost" data-a="next" ${last?'disabled':''}>Next</button></span>
   <span class="row"><button type="button" class="btn ghost small ${it.flag?'flagged':''}" data-a="flag" aria-pressed="${it.flag}">${it.flag?'Flagged':'Flag'}</button><button type="button" class="btn small" data-a="finish">Finish exam</button></span>
  </div>
  ${S.ask?`<div class="warn" role="alert"><p>${un?`You left ${un} question${un>1?'s':''} unanswered. They will count as wrong.`:'All questions answered.'} Finish and see your results?</p><div class="row"><button type="button" class="btn small" data-a="finish-yes">Finish</button><button type="button" class="btn ghost small" data-a="finish-no">Keep going</button></div></div>`:''}
  <div class="nav" aria-label="Question navigator">${S.list.map((x,k)=>`<button type="button" data-a="jump" data-i="${k}" class="${x.pick!==null?'a':''} ${x.flag?'f':''} ${k===S.i?'c':''}" aria-label="Question ${k+1}${x.flag?', flagged':''}${x.pick!==null?', answered':''}">${k+1}</button>`).join('')}</div>`;
 }else{
  foot=`<div class="row between foot"><button type="button" class="linkish" data-a="home">Quit</button><button type="button" class="btn" data-a="${last?'finish-yes':'next'}" ${ans?'':'disabled'}>${last?'See results':'Next question'}</button></div>`;
 }
 app.innerHTML=`
 <div class="topbar"><span class="tag">Question ${S.i+1} of ${n} · <b>${esc(secName(q.s))}</b></span>
  ${ex?`<span class="clock" id="clock">${fmt(Date.now()-S.t0)}</span>`:`<span class="score" aria-label="Score so far">✓ ${good} · ✗ ${bad}</span>`}</div>
 <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="${n}" aria-valuenow="${ex?nDone:S.i+(ans?1:0)}"><i style="width:${(ex?nDone:S.i+(ans?1:0))/n*100}%"></i></div>
 <div class="qtext" id="q"><h2>${esc(q.q)}</h2><span class="lvl">${LVL[q.l]}</span></div>
 <ul class="opts">${opts}</ul>${fb}${foot}`;
 window.scrollTo(0,0);
}

function pick(k){
 const it=S.list[S.i];
 if(S.mode==='practice'){
  if(it.pick!==null)return;
  it.pick=k;store.done[it.q.id]=it.opts[k].ok?'c':'w';save();
 }else{it.pick=k}
 quiz();
}

function finish(){
 clearInterval(timer);
 S.list.forEach(it=>{if(S.mode==='exam'){store.done[it.q.id]=isOk(it)?'c':'w'}});
 save();S.end=Date.now();S.over=true;results();
}

/* ---------- RESULTS ---------- */
function results(){
 const L=S.list,n=L.length,ok=L.filter(isOk).length,pct=Math.round(ok/n*100);
 const verdict=pct>=85?'Exam-ready on this set. Keep the weak spots fresh.':pct>=70?'Solid base. Tighten the sections marked in pink.':'Keep drilling. Redo your mistakes, then try again.';
 const secs=SECS.map(s=>{const l=L.filter(x=>x.q.s===s.k);if(!l.length)return '';const c=l.filter(isOk).length,p=Math.round(c/l.length*100);
  return `<div class="brow"><span>${esc(s.n)}</span><span class="num">${c}/${l.length}</span><span class="meter"><i class="${p<70?'low':''}" style="width:${p}%"></i></span></div>`}).join('');
 const wrong=L.filter(x=>!isOk(x));
 const shown=S.rf==='wrong'?wrong:L;
 const rev=shown.map(it=>{const k=L.indexOf(it);
  const yours=it.pick===null?'<b>No answer</b>':`<b>${esc(it.opts[it.pick].t)}</b>`;
  return `<article class="item"><span class="tag">Question ${k+1} · ${esc(secName(it.q.s))}</span><p class="q">${esc(it.q.q)}</p>
  ${isOk(it)?'':`<p class="yours">Your answer: ${yours}</p>`}<p class="right">Correct: <b>${esc(it.q.c)}</b></p><p class="ex">${esc(it.q.e)}</p></article>`}).join('');
 app.innerHTML=`
 <p class="eyebrow">${S.mode==='exam'?'Exam':'Practice'} complete · ${fmt(S.end-S.t0)}</p>
 <div class="big">${ok}<small> / ${n}</small></div>
 <h2 style="margin-top:8px">${pct}% · ${verdict}</h2>
 <div class="row start"><button type="button" class="btn" data-a="retry" ${wrong.length?'':'disabled'}>Redo my ${wrong.length} mistake${wrong.length===1?'':'s'}</button><button type="button" class="btn ghost" data-a="home">Back to start</button></div>
 <p class="sec-title">By section</p><div class="breakdown">${secs}</div>
 <p class="sec-title">Review</p>
 <div class="row"><button type="button" class="btn small ${S.rf==='wrong'?'':'ghost'}" data-a="rf" data-v="wrong">Mistakes (${wrong.length})</button><button type="button" class="btn small ${S.rf==='all'?'':'ghost'}" data-a="rf" data-v="all">All questions</button></div>
 <div class="rev">${rev||'<p class="lead">No mistakes in this run.</p>'}</div>`;
 window.scrollTo(0,0);
}

/* ---------- FLASHCARDS ---------- */
function cards(pool){
 if(!pool.length)return;
 C={list:shuffle(pool),i:0,f:false};renderCard();
}
function renderCard(){
 const q=C.list[C.i],n=C.list.length;
 app.innerHTML=`
 <div class="topbar"><span class="tag">Card ${C.i+1} of ${n} · <b>${esc(secName(q.s))}</b></span><button type="button" class="linkish" data-a="home">Back to start</button></div>
 <div class="bar"><i style="width:${(C.i+1)/n*100}%"></i></div>
 <button type="button" class="card ${C.f?'back':''}" id="card" data-a="flip" aria-live="polite">
  ${C.f?`<span class="side">Answer</span><span class="ans">${esc(q.c)}</span><span class="ex">${esc(q.e)}</span>`:`<span class="side">Question</span><h2>${esc(q.q)}</h2>`}
 </button>
 <p class="hint">Tap the card or press Space to flip. Arrow keys move between cards.</p>
 <div class="row between foot"><button type="button" class="btn ghost" data-a="cprev" ${C.i===0?'disabled':''}>Previous</button><button type="button" class="btn" data-a="cnext" ${C.i===n-1?'disabled':''}>Next card</button></div>`;
}

/* ---------- EVENTS ---------- */
app.addEventListener('change',e=>{if(e.target.name==='scope')scope=e.target.value});
app.addEventListener('click',e=>{
 const b=e.target.closest('[data-a]');if(!b||b.disabled)return;
 const a=b.dataset.a,v=b.dataset.v,i=b.dataset.i!==undefined?+b.dataset.i:null;
 switch(a){
  case 'mode':mode=v;document.querySelectorAll('.seg button').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.v===mode)));$('#mnote').textContent=MODE_NOTE[mode];break;
  case 'start':{const p=poolFor(scope);if(mode==='cards')cards(p);else startSession(mode,p);break}
  case 'reset':resetAsk=true;home();break;
  case 'reset-no':resetAsk=false;home();break;
  case 'reset-yes':store={done:{}};save();resetAsk=false;home();break;
  case 'pick':pick(i);break;
  case 'next':if(S.i<S.list.length-1){S.i++;S.ask=false;quiz()}break;
  case 'prev':if(S.i>0){S.i--;S.ask=false;quiz()}break;
  case 'jump':S.i=i;S.ask=false;quiz();break;
  case 'flag':S.list[S.i].flag=!S.list[S.i].flag;quiz();break;
  case 'finish':S.ask=true;quiz();break;
  case 'finish-no':S.ask=false;quiz();break;
  case 'finish-yes':finish();break;
  case 'home':home();break;
  case 'rf':S.rf=v;results();break;
  case 'retry':startSession('practice',S.list.filter(x=>!isOk(x)).map(x=>x.q));break;
  case 'flip':C.f=!C.f;renderCard();break;
  case 'cnext':if(C.i<C.list.length-1){C.i++;C.f=false;renderCard()}break;
  case 'cprev':if(C.i>0){C.i--;C.f=false;renderCard()}break;
 }
});
document.addEventListener('keydown',e=>{
 if(e.metaKey||e.ctrlKey||e.altKey)return;
 if(S&&!S.over&&$('#q')){
  const k='1234'.indexOf(e.key),k2='abcd'.indexOf(e.key.toLowerCase());
  const idx=k>-1?k:k2;
  if(idx>-1&&idx<4){pick(idx);return}
  if(e.key==='ArrowRight'){const nx=S.list[S.i].pick!==null||S.mode==='exam';if(nx&&S.i<S.list.length-1){S.i++;S.ask=false;quiz()}}
  if(e.key==='ArrowLeft'&&S.mode==='exam'&&S.i>0){S.i--;S.ask=false;quiz()}
 }else if(C&&$('#card')){
  if(e.key===' '&&document.activeElement===document.body){e.preventDefault();C.f=!C.f;renderCard()}
  if(e.key==='ArrowRight'&&C.i<C.list.length-1){C.i++;C.f=false;renderCard()}
  if(e.key==='ArrowLeft'&&C.i>0){C.i--;C.f=false;renderCard()}
 }
});
home();
})();
</script>
