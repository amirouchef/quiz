<title>Brain Question Bank</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one calm column, like a stained-slide study sheet. Hematoxylin indigo for structure, eosin pink for emphasis. */
:root{
  --bg:#FAF6FA; --surface:#FFFFFF; --fg:#241B35; --muted:#6B5F7E; --line:#E4DBEA;
  --hema:#3A2E8C; --hema-ink:#FFFFFF; --hema-soft:#ECE8F8; --eosin:#C42E79;
  --ok:#17694A; --ok-bg:#E1F3EA; --bad:#A8231B; --bad-bg:#FBE6E3;
  --f-display:'Bricolage Grotesque',system-ui,sans-serif;
  --f-body:'Public Sans',system-ui,-apple-system,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#130F1D; --surface:#1D1830; --fg:#EEE9F7; --muted:#A79BBD; --line:#352C4E;
    --hema:#A99BFF; --hema-ink:#150F2E; --hema-soft:#2A2350; --eosin:#F26CA9;
    --ok:#5CD6A0; --ok-bg:#123628; --bad:#FF8A80; --bad-bg:#3A1A1E; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#130F1D; --surface:#1D1830; --fg:#EEE9F7; --muted:#A79BBD; --line:#352C4E;
  --hema:#A99BFF; --hema-ink:#150F2E; --hema-soft:#2A2350; --eosin:#F26CA9;
  --ok:#5CD6A0; --ok-bg:#123628; --bad:#FF8A80; --bad-bg:#3A1A1E; color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--fg); font:16px/1.55 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:20px 56px;
}
.wrap{max-width:760px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
h1{font-size:clamp(28px,6.4vw,42px);line-height:1.08;letter-spacing:-.01em;margin:6px 0 10px}
h2{font-size:clamp(19px,4.4vw,24px);line-height:1.3;font-weight:600}
h3{font-size:15px;font-weight:600}
p{margin:0}
.eyebrow{font:500 12px var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--eosin)}
.lead{color:var(--muted);max-width:60ch}
.mono{font-family:var(--f-mono)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--eosin);outline-offset:2px}

/* stage ribbon */
.ribbon{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px;margin:22px 0 6px}
.ribbon div{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--hema);border-radius:8px;padding:8px 10px;min-width:0}
.ribbon div:nth-child(1){border-top-color:color-mix(in srgb,var(--hema) 40%,var(--line))}
.ribbon div:nth-child(2){border-top-color:color-mix(in srgb,var(--hema) 55%,var(--line))}
.ribbon div:nth-child(3){border-top-color:color-mix(in srgb,var(--hema) 72%,var(--line))}
.ribbon div:nth-child(5){border-top-color:var(--eosin)}
.ribbon b{display:block;font-family:var(--f-display);font-size:15px}
.ribbon span{font:500 12px var(--f-mono);color:var(--muted)}
.cap{font-size:13px;color:var(--muted);margin-bottom:26px}

.sec-title{margin:26px 0 10px;font:500 12px var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--hema-soft);padding:5px;border-radius:12px}
.seg button{border:0;background:transparent;padding:10px 8px;border-radius:9px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--hema);color:var(--hema-ink)}
.mode-note{margin-top:10px;color:var(--muted);font-size:14.5px;min-height:2.9em}

.scopes{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px}
.scope{display:block;position:relative;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:11px 14px;cursor:pointer;min-width:0}
.scope input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.scope:has(input:checked){border-color:var(--hema);background:var(--hema-soft)}
.scope:has(input:focus-visible){outline:3px solid var(--eosin);outline-offset:2px}
.scope:has(input:disabled){opacity:.5;cursor:not-allowed}
.sc-name{display:block;font-weight:600;line-height:1.3}
.sc-meta{display:block;font-size:13px;color:var(--muted);margin:2px 0 7px}
.meter{display:block;height:5px;background:var(--line);border-radius:3px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--hema);border-radius:3px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--hema);background:var(--hema);color:var(--hema-ink);border-radius:11px;padding:12px 20px;font-weight:600}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--hema)}
.btn.small{padding:8px 13px;font-size:14px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.flagged{border-color:var(--eosin);color:var(--eosin)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row.between{justify-content:space-between}
.start{margin-top:24px}
.linkish{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;font-size:14px}

/* quiz */
.topbar{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-bottom:10px}
.tag{font:500 12px var(--f-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.tag b{color:var(--eosin);font-weight:500}
.clock{font:500 15px var(--f-mono);font-variant-numeric:tabular-nums}
.score{font:500 14px var(--f-mono);font-variant-numeric:tabular-nums;color:var(--muted)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:22px}
.bar i{display:block;height:100%;background:var(--hema);transition:width .25s}
.qtext{margin-bottom:18px}
.lvl{display:inline-block;margin-top:8px;font:500 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:20px;padding:2px 9px}
.opts{display:grid;gap:9px;margin:0;padding:0;list-style:none}
.opt{width:100%;display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;line-height:1.45}
.opt:hover:not([disabled]){border-color:var(--hema)}
.opt .l{font:500 13px var(--f-mono);display:grid;place-items:center;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);color:var(--muted)}
.opt.sel{border-color:var(--hema);background:var(--hema-soft)}
.opt.sel .l{background:var(--hema);color:var(--hema-ink);border-color:var(--hema)}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.ok .l{background:var(--ok);border-color:var(--ok);color:var(--bg)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt.bad .l{background:var(--bad);border-color:var(--bad);color:var(--bg)}
.opt.dim{opacity:.62}
.opt[disabled]{cursor:default}
.fb{margin-top:16px;border-radius:12px;padding:14px 16px;display:grid;gap:6px}
.fb.good{background:var(--ok-bg)}
.fb.miss{background:var(--bad-bg)}
.fb strong{font-family:var(--f-display);font-size:17px}
.fb.good strong{color:var(--ok)}
.fb.miss strong{color:var(--bad)}
.foot{margin-top:22px}
.nav{display:flex;flex-wrap:wrap;gap:6px;margin-top:22px}
.nav button{width:34px;height:34px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);font:500 12px var(--f-mono);font-variant-numeric:tabular-nums;padding:0}
.nav button.a{background:var(--hema-soft);border-color:var(--hema)}
.nav button.f{border-color:var(--eosin);box-shadow:inset 0 -3px 0 var(--eosin)}
.nav button.c{background:var(--hema);color:var(--hema-ink);border-color:var(--hema)}
.warn{margin-top:16px;background:var(--hema-soft);border-radius:12px;padding:14px 16px;display:grid;gap:10px}

/* results */
.big{font-family:var(--f-display);font-size:clamp(54px,16vw,88px);line-height:1;font-weight:700;color:var(--hema);font-variant-numeric:tabular-nums}
.big small{font-size:.4em;color:var(--muted);font-weight:600}
.breakdown{display:grid;gap:10px;margin-top:6px}
.brow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center}
.brow .meter{grid-column:1/-1;height:7px}
.brow .meter i.low{background:var(--eosin)}
.num{font:500 13px var(--f-mono);font-variant-numeric:tabular-nums;color:var(--muted)}
.rev{display:grid;gap:12px;margin-top:12px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:8px;min-width:0}
.item .q{font-weight:600}
.item .yours,.item .right{font-size:15px}
.item .yours b{color:var(--bad)}
.item .right b{color:var(--ok)}
.item .ex{font-size:14.5px;color:var(--muted)}

/* flashcards */
.card{display:block;width:100%;min-height:260px;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:24px 22px;position:relative}
.card.back{background:var(--hema-soft);border-color:var(--hema)}
.card .side{font:500 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--eosin);margin-bottom:12px;display:block}
.card .ans{font-family:var(--f-display);font-size:clamp(19px,4.6vw,24px);line-height:1.3;font-weight:600;display:block;margin-bottom:12px}
.card .ex{color:var(--muted);display:block}
.hint{font-size:13px;color:var(--muted);margin-top:8px}

@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>

<script>
const SECS=[
 {k:'A',n:'Meninges: dura mater and its extensions'},
 {k:'B',n:'Arachnoid, pia mater and choroid plexuses'},
 {k:'C',n:'Ventricles and cerebrospinal fluid'},
 {k:'D',n:'Brainstem: medulla oblongata'},
 {k:'E',n:'Brainstem: pons'},
 {k:'F',n:'Brainstem: midbrain'},
 {k:'G',n:'Cerebellum'},
 {k:'H',n:'Diencephalon'},
 {k:'I',n:'Cerebrum: lobes and cortex'},
 {k:'J',n:'Basal ganglia, limbic system and cortical areas'}
];
/* Each row: section, question, CORRECT answer, wrong 1, wrong 2, wrong 3, explanation, level (1 recall, 2 understand, 3 tricky). Option order is shuffled at runtime. */
const RAW=[
['A',"How many meninges surround the brain?","Three","Two","Four","Five","There are three: dura mater, arachnoid and pia mater.",1],
['A',"Which meningeal layer is the outermost?","Dura mater","Arachnoid","Pia mater","Choroid plexus","The dura mater is the outermost layer.",1],
['A',"The dura mater is attached to:","The inner periosteum of the skull bone","The surface of the cortex","The wall of the ventricles","The subarachnoid space","It is attached to the inner periosteum of the skull bone.",1],
['A',"The dura mater is composed of:","Fibrous connective tissue","Non-vascularized connective tissue","Very vascularized connective tissue","Simple cuboidal epithelium","The dura is fibrous connective tissue. The arachnoid is non-vascularized and the pia mater is very vascularized.",1],
['A',"How is the dura mater formed?","Two fused layers that unfold at some points to form the dural venous sinuses","One thin layer attached to the cortex","Three layers separated by CSF","Two layers that surround the ventricles","Its two fused layers split in places to give rise to the dural venous sinuses.",2],
['A',"Which dural extension separates the two cerebral hemispheres?","Falx cerebri","Falx cerebelli","Tentorium cerebelli","Corpus callosum","The falx cerebri separates the cerebral hemispheres.",1],
['A',"Which dural extension separates the two cerebellar hemispheres?","Falx cerebelli","Falx cerebri","Tentorium cerebelli","Vermis","The falx cerebelli separates the cerebellar hemispheres.",1],
['A',"Which dural extension separates the cerebrum from the cerebellum?","Tentorium cerebelli","Falx cerebri","Falx cerebelli","Arachnoid villi","The tentorium cerebelli separates the cerebrum and the cerebellum.",1],
['A',"How many extensions does the dura mater have?","Three","Two","Four","One","Falx cerebri, falx cerebelli and tentorium cerebelli.",1],
['B',"Which meningeal layer is the intermediate one?","Arachnoid","Dura mater","Pia mater","Tentorium","The arachnoid lies between the dura mater and the pia mater.",1],
['B',"The arachnoid is made of:","Non-vascularized connective tissue","Very vascularized connective tissue","Fibrous connective tissue attached to bone","Nervous tissue","The arachnoid is non-vascularized connective tissue.",1],
['B',"What is the function of the arachnoid villi?","They reabsorb CSF into the bloodstream","They produce CSF","They filter blood in the ventricles","They anchor the dura to the skull","The arachnoid villi are expansions into the dural venous sinuses that return CSF to the blood.",1],
['B',"Where does the CSF circulate between the meninges?","In the subarachnoid space","Between the dura mater and the skull","Between the two layers of the dura","In the venous sinuses only","The subarachnoid space lies between the arachnoid and the pia mater.",1],
['B',"Which meningeal layer is the innermost?","Pia mater","Arachnoid","Dura mater","Falx cerebri","The pia mater is the innermost layer, linked to the nerve tissue.",1],
['B',"The pia mater is made of:","Very vascularized connective tissue","Non-vascularized connective tissue","Fibrous connective tissue","Simple squamous epithelium","The pia mater is very vascularized and very thin.",1],
['B',"What does the pia mater follow?","The clefts, grooves and convolutions of the cerebral and cerebellar cortex","Only the cerebral hemispheres","The inner surface of the skull","The wall of the ventricles only","It covers the entire surface of the brain, following every groove and convolution.",2],
['B',"What are the choroid plexuses?","Very vascular dilatations on the walls of the ventricles that filter and produce CSF","Expansions of the arachnoid into the venous sinuses","Folds of the dura mater","Nuclei of the thalamus","They are found on the ventricle walls and produce CSF.",1],
['B',"Which epithelium covers the choroid plexuses?","Simple cuboidal, acting as a blood-brain barrier","Stratified squamous","Simple columnar with cilia","Pseudostratified","The simple cuboidal epithelium acts as a blood-brain barrier that protects the nervous tissue.",2],
['B',"Which structure is NOT a function or feature of the arachnoid?","Producing CSF in the choroid plexus","Having villi","Being non-vascularized","Forming the subarachnoid space with the pia mater","The choroid plexuses, on the ventricle walls, produce CSF. They are linked to the pia mater, not to the arachnoid villi.",3],
['C',"How many ventricles are there?","Four","Two","Three","Five","Two lateral ventricles, the third and the fourth.",1],
['C',"Where are the lateral ventricles?","One in each cerebral hemisphere","Both in the cerebellum","In the midline between the thalami","In the brainstem","There are two lateral ventricles, one per hemisphere.",1],
['C',"Where is the third ventricle?","In the midline, between the two halves of the thalamus, above the hypothalamus","Between the brainstem and the cerebellum","Inside each cerebral hemisphere","Inside the midbrain","It is very narrow and lies between the halves of the thalamus, superior to the hypothalamus.",2],
['C',"Where is the fourth ventricle?","Between the brainstem and the cerebellum","Between the two thalami","In the frontal lobe","Inside the pineal gland","It lies between the brainstem and the cerebellum.",1],
['C',"What links the third and the fourth ventricles?","The cerebral (Sylvian) aqueduct","The central sulcus","The infundibulum","The corpus callosum","The cerebral aqueduct connects them.",2],
['C',"Where is the CSF produced?","In the choroid plexuses","In the arachnoid villi","In the dura mater","In the subarachnoid space","The choroid plexuses on the ventricle walls produce it.",1],
['C',"How does the CSF return to the blood?","Through the arachnoid villi","Through the choroid plexuses","Through the cerebral aqueduct","Through the falx cerebri","The arachnoid villi reabsorb it into the bloodstream.",1],
['C',"What is the main function of the CSF?","To protect and nourish the nervous tissue of the CNS","To insulate the nerve fibres","To produce melatonin","To connect the hemispheres","It is a clear liquid that protects and nourishes the CNS.",1],
['C',"Where does the CSF circulate?","Ventricles, cavities of brain and spinal cord, and subarachnoid space","Only in the ventricles","Only in the subarachnoid space","In the dura mater","It circulates through all these spaces.",2],
['D',"Where is the medulla oblongata?","The lower part of the brainstem, between the spinal cord and the pons","The upper part of the brainstem","Between the pons and the diencephalon","Inside the cerebellum","It lies between the spinal cord and the pons.",1],
['D',"What are the pyramids of the medulla?","Bulges formed by the corticospinal tracts","Nuclei of balance","Four rounded elevations","Nuclei of touch","The pyramids are in the anteroinferior area and contain the corticospinal tracts.",1],
['D',"What is the decussation of the pyramids?","About 90% of the fibres cross to the opposite side at the junction with the spinal cord","The crossing of the optic nerves","The union of the two hemispheres","The crossing of the cerebellar peduncles","90% of the fibres of each pyramid cross to the other side.",2],
['D',"What is found lateral to each pyramid?","The olive","The colliculus","The pons","The vermis","The olive, with the inferior olivary nuclei.",1],
['D',"What is the role of the inferior olivary nuclei?","Receiving proprioceptive input and helping the cerebellum coordinate voluntary movements","Controlling breathing","Transmitting touch","Producing hormones","They receive sensations from proprioceptors and collaborate with the cerebellum.",2],
['D',"Which nuclei of the medulla are related to touch?","Gracile and cuneate nuclei","Inferior olivary nuclei","Red nuclei","Pontine nuclei","The gracile and cuneate nuclei handle touch.",1],
['D',"Which medullary area controls breathing?","Bulbar rhythmicity area","Apneusic centre","Substantia nigra","Pontine nuclei","The bulbar rhythmicity area controls breathing. The apneusic and pneumotaxic centres are in the pons.",2],
['D',"The medulla is associated with the nuclei of which cranial nerves?","VIII to XII","V to VIII","III and IV","I and II","Vestibulocochlear, glossopharyngeal, vagus, accessory and hypoglossal.",1],
['D',"Which reflexes are controlled by nuclei of the medulla?","Vomiting, coughing, swallowing, hiccups and sneezing","Sight and hearing reflexes","Balance reflexes","Emotional responses","The medulla controls these reflexes. It also has the cardiovascular centre.",2],
['E',"Where is the pons?","Above the medulla oblongata and below the midbrain","Below the medulla oblongata","Above the diencephalon","Inside the cerebellum","The pons is the middle part of the brainstem.",1],
['E',"What is the main function of the pons?","To connect different parts of the brain","To control emotions","To store memory","To produce CSF","It connects the two cerebellar hemispheres and has tracts that link the brain with the spinal cord.",1],
['E',"What do the pontine nuclei do?","Transmission of voluntary movements","Control of breathing","Control of hunger","Reflexes of vomiting","They transmit voluntary movements.",2],
['E',"Which centres of the pons are involved in breathing?","Apneusic and pneumotaxic centres","Bulbar rhythmicity area","Colliculi","Red nuclei","These two centres are in the pons.",2],
['E',"The pons is associated with the nuclei of which cranial nerves?","V to VIII","III and IV","VIII to XII","I and II","Trigeminal, abducens, facial and vestibulocochlear nerves. The slide calls the abducens the external ocular motor nerve.",2],
['F',"Where is the midbrain?","Between the pons and the diencephalon","Below the medulla","Between the cerebrum and the skull","Between the two cerebellar hemispheres","It is the highest part of the brainstem.",1],
['F',"What crosses the midbrain?","The aqueduct of the midbrain","The corpus callosum","The infundibulum","The falx cerebri","The cerebral aqueduct passes through it.",1],
['F',"What are the colliculi?","Four rounded elevations on the back of the midbrain","Two pigmented nuclei","Bulges of the medulla","Lobes of the cerebellum","They are also called tubercula quadrigemina.",1],
['F',"What is the function of the superior colliculi?","Sight","Hearing","Balance","Smell","The superior colliculi are related to sight.",1],
['F',"What is the function of the inferior colliculi?","Hearing","Sight","Breathing","Touch","The inferior colliculi are related to hearing.",1],
['F',"Which structure is a large pigmented nucleus of the midbrain?","Substantia nigra","Olive","Habenula","Pineal gland","The substantia nigra controls subconscious muscle activity.",1],
['F',"Why do the red nuclei look red?","They are very vascularized and contain iron pigment","They contain melatonin","They contain myelin","They are covered by the pia mater","The slide says they are vascularized and contain ferric pigment deposits.",2],
['F',"Which cranial nerve nuclei are associated with the midbrain?","III and IV","V and VI","VII and VIII","IX and X","Oculomotor and trochlear nerves.",1],
['G',"Where is the cerebellum?","In the lower and back part of the brain","Above the cerebrum","In the diencephalon","In front of the pons","It sits in the lower and back part of the brain.",1],
['G',"What joins the two cerebellar hemispheres?","The vermis","The corpus callosum","The interthalamic commissure","The fornix","The vermis joins the hemispheres.",1],
['G',"The three lobes of each cerebellar hemisphere are:","Anterior, posterior and flocculus","Frontal, parietal and temporal","Superior, middle and inferior peduncle","Hypothalamic, tuberal and preoptic","Anterior (superior), posterior (middle) and flocculus (lower).",1],
['G',"Which structure separates the cerebellum from the cerebrum?","Tentorium cerebelli","Falx cerebri","Falx cerebelli","Central sulcus","The tentorium cerebelli separates them. The falx cerebelli separates the hemispheres.",2],
['G',"How is the cerebellum linked to the brainstem?","Through the cerebellar peduncles","Through the vermis","Through the falx cerebelli","Through the infundibulum","Three pairs of peduncles link it to the brainstem nuclei.",1],
['G',"Where is the grey matter of the cerebellum?","In the cortex","In the arbor vitae","In the peduncles only","In the vermis only","Grey matter is in the cortex, white matter in the nucleus (arbor vitae).",2],
['G',"What does the flocculus control?","Balance and posture","Fine hand movements","Breathing","Emotions","The flocculus is related to balance and posture.",2],
['G',"Which peduncles are connected with the red nuclei of the midbrain?","Superior","Middle","Inferior","None of them","The superior ones. The middle coordinate voluntary movements and the inferior receive sensory fibres from the inner ear.",2],
['G',"Which peduncles receive sensory fibres from the inner ear?","Inferior","Superior","Middle","All three","The inferior peduncles carry balance information.",2],
['G',"According to the slides, what share of the brain's neurons does the cerebellum contain?","About half","About 10%","About 25%","All of them","The slides say that, although smaller, it has half of the neurons of the brain.",2],
['H',"What are the three parts of the diencephalon?","Hypothalamus, thalamus and epithalamus","Pons, medulla and midbrain","Frontal, parietal and temporal lobes","Putamen, caudate and globus pallidus","The slides list these three.",1],
['H',"Where is the hypothalamus?","Below the thalamus","Above the thalamus","Behind the cerebellum","Inside the pons","It is a small portion of the diencephalon below the thalamus.",1],
['H',"How many nuclei does the hypothalamus have, and in how many regions?","Twelve nuclei in four regions","Seven nuclei in three regions","Twelve nuclei in two regions","Four nuclei in twelve regions","Twelve nuclei clustered in four regions.",2],
['H',"Which are the four hypothalamic regions?","Mamillary, tuberal, supraoptic and preoptic","Frontal, tuberal, optic and pineal","Anterior, posterior, lateral and medial","Mamillary, tuberal, pineal and habenular","Mamillary, tuberal, supraoptic and preoptic.",2],
['H',"Which structure connects the hypothalamus with the pituitary gland?","Infundibulum","Interthalamic commissure","Cerebral aqueduct","Optic chiasm","The infundibulum is in the tuberal region.",1],
['H',"Which function belongs to the hypothalamus?","Regulation of hunger, thirst and body temperature","Relay of sensory impulses to the cortex","Production of melatonin","Coordination of fine movements","It regulates food and water intake, temperature and ANS functions. The thalamus relays sensation and the pineal makes melatonin.",2],
['H',"Which pair collaborates to establish sleep and wakefulness patterns?","Hypothalamus and pineal gland","Thalamus and cerebellum","Pons and medulla","Amygdala and hippocampus","The hypothalamus works with the pineal gland.",2],
['H',"What joins the two parts of the thalamus?","The grey interthalamic commissure","The corpus callosum","The vermis","The infundibulum","The two parts are joined by the interthalamic commissure.",1],
['H',"What is the main role of the thalamus?","Linking the cerebral cortex with other areas and transmitting sensory impulses","Producing hormones for the pituitary","Controlling breathing","Producing CSF","The thalamus transmits touch, pain and temperature and helps coordinate movements.",1],
['H',"Which gland is part of the epithalamus?","Pineal gland","Pituitary gland","Thyroid gland","Choroid plexus","The pineal gland produces melatonin, which controls the biological clock.",1],
['H',"What does the habenula relate to, according to the slides?","Smell and the associated emotional responses","Hearing","Balance","Breathing","The slides say that the habenula is related to smell.",2],
['H',"Where does the pineal gland lie?","On the midline, posterior to the third ventricle","Below the hypothalamus","Inside the cerebellum","In the medulla","The pineal gland is on the midline, behind the third ventricle.",2],
['I',"What separates the two cerebral hemispheres?","Falx cerebri","Tentorium cerebelli","Corpus callosum","Falx cerebelli","The falx cerebri is the dural fold between them.",1],
['I',"The four classic lobes of the cerebrum are:","Frontal, temporal, parietal and occipital","Frontal, pons, medulla and occipital","Parietal, insula, limbic and temporal","Temporal, central, lateral and occipital","The slides add the insula as a fifth lobe.",1],
['I',"Which structure is currently considered the 5th lobe?","Insula","Flocculus","Vermis","Habenula","Currently the insula is considered a fifth lobe.",1],
['I',"The central sulcus (fissure of Rolando) separates:","The frontal and parietal lobes","The temporal lobe from the frontal and parietal","The two hemispheres","The cerebrum from the cerebellum","The central sulcus lies between the frontal and parietal lobes.",1],
['I',"The lateral sulcus (fissure of Sylvius) separates:","The temporal lobe from the frontal and parietal lobes","The frontal and parietal lobes","The occipital lobe from the parietal","The two hemispheres","It separates the temporal lobe from the frontal and parietal lobes.",2],
['I',"What are gyri and sulci?","Folds (convolutions) and fissures of the surface","Layers of the meninges","Nuclei of the thalamus","Cranial nerves","Gyri are folds and sulci are fissures.",1],
['I',"What joins the two hemispheres?","Corpus callosum","Vermis","Falx cerebri","Interthalamic commissure","A broad band of white matter.",1],
['I',"The cerebral cortex is composed of:","Grey matter in six functional layers","White matter in four layers","Connective tissue","Three layers of epithelium","The cortex is grey matter organised in 6 functionally specialised layers.",2],
['I',"Who first described the types of neurons and their organisation, winning the Nobel Prize in 1906?","Santiago Ramon y Cajal","Camillo Golgi","Paul Broca","Charles Sherrington","The slides credit Ramon y Cajal (1852-1934).",2],
['J',"Where are the basal ganglia?","In the depth of each hemisphere","On the surface of the cortex","In the cerebellum","In the medulla","They lie deep in each hemisphere.",1],
['J',"Which are the three main centres of the basal ganglia?","Putamen, globus pallidus and caudate nucleus","Hippocampus, amygdala and fornix","Thalamus, hypothalamus and epithalamus","Pons, medulla and midbrain","The slides list these three.",1],
['J',"What forms the lenticular nucleus?","Putamen and globus pallidus","Caudate nucleus and putamen","Hippocampus and amygdala","Thalamus and hypothalamus","Together, putamen and globus pallidus form the lenticular nucleus.",2],
['J',"Which basal ganglion surrounds the thalamus superiorly?","Caudate nucleus","Putamen","Globus pallidus","Amygdala","The caudate nucleus is the larger one.",2],
['J',"What are the basal ganglia involved in?","Subconscious muscle activity and coordination of movements","Smell and memory","Hormone production","CSF production","They coordinate movements and are linked to thalamus and cortex.",1],
['J',"Where is the limbic system?","Surrounding the top of the brainstem","Inside the cerebellum","In the spinal cord","Below the pons","It surrounds the top of the brainstem.",1],
['J',"The limbic system mainly controls:","Emotions, and is involved in smell and memory","Balance","Fine movements","Breathing","Pain, love, pleasure, anger, plus smell and memory.",1],
['J',"Which two nuclei are the main ones of the limbic system?","Hippocampus and amygdala","Putamen and caudate","Red nucleus and substantia nigra","Gracile and cuneate","The fornix and septal nuclei are also named.",1],
['J',"Which are the functional areas of the cerebral cortex?","Sensitive, motor and associative areas","Frontal, parietal and occipital areas","Cortical, medullary and pontine areas","Visual, auditory and cerebellar areas","Associative areas connect the sensory and motor areas.",2],
['J',"Which area contains the language area, according to the slides?","The motor areas","The sensitive areas","The associative areas","The limbic areas","Motor areas: movement of skeletal muscles and the language area.",3]
];
const QS=RAW.map((r,i)=>({id:i+1,s:r[0],q:r[1],c:r[2],w:[r[3],r[4],r[5]],e:r[6],l:r[7]}));

</script>
<script>

(function(){
const LET=['A','B','C','D'];
const LVL={1:'Recall',2:'Understand',3:'Tricky'};
const STAGES=[['Meninges','dura, arachnoid, pia, CSF'],['Brainstem','medulla, pons, midbrain'],['Cerebellum','and diencephalon'],['Cerebrum','cortex, ganglia, limbic system']];
const KEY='anat-t4a-qb-v1';
const app=document.getElementById('app');
let store={done:{}};
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&s.done)store=s}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}}
const $=s=>document.querySelector(s);
function esc(t){return String(t).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function secName(k){return SECS.find(s=>s.k===k).n}
function fmt(ms){const t=Math.floor(ms/1000);return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')}
const isOk=it=>it.pick!==null&&it.opts[it.pick].ok;

let mode='practice',scope='all',S=null,C=null,timer=null,resetAsk=false;

const MODE_NOTE={
 practice:'One question at a time. You see right away whether you were correct and read the explanation.',
 exam:'No feedback until you finish. Move back and forth, flag questions, and watch the clock.',
 cards:'The question on the front, the answer and its explanation on the back. Good for a last pass.'
};

function poolFor(sc){
 if(sc==='all')return QS.slice();
 if(sc==='weak')return QS.filter(q=>store.done[q.id]==='w');
 return QS.filter(q=>q.s===sc);
}

/* ---------- HOME ---------- */
function home(){
 clearInterval(timer);S=null;C=null;
 const weak=poolFor('weak').length;
 if(scope==='weak'&&!weak)scope='all';
 const tried=QS.filter(q=>store.done[q.id]).length;
 const right=QS.filter(q=>store.done[q.id]==='c').length;
 const rows=[{k:'all',n:'All sections'}].concat(SECS).map(s=>{
  const p=poolFor(s.k),c=p.filter(q=>store.done[q.id]==='c').length;
  return `<label class="scope"><input type="radio" name="scope" value="${s.k}" ${scope===s.k?'checked':''}><span class="sc-name">${esc(s.n)}</span><span class="sc-meta">${p.length} questions · ${c} answered correctly</span><span class="meter"><i style="width:${Math.round(c/p.length*100)}%"></i></span></label>`;
 }).join('')+`<label class="scope"><input type="radio" name="scope" value="weak" ${scope==='weak'?'checked':''} ${weak?'':'disabled'}><span class="sc-name">My mistakes</span><span class="sc-meta">${weak?weak+' questions you last got wrong':'Nothing to review yet'}</span><span class="meter"><i style="width:${weak?Math.round(weak/QS.length*100):0}%;background:var(--eosin)"></i></span></label>`;
 app.innerHTML=`
 <p class="eyebrow">Anatomy of Head and Neck · Topic 4 part 1</p>
 <h1>Brain and Meninges Question Bank</h1>
 <p class="lead">${QS.length} single-answer questions with a full explanation for each one, built from the Topic 4 part 1 slides: meninges, ventricles and CSF, brainstem, cerebellum, diencephalon and cerebrum. A warm-up before the fill-in-the-blank texts and the open questions.</p>
 <div class="ribbon" aria-label="Regions covered">${STAGES.map(s=>`<div><b>${s[0]}</b><span>${s[1]}</span></div>`).join('')}</div>
 <p class="cap">The areas covered by Topic 4 part 1. Progress so far: ${right} of ${QS.length} answered correctly${tried?`, ${tried} attempted`:''}.</p>
 <p class="sec-title">1 · Mode</p>
 <div class="seg" role="group" aria-label="Mode">
  ${[['practice','Practice'],['exam','Exam'],['cards','Flashcards']].map(m=>`<button type="button" data-a="mode" data-v="${m[0]}" aria-pressed="${mode===m[0]}">${m[1]}</button>`).join('')}
 </div>
 <p class="mode-note" id="mnote">${MODE_NOTE[mode]}</p>
 <p class="sec-title">2 · Scope</p>
 <div class="scopes">${rows}</div>
 <div class="start row between">
  <button type="button" class="btn" data-a="start">Start</button>
  ${resetAsk?`<span class="row"><span class="tag">Erase saved progress?</span><button type="button" class="btn ghost small" data-a="reset-yes">Erase</button><button type="button" class="btn ghost small" data-a="reset-no">Keep</button></span>`:`<button type="button" class="linkish" data-a="reset">Reset progress</button>`}
 </div>`;
}

/* ---------- SESSION ---------- */
function startSession(m,pool){
 if(!pool.length)return;
 S={mode:m,i:0,t0:Date.now(),ask:false,over:false,rf:'wrong',
  list:shuffle(pool).map(q=>({q,opts:shuffle([{t:q.c,ok:true}].concat(q.w.map(t=>({t,ok:false})))),pick:null,flag:false}))};
 clearInterval(timer);
 if(m==='exam'){timer=setInterval(()=>{const e=$('#clock');if(e)e.textContent=fmt(Date.now()-S.t0)},1000)}
 quiz();
}

function quiz(){
 const ex=S.mode==='exam',it=S.list[S.i],q=it.q,n=S.list.length;
 const ans=it.pick!==null,reveal=!ex&&ans;
 const nDone=S.list.filter(x=>x.pick!==null).length;
 const good=S.list.filter(isOk).length,bad=nDone-good;
 const opts=it.opts.map((o,k)=>{
  let cls='opt';
  if(ex&&it.pick===k)cls+=' sel';
  if(reveal){if(o.ok)cls+=' ok';else if(it.pick===k)cls+=' bad';else cls+=' dim'}
  return `<li><button type="button" class="${cls}" data-a="pick" data-i="${k}" ${reveal?'disabled':''}><span class="l">${LET[k]}</span><span>${esc(o.t)}</span></button></li>`;
 }).join('');
 let fb='';
 if(reveal){
  const ok=isOk(it);
  fb=`<div class="fb ${ok?'good':'miss'}" role="status"><strong>${ok?'Correct':'Not quite'}</strong>${ok?'':`<p><b>Answer:</b> ${esc(q.c)}</p>`}<p>${esc(q.e)}</p></div>`;
 }
 const last=S.i===n-1;
 let foot;
 if(ex){
  const un=n-nDone;
  foot=`<div class="row between foot">
   <span class="row"><button type="button" class="btn ghost" data-a="prev" ${S.i===0?'disabled':''}>Previous</button><button type="button" class="btn ghost" data-a="next" ${last?'disabled':''}>Next</button></span>
   <span class="row"><button type="button" class="btn ghost small ${it.flag?'flagged':''}" data-a="flag" aria-pressed="${it.flag}">${it.flag?'Flagged':'Flag'}</button><button type="button" class="btn small" data-a="finish">Finish exam</button></span>
  </div>
  ${S.ask?`<div class="warn" role="alert"><p>${un?`You left ${un} question${un>1?'s':''} unanswered. They will count as wrong.`:'All questions answered.'} Finish and see your results?</p><div class="row"><button type="button" class="btn small" data-a="finish-yes">Finish</button><button type="button" class="btn ghost small" data-a="finish-no">Keep going</button></div></div>`:''}
  <div class="nav" aria-label="Question navigator">${S.list.map((x,k)=>`<button type="button" data-a="jump" data-i="${k}" class="${x.pick!==null?'a':''} ${x.flag?'f':''} ${k===S.i?'c':''}" aria-label="Question ${k+1}${x.flag?', flagged':''}${x.pick!==null?', answered':''}">${k+1}</button>`).join('')}</div>`;
 }else{
  foot=`<div class="row between foot"><button type="button" class="linkish" data-a="home">Quit</button><button type="button" class="btn" data-a="${last?'finish-yes':'next'}" ${ans?'':'disabled'}>${last?'See results':'Next question'}</button></div>`;
 }
 app.innerHTML=`
 <div class="topbar"><span class="tag">Question ${S.i+1} of ${n} · <b>${esc(secName(q.s))}</b></span>
  ${ex?`<span class="clock" id="clock">${fmt(Date.now()-S.t0)}</span>`:`<span class="score" aria-label="Score so far">✓ ${good} · ✗ ${bad}</span>`}</div>
 <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="${n}" aria-valuenow="${ex?nDone:S.i+(ans?1:0)}"><i style="width:${(ex?nDone:S.i+(ans?1:0))/n*100}%"></i></div>
 <div class="qtext" id="q"><h2>${esc(q.q)}</h2><span class="lvl">${LVL[q.l]}</span></div>
 <ul class="opts">${opts}</ul>${fb}${foot}`;
 window.scrollTo(0,0);
}

function pick(k){
 const it=S.list[S.i];
 if(S.mode==='practice'){
  if(it.pick!==null)return;
  it.pick=k;store.done[it.q.id]=it.opts[k].ok?'c':'w';save();
 }else{it.pick=k}
 quiz();
}

function finish(){
 clearInterval(timer);
 S.list.forEach(it=>{if(S.mode==='exam'){store.done[it.q.id]=isOk(it)?'c':'w'}});
 save();S.end=Date.now();S.over=true;results();
}

/* ---------- RESULTS ---------- */
function results(){
 const L=S.list,n=L.length,ok=L.filter(isOk).length,pct=Math.round(ok/n*100);
 const verdict=pct>=85?'Exam-ready on this set. Keep the weak spots fresh.':pct>=70?'Solid base. Tighten the sections marked in pink.':'Keep drilling. Redo your mistakes, then try again.';
 const secs=SECS.map(s=>{const l=L.filter(x=>x.q.s===s.k);if(!l.length)return '';const c=l.filter(isOk).length,p=Math.round(c/l.length*100);
  return `<div class="brow"><span>${esc(s.n)}</span><span class="num">${c}/${l.length}</span><span class="meter"><i class="${p<70?'low':''}" style="width:${p}%"></i></span></div>`}).join('');
 const wrong=L.filter(x=>!isOk(x));
 const shown=S.rf==='wrong'?wrong:L;
 const rev=shown.map(it=>{const k=L.indexOf(it);
  const yours=it.pick===null?'<b>No answer</b>':`<b>${esc(it.opts[it.pick].t)}</b>`;
  return `<article class="item"><span class="tag">Question ${k+1} · ${esc(secName(it.q.s))}</span><p class="q">${esc(it.q.q)}</p>
  ${isOk(it)?'':`<p class="yours">Your answer: ${yours}</p>`}<p class="right">Correct: <b>${esc(it.q.c)}</b></p><p class="ex">${esc(it.q.e)}</p></article>`}).join('');
 app.innerHTML=`
 <p class="eyebrow">${S.mode==='exam'?'Exam':'Practice'} complete · ${fmt(S.end-S.t0)}</p>
 <div class="big">${ok}<small> / ${n}</small></div>
 <h2 style="margin-top:8px">${pct}% · ${verdict}</h2>
 <div class="row start"><button type="button" class="btn" data-a="retry" ${wrong.length?'':'disabled'}>Redo my ${wrong.length} mistake${wrong.length===1?'':'s'}</button><button type="button" class="btn ghost" data-a="home">Back to start</button></div>
 <p class="sec-title">By section</p><div class="breakdown">${secs}</div>
 <p class="sec-title">Review</p>
 <div class="row"><button type="button" class="btn small ${S.rf==='wrong'?'':'ghost'}" data-a="rf" data-v="wrong">Mistakes (${wrong.length})</button><button type="button" class="btn small ${S.rf==='all'?'':'ghost'}" data-a="rf" data-v="all">All questions</button></div>
 <div class="rev">${rev||'<p class="lead">No mistakes in this run.</p>'}</div>`;
 window.scrollTo(0,0);
}

/* ---------- FLASHCARDS ---------- */
function cards(pool){
 if(!pool.length)return;
 C={list:shuffle(pool),i:0,f:false};renderCard();
}
function renderCard(){
 const q=C.list[C.i],n=C.list.length;
 app.innerHTML=`
 <div class="topbar"><span class="tag">Card ${C.i+1} of ${n} · <b>${esc(secName(q.s))}</b></span><button type="button" class="linkish" data-a="home">Back to start</button></div>
 <div class="bar"><i style="width:${(C.i+1)/n*100}%"></i></div>
 <button type="button" class="card ${C.f?'back':''}" id="card" data-a="flip" aria-live="polite">
  ${C.f?`<span class="side">Answer</span><span class="ans">${esc(q.c)}</span><span class="ex">${esc(q.e)}</span>`:`<span class="side">Question</span><h2>${esc(q.q)}</h2>`}
 </button>
 <p class="hint">Tap the card or press Space to flip. Arrow keys move between cards.</p>
 <div class="row between foot"><button type="button" class="btn ghost" data-a="cprev" ${C.i===0?'disabled':''}>Previous</button><button type="button" class="btn" data-a="cnext" ${C.i===n-1?'disabled':''}>Next card</button></div>`;
}

/* ---------- EVENTS ---------- */
app.addEventListener('change',e=>{if(e.target.name==='scope')scope=e.target.value});
app.addEventListener('click',e=>{
 const b=e.target.closest('[data-a]');if(!b||b.disabled)return;
 const a=b.dataset.a,v=b.dataset.v,i=b.dataset.i!==undefined?+b.dataset.i:null;
 switch(a){
  case 'mode':mode=v;document.querySelectorAll('.seg button').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.v===mode)));$('#mnote').textContent=MODE_NOTE[mode];break;
  case 'start':{const p=poolFor(scope);if(mode==='cards')cards(p);else startSession(mode,p);break}
  case 'reset':resetAsk=true;home();break;
  case 'reset-no':resetAsk=false;home();break;
  case 'reset-yes':store={done:{}};save();resetAsk=false;home();break;
  case 'pick':pick(i);break;
  case 'next':if(S.i<S.list.length-1){S.i++;S.ask=false;quiz()}break;
  case 'prev':if(S.i>0){S.i--;S.ask=false;quiz()}break;
  case 'jump':S.i=i;S.ask=false;quiz();break;
  case 'flag':S.list[S.i].flag=!S.list[S.i].flag;quiz();break;
  case 'finish':S.ask=true;quiz();break;
  case 'finish-no':S.ask=false;quiz();break;
  case 'finish-yes':finish();break;
  case 'home':home();break;
  case 'rf':S.rf=v;results();break;
  case 'retry':startSession('practice',S.list.filter(x=>!isOk(x)).map(x=>x.q));break;
  case 'flip':C.f=!C.f;renderCard();break;
  case 'cnext':if(C.i<C.list.length-1){C.i++;C.f=false;renderCard()}break;
  case 'cprev':if(C.i>0){C.i--;C.f=false;renderCard()}break;
 }
});
document.addEventListener('keydown',e=>{
 if(e.metaKey||e.ctrlKey||e.altKey)return;
 if(S&&!S.over&&$('#q')){
  const k='1234'.indexOf(e.key),k2='abcd'.indexOf(e.key.toLowerCase());
  const idx=k>-1?k:k2;
  if(idx>-1&&idx<4){pick(idx);return}
  if(e.key==='ArrowRight'){const nx=S.list[S.i].pick!==null||S.mode==='exam';if(nx&&S.i<S.list.length-1){S.i++;S.ask=false;quiz()}}
  if(e.key==='ArrowLeft'&&S.mode==='exam'&&S.i>0){S.i--;S.ask=false;quiz()}
 }else if(C&&$('#card')){
  if(e.key===' '&&document.activeElement===document.body){e.preventDefault();C.f=!C.f;renderCard()}
  if(e.key==='ArrowRight'&&C.i<C.list.length-1){C.i++;C.f=false;renderCard()}
  if(e.key==='ArrowLeft'&&C.i>0){C.i--;C.f=false;renderCard()}
 }
});
home();
})();

</script>
