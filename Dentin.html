<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Dentin Question Bank</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one calm column, like a stained-slide study sheet. Hematoxylin indigo for structure, eosin pink for emphasis. */
:root{
  --bg:#FAF6FA; --surface:#FFFFFF; --fg:#241B35; --muted:#6B5F7E; --line:#E4DBEA;
  --hema:#3A2E8C; --hema-ink:#FFFFFF; --hema-soft:#ECE8F8; --eosin:#C42E79;
  --ok:#17694A; --ok-bg:#E1F3EA; --bad:#A8231B; --bad-bg:#FBE6E3;
  --f-display:'Bricolage Grotesque',system-ui,sans-serif;
  --f-body:'Public Sans',system-ui,-apple-system,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#130F1D; --surface:#1D1830; --fg:#EEE9F7; --muted:#A79BBD; --line:#352C4E;
    --hema:#A99BFF; --hema-ink:#150F2E; --hema-soft:#2A2350; --eosin:#F26CA9;
    --ok:#5CD6A0; --ok-bg:#123628; --bad:#FF8A80; --bad-bg:#3A1A1E; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#130F1D; --surface:#1D1830; --fg:#EEE9F7; --muted:#A79BBD; --line:#352C4E;
  --hema:#A99BFF; --hema-ink:#150F2E; --hema-soft:#2A2350; --eosin:#F26CA9;
  --ok:#5CD6A0; --ok-bg:#123628; --bad:#FF8A80; --bad-bg:#3A1A1E; color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--fg); font:16px/1.55 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:20px 56px;
}
.wrap{max-width:760px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
h1{font-size:clamp(28px,6.4vw,42px);line-height:1.08;letter-spacing:-.01em;margin:6px 0 10px}
h2{font-size:clamp(19px,4.4vw,24px);line-height:1.3;font-weight:600}
h3{font-size:15px;font-weight:600}
p{margin:0}
.eyebrow{font:500 12px var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--eosin)}
.lead{color:var(--muted);max-width:60ch}
.mono{font-family:var(--f-mono)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--eosin);outline-offset:2px}

/* stage ribbon */
.ribbon{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px;margin:22px 0 6px}
.ribbon div{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--hema);border-radius:8px;padding:8px 10px;min-width:0}
.ribbon div:nth-child(1){border-top-color:color-mix(in srgb,var(--hema) 40%,var(--line))}
.ribbon div:nth-child(2){border-top-color:color-mix(in srgb,var(--hema) 55%,var(--line))}
.ribbon div:nth-child(3){border-top-color:color-mix(in srgb,var(--hema) 72%,var(--line))}
.ribbon div:nth-child(5){border-top-color:var(--eosin)}
.ribbon b{display:block;font-family:var(--f-display);font-size:15px}
.ribbon span{font:500 12px var(--f-mono);color:var(--muted)}
.cap{font-size:13px;color:var(--muted);margin-bottom:26px}

.sec-title{margin:26px 0 10px;font:500 12px var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--hema-soft);padding:5px;border-radius:12px}
.seg button{border:0;background:transparent;padding:10px 8px;border-radius:9px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--hema);color:var(--hema-ink)}
.mode-note{margin-top:10px;color:var(--muted);font-size:14.5px;min-height:2.9em}

.scopes{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px}
.scope{display:block;position:relative;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:11px 14px;cursor:pointer;min-width:0}
.scope input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.scope:has(input:checked){border-color:var(--hema);background:var(--hema-soft)}
.scope:has(input:focus-visible){outline:3px solid var(--eosin);outline-offset:2px}
.scope:has(input:disabled){opacity:.5;cursor:not-allowed}
.sc-name{display:block;font-weight:600;line-height:1.3}
.sc-meta{display:block;font-size:13px;color:var(--muted);margin:2px 0 7px}
.meter{display:block;height:5px;background:var(--line);border-radius:3px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--hema);border-radius:3px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--hema);background:var(--hema);color:var(--hema-ink);border-radius:11px;padding:12px 20px;font-weight:600}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--hema)}
.btn.small{padding:8px 13px;font-size:14px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.flagged{border-color:var(--eosin);color:var(--eosin)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row.between{justify-content:space-between}
.start{margin-top:24px}
.linkish{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;font-size:14px}

/* quiz */
.topbar{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-bottom:10px}
.tag{font:500 12px var(--f-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.tag b{color:var(--eosin);font-weight:500}
.clock{font:500 15px var(--f-mono);font-variant-numeric:tabular-nums}
.score{font:500 14px var(--f-mono);font-variant-numeric:tabular-nums;color:var(--muted)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:22px}
.bar i{display:block;height:100%;background:var(--hema);transition:width .25s}
.qtext{margin-bottom:18px}
.lvl{display:inline-block;margin-top:8px;font:500 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:20px;padding:2px 9px}
.opts{display:grid;gap:9px;margin:0;padding:0;list-style:none}
.opt{width:100%;display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;line-height:1.45}
.opt:hover:not([disabled]){border-color:var(--hema)}
.opt .l{font:500 13px var(--f-mono);display:grid;place-items:center;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);color:var(--muted)}
.opt.sel{border-color:var(--hema);background:var(--hema-soft)}
.opt.sel .l{background:var(--hema);color:var(--hema-ink);border-color:var(--hema)}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.ok .l{background:var(--ok);border-color:var(--ok);color:var(--bg)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt.bad .l{background:var(--bad);border-color:var(--bad);color:var(--bg)}
.opt.dim{opacity:.62}
.opt[disabled]{cursor:default}
.fb{margin-top:16px;border-radius:12px;padding:14px 16px;display:grid;gap:6px}
.fb.good{background:var(--ok-bg)}
.fb.miss{background:var(--bad-bg)}
.fb strong{font-family:var(--f-display);font-size:17px}
.fb.good strong{color:var(--ok)}
.fb.miss strong{color:var(--bad)}
.foot{margin-top:22px}
.nav{display:flex;flex-wrap:wrap;gap:6px;margin-top:22px}
.nav button{width:34px;height:34px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);font:500 12px var(--f-mono);font-variant-numeric:tabular-nums;padding:0}
.nav button.a{background:var(--hema-soft);border-color:var(--hema)}
.nav button.f{border-color:var(--eosin);box-shadow:inset 0 -3px 0 var(--eosin)}
.nav button.c{background:var(--hema);color:var(--hema-ink);border-color:var(--hema)}
.warn{margin-top:16px;background:var(--hema-soft);border-radius:12px;padding:14px 16px;display:grid;gap:10px}

/* results */
.big{font-family:var(--f-display);font-size:clamp(54px,16vw,88px);line-height:1;font-weight:700;color:var(--hema);font-variant-numeric:tabular-nums}
.big small{font-size:.4em;color:var(--muted);font-weight:600}
.breakdown{display:grid;gap:10px;margin-top:6px}
.brow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center}
.brow .meter{grid-column:1/-1;height:7px}
.brow .meter i.low{background:var(--eosin)}
.num{font:500 13px var(--f-mono);font-variant-numeric:tabular-nums;color:var(--muted)}
.rev{display:grid;gap:12px;margin-top:12px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:8px;min-width:0}
.item .q{font-weight:600}
.item .yours,.item .right{font-size:15px}
.item .yours b{color:var(--bad)}
.item .right b{color:var(--ok)}
.item .ex{font-size:14.5px;color:var(--muted)}

/* flashcards */
.card{display:block;width:100%;min-height:260px;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:24px 22px;position:relative}
.card.back{background:var(--hema-soft);border-color:var(--hema)}
.card .side{font:500 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--eosin);margin-bottom:12px;display:block}
.card .ans{font-family:var(--f-display);font-size:clamp(19px,4.6vw,24px);line-height:1.3;font-weight:600;display:block;margin-bottom:12px}
.card .ex{color:var(--muted);display:block}
.hint{font-size:13px;color:var(--muted);margin-top:8px}

@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>

<script>
/* Each row: section, question, CORRECT answer, wrong 1, wrong 2, wrong 3, explanation, level (1 recall, 2 understand, 3 tricky). Option order is shuffled at runtime. */
const SECS=[
 {k:'A',n:'Introduction and limits'},
 {k:'B',n:'Physical properties'},
 {k:'C',n:'Composition and matrix proteins'},
 {k:'D',n:'Predentin, coronal and root dentin'},
 {k:'E',n:'Types of dentin'},
 {k:'F',n:'Odontoblast life cycle'},
 {k:'G',n:'Dentinogenesis'},
 {k:'H',n:'Tubules, peritubular and sclerotic dentin'},
 {k:'I',n:'Secondary structural units'},
 {k:'J',n:'Innervation, aging and dentinogenesis imperfecta'}
];
const RAW=[
/* A. Introduction and limits */
['A',"Which structures limit dentin externally on the crown and on the root?","Enamel on the crown and cementum on the root","Cementum on the crown and enamel on the root","Enamel on both the crown and the root","Predentin on the crown and cementum on the root","The crown outer surface is covered by enamel and the root outer surface by cementum. The inner surface faces the pulp chamber and the root canals.",1],
['A',"How does dentin thickness vary?","It is thicker in molars than in incisors, thicker in the cusps than in the root, and thicker in mature than in young teeth","It is thicker in incisors than in molars, thicker in the root than in the cusps, and thicker in young than in mature teeth","It is the same in all teeth and only changes with the position along the root","It is thicker in young teeth than in mature teeth, but equal in cusps and root","Thickness depends on tooth type (incisors 1 to 1.5 mm, molars about 3 mm), on localization (greater in the cusps than in the root) and on age (thicker in mature teeth).",2],
['A',"From which embryonic tissue do dentin and pulp derive?","Ectomesenchyme","The oral ectoderm of the enamel organ","Endoderm of the primitive gut","Paraxial mesoderm","Dentin and pulp are ectomesenchymal in origin and are histologically and functionally related, which is why they form the dentin-pulp complex. The oral epithelium gives the enamel organ, not dentin.",1],
['A',"Where are the odontoblast cell bodies located?","At the interface between pulp and dentin, attached to the predentin layer","Inside the dentinal tubules, close to the enamel","At the dentino-enamel junction","In the middle of the pulp core, next to the large vessels","Odontoblast bodies are aligned along the inner layer of dentin at the pulp-dentin interface. Only their cytoplasmic extensions enter the tubules.",1],
['A',"What do the dentinal tubules contain?","The cytoplasmic extensions of odontoblasts (odontoblastic processes)","The odontoblast cell bodies","Capillaries coming from the pulp","Ameloblast extensions coming from the enamel","The tubules house the odontoblastic processes (and dentinal fluid). The bodies stay in the pulp, which is a classic trap.",1],
['A',"How can odontoblasts maintain dentin even though their bodies lie in the pulp?","Through their cytoplasmic extensions that run inside the dentinal tubules","Through direct contact of their bodies with the enamel","Through blood vessels that cross the predentin","Through the Hertwig epithelial root sheath","Odontoblasts allow the maintenance of dentin through their extensions lodged in the tubules. The first function of dentin as a whole is protecting the pulp.",2],

/* B. Physical properties */
['B',"What is the normal color of dentin?","Yellowish-white","Bluish-gray","Translucent white like enamel","Pinkish-red","Dentin is yellowish-white. Color depends on the degree of mineralization (primary teeth look whiter-bluer), pulp vitality, age and pigments.",1],
['B',"A gray color of dentin is mainly related to…","low pulp vitality, for example after pulp removal","a high degree of mineralization","a thick layer of predentin","an excess of type III collagen","Pulp vitality influences color: a gray tooth suggests low vitality, as after endodontic pulp removal.",2],
['B',"Why does dentin become yellower with age?","Physiological sclerosis of the tubules or reactive deposition of intratubular calcospherites","Loss of the peritubular dentin","Increase in the thickness of predentin","Enlargement of the dentinal tubules","With age, sclerosis of the tubules (physiological or reactive, by intratubular calcospherites) makes dentin yellower. Pigments of endogenous or exogenous origin also modify color.",2],
['B',"Compared with enamel, dentin translucency is…","lower, and it decreases further with age","higher, and it increases with age","the same, and it does not change with age","lower in young teeth but higher in old teeth","Dentin is less translucent than enamel. In the apical area dentin is thinner, so the root canal can be seen through it, and translucency decreases with age.",1],
['B',"How does the hardness of dentin compare with other dental tissues?","Lower than enamel and higher than bone and cementum","Higher than enamel and lower than bone","Higher than enamel, bone and cementum","Equal to cementum and lower than bone","Hardness depends on the degree of mineralization. Dentin is softer than enamel but harder than bone and cementum (in young people similar to silver amalgam).",1],
['B',"What is the functional importance of the elasticity of dentin?","It compensates for the rigidity of enamel by cushioning impacts","It allows enamel to be repaired after wear","It allows the tubules to change diameter during chewing","It makes dentin radiolucent","Dentin is more elastic than enamel. This cushions impacts and protects the brittle enamel. Elasticity varies with the organic matrix and water content.",2],
['B',"On a radiograph, dentin appears…","darker than enamel, because its mineral content is lower","brighter than enamel, because it contains more mineral","as bright as enamel","as dark as the pulp chamber","Radiopacity depends on mineral content. Dentin is less radiopaque than enamel (so it looks darker) but more radiopaque than bone, and the pulp is radiolucent.",2],
['B',"Which statement about dentin permeability is correct?","It is greater than in enamel because of the tubules, and viscosity and permeability are inversely related","It is lower than in enamel, and viscosity and permeability are directly related","It is equal to enamel, and viscosity does not influence it","It is greater than in enamel, and viscosity and permeability are directly related","Tubules let molecules, solutes and microorganisms pass. Fluids move by pressure from the pulp interstitial fluid and by diffusion, depending on tubule diameter and length. The more viscous the fluid, the lower the permeability. It matters clinically for the adhesion of materials.",3],

/* C. Composition and matrix proteins */
['C',"What is the approximate composition of dentin?","70% inorganic matrix, 18% organic matrix and 12% water","18% inorganic matrix, 70% organic matrix and 12% water","50% inorganic matrix, 30% organic matrix and 20% water","96% inorganic matrix, 1% organic matrix and 3% water","Dentin is 70% inorganic (hydroxyapatite), 18% organic and 12% water. The 96% figure belongs to enamel, a common confusion.",1],
['C',"The organic matrix of dentin consists of…","90% collagen fibers and 10% non-collagenous proteins","50% collagen fibers and 50% non-collagenous proteins","90% non-collagenous proteins and 10% collagen fibers","100% type I collagen","Collagen represents 90% of the organic matrix and non-collagenous proteins about 10%.",1],
['C',"Which collagen type makes up about 98% of the collagen of dentin?","Type I","Type III","Type IV","Type VI","Type I collagen is by far the main collagen of dentin. Types III, IV, V and VI are minor components.",1],
['C',"The hydroxyapatite crystals of dentin are…","chemically similar to those of enamel, cementum and bone, small and thin, and oriented parallel to the collagen fibers","much larger than enamel crystals and oriented randomly","different in chemistry from bone crystals and perpendicular to collagen","identical to enamel crystals in size and arrangement","Dentin crystals are chemically similar to enamel, cementum and bone, but small and thin, and parallel to the collagen fibers. The inorganic matrix also includes amorphous phosphates, carbonates, sulfates and trace elements.",2],
['C',"What is the role of dentin phosphoprotein (DPP)?","It has a high negative charge, binds large amounts of calcium and initiates hydroxyapatite formation","It prevents premature mineralization of the matrix","It inhibits growth of peritubular dentin","It forms the scaffold of the matrix","DPP binds calcium and initiates the formation of hydroxyapatite. Proteoglycans, in contrast, prevent premature mineralization. Non-collagenous proteins can act as inhibitors, promoters or stabilizers of mineral deposition.",2],
['C',"What is the role of proteoglycans in the dentin matrix?","They prevent premature mineralization and are more concentrated in predentin","They initiate hydroxyapatite formation and are absent from predentin","They form the collagen scaffold","They are exclusive to tertiary dentin","Proteoglycans prevent premature mineralization of the organic matrix and are more concentrated in predentin, which stays unmineralized.",2],
['C',"Which protein is predominantly detected in peritubular dentin, where it inhibits its growth and so prevents tubule occlusion?","Dentin sialoprotein (DSP), together with DMP-1","Dentin phosphoprotein (DPP) alone","Type III collagen","Osteocalcin","DSP (synthesized by young odontoblasts) and DMP-1 are found mainly in peritubular dentin and limit its growth, which keeps the tubules open. DPP, on the contrary, acts at the mineralization front.",3],
['C',"What is the role of type I collagen in the mineralization of dentin?","It acts as a scaffold that hosts a large proportion of the mineral in the orifices and pores of the fibrils","It prevents any mineral from entering the matrix","It only forms the predentin and disappears afterwards","It acts as a nucleator by binding calcium with a negative charge","Collagen fibrils act as a scaffold that accommodates a large proportion of the mineral (about 56%) in their orifices and pores. Calcium binding with negative charge is the role of DPP.",3],

/* D. Predentin, coronal and root dentin */
['D',"Which description of predentin is correct?","It is the first deposit of the odontoblast, an unmineralized matrix made mainly of collagen fibers","It is the outermost, fully mineralized layer under the enamel","It is a layer of epithelial cells covering dentin","It is a hypermineralized layer around the tubules","Predentin is the first matrix secreted by the odontoblast and is not mineralized. It lies between the odontoblasts and the mineralized dentin.",1],
['D',"What is the thickness of predentin?","10 to 50 µm","1 to 2 µm","100 to 500 µm","1 to 2 mm","Predentin measures roughly 10 to 50 µm.",1],
['D',"What happens to predentin during dentin formation?","It gradually mineralizes into dentin, but a layer of predentin always remains between pulp and dentin","It is completely replaced by dentin when the tooth erupts","It stays unchanged and never mineralizes","It disappears with age and is replaced by pulp","Predentin mineralizes as non-collagenous matrix proteins are incorporated at the mineralization front, yet its thickness remains constant because new predentin is formed continuously.",2],
['D',"When is predentin thickest?","During active dentinogenesis, and it decreases in thickness with age","In old teeth with little dentinogenesis","Only in teeth with caries","At the time of tooth eruption only, then it disappears","It is thicker during active dentin formation and thinner with age.",2],
['D',"Where does coronal dentin formation begin and how does it spread?","At the bell stage in the papilla under the inner enamel epithelium (cusp tip), then down the cusp slope toward the cervical loop","In the root, then toward the cusps","At the cervical loop, then toward the cusp tip","At the apical foramen, then toward the cervical region","Coronal dentin begins at the bell stage next to the inner enamel epithelium and extends down the cusp slope to the cervical loop while it thickens.",2],
['D',"Which statement about root dentin formation is correct?","It starts slightly later, needs Hertwig epithelial root sheath, and is completed up to 18 months after eruption","It starts before coronal dentin and finishes before eruption","It does not need epithelial induction","It is completed at eruption","Root dentin appears at a slightly later stage and requires proliferation of Hertwig's sheath to induce root odontoblasts. Root dentin completion can last up to 18 months after eruption.",3],

/* E. Types of dentin */
['E',"Which dentin types are formed under physiological conditions?","Primary and secondary dentin","Secondary and tertiary dentin","Primary and tertiary dentin","Only primary dentin","Primary and secondary dentin are physiological. Tertiary dentin forms under pathological conditions or after aggression.",1],
['E',"Which description fits mantle dentin?","The outer layer under enamel and cementum, and it does not contain DPP","The inner layer next to the pulp, rich in DPP","A layer formed after the root is complete","A layer formed only in response to caries","Mantle dentin is the first primary dentin, located under the enamel and cementum, and its predentin lacks DPP.",2],
['E',"Which dentin represents the largest volume of dentin?","Circumpulpal dentin","Mantle dentin","Tertiary dentin","Predentin","Circumpulpal dentin forms after the mantle dentin and constitutes most of the primary dentin.",1],
['E',"When does secondary dentin begin to form?","After all primary dentin, including the root, has been completed","Before the mantle dentin","Only after an injury","At the beginning of the bell stage","Secondary dentin develops after primary dentin (including root) is complete. Deposition is continuous but much slower.",1],
['E',"Secondary dentin is not deposited uniformly around the pulp. What is the consequence?","An asymmetric reduction in size and shape of the pulp chamber","A symmetric widening of the pulp chamber","Complete obliteration of the chamber in young teeth","No change in the pulp chamber","The uneven deposition shrinks the pulp chamber asymmetrically. Secondary dentin has tubules continuous with primary dentin and the same mineral to organic ratio.",2],
['E',"What distinguishes tertiary dentin from primary and secondary dentin regarding its site of formation?","It is formed only by the cells directly affected by the stimulus, at specific sites","It is formed along the entire pulp border","It is formed by cells of the enamel organ","It is formed only in the root","Tertiary dentin is produced only at the sites of the cells directly affected by wear, caries or a restorative procedure, not along the whole pulpo-dentinal border. Its quality and quantity depend on the intensity and duration of the stimulus.",2],
['E',"Which statement correctly distinguishes reactive from reparative tertiary dentin?","Reactive dentin is made by surviving odontoblasts after mild or moderate stimuli, and reparative dentin by new odontoblast-like cells after moderate or high stimuli","Reactive dentin is made by new cells after strong stimuli, and reparative dentin by surviving odontoblasts after mild stimuli","Both are made by surviving odontoblasts, and only the stimulus differs","Both are made by new odontoblast-like cells under mild stimulus","Reactive: matrix secreted by surviving odontoblasts after mild or moderate stimuli. Reparative: formed by a new generation of odontoblast-like cells after moderate or high stimuli.",3],
['E',"What is osteodentin?","Tertiary dentin in which the odontoblasts that formed it are included in the matrix","Secondary dentin with extremely numerous tubules","A hypermineralized dentin around tubules","Dentin that forms in the root only","When the odontoblasts that form tertiary dentin become trapped in the newly formed matrix, the tissue is called osteodentin.",2],
['E',"How are the tubules in tertiary dentin?","Few in number and irregularly arranged","Numerous and regular, as in primary dentin","Absent in all cases but wider","Continuous with those of enamel","Rapid deposition often traps cells and distorts the tubular pattern, so tubules are few and irregular.",2],

/* F. Odontoblast life cycle */
['F',"Which are the three stages of dentin formation by the odontoblast?","Elaboration of an organic matrix (predentin), matrix maturation, and precipitation of mineral salts","Mineral precipitation, collagen degradation, and matrix elaboration","Matrix maturation, enamel secretion, and tubule formation","Predentin formation, apoptosis of the odontoblast, and cementum deposition","The mechanism is: 1) predentin matrix, 2) maturation (change in non-collagenous proteins), 3) precipitation of mineral salts.",1],
['F',"What triggers the differentiation of odontoblasts?","Signaling molecules and growth factors (for example IL-6, IL-10, TGF-β) expressed by cells of the inner enamel epithelium","Pressure from the erupting tooth","Blood vessels invading the dental papilla","Contact with cementoblasts","Epithelial signals from the inner enamel epithelium induce ectomesenchymal papilla cells to become preodontoblasts and then odontoblasts.",2],
['F',"What separates undifferentiated papilla cells from the inner enamel epithelium at the beginning?","An acellular zone containing a few fine collagen fibrils","A layer of predentin","A thick layer of cementum","The stellate reticulum","An acellular zone with few collagen fibrils lies between the papilla and the inner epithelium. Later it becomes cellular as odontoblasts differentiate.",2],
['F',"What happens during the last division of the preodontoblast?","The spindle is perpendicular to the basement membrane, and the cell closest to it becomes the odontoblast","The spindle is parallel to the basement membrane and both cells become odontoblasts","Both daughter cells become Höhl cells","No division occurs because preodontoblasts keep dividing","Preodontoblasts leave the cell cycle after a last division whose spindle is perpendicular to the basement membrane. The cell next to it becomes the odontoblast.",3],
['F',"What are subodontoblastic Höhl cells?","Reserve cells derived from the underlying daughter cell of the last preodontoblast division","Mature odontoblasts trapped in dentin","Ameloblasts that migrated into the pulp","Fibroblasts of the periodontal ligament","The underlying cell after the last division gives rise to the subodontoblastic Höhl cell, which acts as a reserve cell.",2],
['F',"Which description fits the young odontoblast?","Cells that develop adhesion and communicating junctions, change polarity, enlarge, and show the nucleus away from the inner enamel epithelium","Round cells with no junctions that still divide","Cells that already secrete mantle dentin","Flat cells without polarity","Young odontoblasts develop adhesive junctions and communication, polarize, increase in volume, become cylindrical and form the odontoblastic process.",2],
['F',"Where does the secretory odontoblast release predentin?","At the proximal pole, in the space between the enamel organ and the odontoblasts","At the distal pole, toward the pulp","Into the bloodstream of the pulp","Inside the nucleus","Secretion occurs at the proximal pole, towards the enamel organ, and the process lies perpendicular to the basal lamina. Cells that start to secrete are called secretory odontoblasts.",2],
['F',"What defines a mature secretory odontoblast?","It contributes to the first mineralization of predentin to form mantle dentin, and moves inward when its process is lodged in the tubule of newly formed dentin","It has lost its process and stopped secreting","It is the cell that forms enamel","It is a preodontoblast that has not exited the cell cycle","Once predentin is formed, the odontoblast contributes to its first mineralization (mantle dentin). When the process is lodged in the tubule of the new dentin and the cell moves inward, it is a mature odontoblast.",3],
['F',"Which sequence of the odontoblast lineage is correct?","Undifferentiated mesenchymal cell, preodontoblast, young odontoblast, secretory odontoblast","Preodontoblast, undifferentiated mesenchymal cell, secretory odontoblast, young odontoblast","Young odontoblast, preodontoblast, secretory odontoblast, mesenchymal cell","Secretory odontoblast, young odontoblast, preodontoblast, mesenchymal cell","Mesenchymal cell leaves the cycle as a preodontoblast, develops junctions and polarity as a young odontoblast, then begins secreting predentin.",1],

/* G. Dentinogenesis */
['G',"What is the role of DMP-1 in dentinogenesis?","It inhibits premature mineralization, facilitating predentin formation, and stabilizes calcium phosphate nanoparticles","It forms the collagen scaffold of predentin","It is exclusive to tertiary dentin and promotes mineral loss","It splits into DSP and DPP","DMP-1 inhibits premature mineralization and sequesters and stabilizes calcium phosphate nanoparticles. Splitting into DSP and DPP is what DSPP does.",3],
['G',"What happens to DSPP after synthesis by the odontoblast?","It splits into DSP and DPP, which relate to mineralization and the start of mineral nucleation","It becomes type I collagen","It remains unchanged as a cell receptor","It is degraded and plays no role","DSPP is elaborated by the odontoblast and splits into DSP and DPP. They take part in mineralization and the beginning of nucleation of mineral.",2],
['G',"What are von Korff fibers?","Large-diameter type III collagen fibrils with fibronectin, extending from the odontoblasts toward the inner enamel epithelium","Thin type I fibrils located in secondary dentin","Elastic fibers of the pulp","Nerve fibers entering the tubules","Von Korff fibers are the first secreted matrix of mantle dentin: large type III collagen fibrils (0.1 to 0.2 µm) associated with fibronectin.",2],
['G',"How does mineralization begin in mantle dentin?","Matrix vesicles are released from the odontoblast process, and crystals then appear parallel to the collagen fibers","Globular calcospherites form and coalesce","Crystals form only in tubules","DPP initiates mineralization on type I collagen","Matrix vesicles attached to the odontoblast membrane are secreted after the process forms, and mineral crystals are seen only after their presence, arranged parallel to the fibers.",2],
['G',"How does mineralization occur in circumpulpal dentin?","No matrix vesicles are formed, and mineralization follows a globular pattern (calcospherites) that then coalesce","Through matrix vesicles, as in mantle dentin","Only through cementoblasts","By a linear front only, with no calcospherites","Circumpulpal dentin lacks matrix vesicles. Mineral appears in globules (calcospherites) that later fuse. A linear pattern is also seen at the front.",2],
['G',"In which dentin is DPP detected at the mineralization front?","Circumpulpal dentin, and not in mantle dentin","Mantle dentin only","Both mantle and circumpulpal dentin equally","Enamel","DPP is detected at the mineralization front of circumpulpal dentin, where it initiates mineralization by binding collagen and favoring hydroxyapatite. Mantle predentin does not contain DPP.",3],
['G',"What happens to the basal lamina after the first deposition of mantle dentin?","Ameloblasts phagocytize it, leaving an interface of mixed dentin and enamel","It becomes cementum","It is transformed into predentin","It persists as a permanent layer between dentin and enamel","After mantle dentin is deposited the ameloblasts phagocytize the basal lamina, leaving a mixed interface of dentin and enamel.",3],
['G',"Which two simultaneous processes characterize circumpulpal dentin formation?","Formation of organic predentin next to the odontoblasts, and matrix mineralization next to the preformed dentin","Collagen degradation and mineral loss","Matrix vesicle release and tubule closure","Epithelial proliferation and basal lamina formation","Predentin is formed on the odontoblast side while the matrix mineralizes on the side of preformed dentin. Composition changes during mineralization.",2],
['G',"How does root dentin formation differ from coronal dentin formation?","Apposition is slower, calcospherites are smaller, and the collagen fibers of cementum mix with those of dentin","Apposition is faster and calcospherites are larger","It begins before enamel formation is complete","It is identical in pattern and speed","Root dentin starts once enamel formation is complete under induction of the inner epithelium and Hertwig's sheath. The pattern of mineralization is similar but slower, with smaller calcospherites and a different orientation of collagen.",2],
['G',"What happens to odontoblasts during secondary dentin formation?","Peritubular dentin reduces their diameter, and as the inner surface shrinks they crowd together and some die","They multiply and the pulp chamber enlarges","They differentiate into ameloblasts","They stop forming dentin at the root completion","Secondary dentin is deposited by the same odontoblasts, more slowly, with less regular tubules. As dentin thickens the surface shrinks, causing agglomeration and death of some odontoblasts.",3],
['G',"How does the matrix of tertiary dentin differ in its proteins?","Less collagen, DSP and DMP-1, and more BSP and osteopontin","More collagen, DSP and DMP-1, and less BSP and osteopontin","No proteins at all","The same proteins as in primary dentin","Tertiary dentin is a rapidly deposited defense dentin with a disorganized structure: decreased collagen, DSP and DMP-1, and increased BSP and osteopontin.",3],

/* H. Tubules, peritubular and sclerotic dentin */
['H',"Where do the dentinal tubules extend?","Through the whole thickness of dentin, from the pulp to the amelodentinal (CAD) or cementodentinal (CCD) junction","Only through the inner third of dentin","Only through the root dentin","From the enamel to the outer cementum","Tubules are cylindrical structures running through the entire thickness of dentin, from pulp to CAD or CCD.",1],
['H',"Where is the odontoblastic process found in most dentinal tubules?","Along their entire length","Only in the inner third","Only in the predentin","It is absent in all tubules","Most tubules contain the odontoblastic process along the whole length, as the slide states, together with dentinal fluid from the pulp.",2],
['H',"Which composition describes dentinal fluid?","Rich in Na+ and poor in K+, with albumins and globulins","Rich in K+ and poor in Na+, with no proteins","Pure water","Identical to saliva","Dentinal fluid is rich in sodium and poor in potassium, with albumins and globulins. It comes from the pulp.",2],
['H',"Which statement about the tubules is correct?","They give dentin vitality and the ability to respond to stimuli, but they increase permeability, facilitating caries and pulp reaction to restorations","They decrease dentin permeability and protect against caries","They contain enamel crystals","They are blocked at birth","Tubules conduct stimuli to the pulp and nourish the tissue, but they also increase permeability.",2],
['H',"What is a dead tract?","Empty tubules left when odontoblastic processes retract or disintegrate, usually sealed at the pulpal end by reparative dentin","Tubules filled with hypermineralized dentin","Tubules full of nerve fibers","Tubules of the predentin","When the processes disintegrate or retract, they leave an empty tubule (dead zone). Reparative dentin seals these tracts at their pulpal end and protects the pulp from infection.",3],
['H',"What does intertubular dentin consist of?","A network of type I collagen fibrils in which apatite crystals, non-collagenous proteins and some plasma proteins are deposited","Only hydroxyapatite","Only non-collagenous proteins","Type III collagen with fibronectin only","Intertubular dentin lies between the walls of tubules and contains all the organic components of dentin: a type I collagen network with crystals and proteins.",2],
['H',"How does peritubular dentin differ from intertubular dentin?","It is hypermineralized, with a higher amount of DSP and DMP-1","It is hypomineralized and rich in type I collagen","It is identical to intertubular dentin","It is made of predentin","Tubules are surrounded by peritubular dentin, which is more highly calcified than the intertubular dentin.",2],
['H',"Sclerotic dentin appears when…","several dentinal tubules become clogged with calcified material, giving a glassy and translucent look","the tubules are enlarged by caries","the odontoblasts proliferate in the pulp","the predentin becomes thicker","In a carious tooth, sclerotic dentin lies between the carious dentin and the dead tubules, and the dentin looks glassy and translucent. It is not a destruction but a defensive blocking of the tubules.",1],

/* I. Secondary structural units */
['I',"Which of these is a basic (primary) structural unit of dentin?","Dentinal tubules","Von Ebner lines","Tomes granular zone","Schreger lines","The basic units are the dentinal tubules and the matrix (intertubular dentin). The rest (incremental lines, interglobular dentin and Czermak spaces, Tomes zone, Schreger lines, CAD and CCD) are secondary units.",1],
['I',"What are von Ebner lines?","Less mineralized lines caused by physiological pauses of the odontoblast about every 5 days, perpendicular to the tubules","Pathological lines caused by malnutrition","Lines at the cementodentinal junction","Lines due to a change of direction of tubules","Von Ebner lines are daily or short-interval incremental lines of less mineralization resulting from physiological pauses of odontoblasts and run perpendicular to the dentinal tubules.",2],
['I',"Which line in dentin is related to birth, malnutrition or febrile periods?","Owen lines (including the neonatal line)","Von Ebner lines","Schreger lines","Tomes granular zone","Owen lines (pathological) are spaced further apart and occur after disturbance of dentin formation. The neonatal line is an example.",3],
['I',"Interglobular dentin is…","a non-mineralized or hypomineralized area caused by lack of fusion of calcospherites, linked to vitamin D deficiency or high fluoride at the time of dentin formation","a hypermineralized layer around the tubules","tertiary dentin formed after caries","dentin without any tubules","In these areas the globular zones of mineralization have not fused properly. Czermak spaces are the hypomineralized spaces between globules.",2],
['I',"Where is interglobular dentin most frequent?","In circumpulpal dentin just below the mantle dentin","In predentin","In enamel","In the cementum","Interglobular dentin is greater in the circumpulpal dentin just beneath the mantle dentin.",3],
['I',"What is the Tomes granular zone?","A thin dark stripe in the periphery of root dentin, parallel to the cementodentinal junction","A line along the crown beneath enamel","A band formed by tubule direction changes","A layer of predentin in the root","The Tomes granular layer lies at the periphery of the entire root dentin, parallel to the CCD. Its granular look is attributed to the arrangement of collagen and non-collagenous proteins at the dentin-cement interface.",2],
['I',"What do Schreger lines represent?","The change of direction of dentinal tubules during primary curvature, homologous to Hunter-Schreger bands of enamel","Pathological pauses in dentinogenesis","Hypomineralized spaces","The border between predentin and dentin","Schreger lines (bands) correspond to more or less abrupt changes in the direction of the tubules and are homologous to the Hunter-Schreger bands of enamel.",2],
['I',"How do the amelodentinal (CAD) and cementodentinal (CCD) junctions differ?","CAD is a sharp line because of differences in origin and structure, while CCD is not clearly distinguishable because of similarities","CCD is a sharp line, and CAD is not distinguishable","Both are equally indistinct","Both are equally sharp","The CAD is sharp because enamel and dentin differ in origin and structure. The CCD is hard to distinguish because dentin and cementum are similar.",2],

/* J. Innervation, aging and dentinogenesis imperfecta */
['J',"Which three mechanisms have been proposed to explain dentin sensitivity?","Direct innervation of dentin, odontoblasts as receptors, and the hydrodynamic theory","Direct innervation, thermal expansion of enamel, and cementum receptors","Osmotic theory, electrical theory, and hydrodynamic theory","Odontoblast receptors, ameloblast receptors and cementoblast receptors","The three mechanisms in the lesson are: dentin with nerve endings, odontoblasts coupled to pulp nerves, and fluid movement in the tubules detected by pulp nerve endings.",1],
['J',"What argues against the direct innervation of dentin as the only explanation of sensitivity?","Dentin sensitivity does not depend solely on stimulation of nerve endings, which are found only in some tubules of internal dentin","There are no nerves in the pulp","Dentin has no tubules","Nerve endings are located in enamel only","In favor: some nerves lie within tubules of the internal dentin. Against: sensitivity does not depend only on stimulation of such endings.",2],
['J',"Which finding argues against the odontoblast as a receptor cell?","There is no synaptic relationship between the odontoblast and pulp nerves","Odontoblasts are of neural origin","Odontoblasts have processes in the tubules","Odontoblasts secrete dentin","Against: no synapses, membrane potential too low to allow transduction in vitro, and local anesthetics and protein precipitants do not eliminate sensitivity.",2],
['J',"According to the hydrodynamic theory, how is pain produced?","Movement of fluid in the tubule changes pressure and is detected by free nerve endings of the subodontoblastic (Raschkow) plexus","Direct stimulation of nerves inside the enamel","Transmission by synapses at the odontoblast","Rupture of the odontoblastic process","Fluid movement inside the tubule distorts the local pulp environment, and free nerve endings in Raschkow's plexus detect it. It explains pain when exposed dentin loses fluid, abolished by local anesthetics, and the effect of cold and heat.",2],
['J',"Which is NOT an age-related change in dentin?","Increase in permeability","Increase in dead tracts","Increase in sclerotic dentin","Increase in reparative dentin","With age, dead tracts, sclerotic dentin and reparative dentin increase, while permeability decreases and fragility increases.",2],
['J',"Which characteristics describe dentinogenesis imperfecta?","Hereditary autosomal dominant condition with normal enamel but defective dentin, translucent bluish-gray to brown teeth, bulbous crowns, short roots and progressive pulp obliteration","Recessive condition with defective enamel and normal dentin","Acquired condition due to fluoride with wide pulp chambers","Condition with long roots and enlarged pulp chambers","DI is autosomal dominant, with normal enamel and defective dentin. Radiographs show bulbous crowns, cervical constriction, short roots and progressive pulp obliteration. Mutations are in genes for collagen, DSPP and DMP-1.",1],
['J',"Why does enamel tend to fracture in dentinogenesis imperfecta?","Because the defective dentin no longer gives it adequate support, although the enamel itself is normal","Because enamel is hypomineralized","Because ameloblasts are absent","Because cementum is missing","Teeth show normal enamel but defective dentin, so enamel loses support and fractures. The translucent color comes from this abnormal dentin.",3]
];
const QS=RAW.map((r,i)=>({id:i+1,s:r[0],q:r[1],c:r[2],w:[r[3],r[4],r[5]],e:r[6],l:r[7]}));

<script>
(function(){
const LET=['A','B','C','D'];
const LVL={1:'Recall',2:'Understand',3:'Tricky'};
const STAGES=[['Predentin','unmineralized'],['Mantle dentin','first formed'],['Circumpulpal dentin','largest volume'],['Tertiary dentin','response to injury']];
const KEY='dental-dentin-qb-v1';
const app=document.getElementById('app');
let store={done:{}};
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&s.done)store=s}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}}
const $=s=>document.querySelector(s);
function esc(t){return String(t).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function secName(k){return SECS.find(s=>s.k===k).n}
function fmt(ms){const t=Math.floor(ms/1000);return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')}
const isOk=it=>it.pick!==null&&it.opts[it.pick].ok;

let mode='practice',scope='all',S=null,C=null,timer=null,resetAsk=false;

const MODE_NOTE={
 practice:'One question at a time. You see right away whether you were correct and read the explanation.',
 exam:'No feedback until you finish. Move back and forth, flag questions, and watch the clock.',
 cards:'The question on the front, the answer and its explanation on the back. Good for a last pass.'
};

function poolFor(sc){
 if(sc==='all')return QS.slice();
 if(sc==='weak')return QS.filter(q=>store.done[q.id]==='w');
 return QS.filter(q=>q.s===sc);
}

/* ---------- HOME ---------- */
function home(){
 clearInterval(timer);S=null;C=null;
 const weak=poolFor('weak').length;
 if(scope==='weak'&&!weak)scope='all';
 const tried=QS.filter(q=>store.done[q.id]).length;
 const right=QS.filter(q=>store.done[q.id]==='c').length;
 const rows=[{k:'all',n:'All sections'}].concat(SECS).map(s=>{
  const p=poolFor(s.k),c=p.filter(q=>store.done[q.id]==='c').length;
  return `<label class="scope"><input type="radio" name="scope" value="${s.k}" ${scope===s.k?'checked':''}><span class="sc-name">${esc(s.n)}</span><span class="sc-meta">${p.length} questions · ${c} answered correctly</span><span class="meter"><i style="width:${Math.round(c/p.length*100)}%"></i></span></label>`;
 }).join('')+`<label class="scope"><input type="radio" name="scope" value="weak" ${scope==='weak'?'checked':''} ${weak?'':'disabled'}><span class="sc-name">My mistakes</span><span class="sc-meta">${weak?weak+' questions you last got wrong':'Nothing to review yet'}</span><span class="meter"><i style="width:${weak?Math.round(weak/QS.length*100):0}%;background:var(--eosin)"></i></span></label>`;
 app.innerHTML=`
 <p class="eyebrow">Dental Tissues I · Lesson 5</p>
 <h1>Dentin Question Bank</h1>
 <p class="lead">${QS.length} single-answer questions with a full explanation for each one, built from the Lesson 5 slides: properties, composition, types of dentin, odontoblast life cycle, dentinogenesis, tubules, structural units, innervation and age-related changes.</p>
 <div class="ribbon" aria-label="Dentin types">${STAGES.map(s=>`<div><b>${s[0]}</b><span>${s[1]}</span></div>`).join('')}</div>
 <p class="cap">The main dentin layers and types, as taught in the lesson. Progress so far: ${right} of ${QS.length} answered correctly${tried?`, ${tried} attempted`:''}.</p>
 <p class="sec-title">1 · Mode</p>
 <div class="seg" role="group" aria-label="Mode">
  ${[['practice','Practice'],['exam','Exam'],['cards','Flashcards']].map(m=>`<button type="button" data-a="mode" data-v="${m[0]}" aria-pressed="${mode===m[0]}">${m[1]}</button>`).join('')}
 </div>
 <p class="mode-note" id="mnote">${MODE_NOTE[mode]}</p>
 <p class="sec-title">2 · Scope</p>
 <div class="scopes">${rows}</div>
 <div class="start row between">
  <button type="button" class="btn" data-a="start">Start</button>
  ${resetAsk?`<span class="row"><span class="tag">Erase saved progress?</span><button type="button" class="btn ghost small" data-a="reset-yes">Erase</button><button type="button" class="btn ghost small" data-a="reset-no">Keep</button></span>`:`<button type="button" class="linkish" data-a="reset">Reset progress</button>`}
 </div>`;
}

/* ---------- SESSION ---------- */
function startSession(m,pool){
 if(!pool.length)return;
 S={mode:m,i:0,t0:Date.now(),ask:false,over:false,rf:'wrong',
  list:shuffle(pool).map(q=>({q,opts:shuffle([{t:q.c,ok:true}].concat(q.w.map(t=>({t,ok:false})))),pick:null,flag:false}))};
 clearInterval(timer);
 if(m==='exam'){timer=setInterval(()=>{const e=$('#clock');if(e)e.textContent=fmt(Date.now()-S.t0)},1000)}
 quiz();
}

function quiz(){
 const ex=S.mode==='exam',it=S.list[S.i],q=it.q,n=S.list.length;
 const ans=it.pick!==null,reveal=!ex&&ans;
 const nDone=S.list.filter(x=>x.pick!==null).length;
 const good=S.list.filter(isOk).length,bad=nDone-good;
 const opts=it.opts.map((o,k)=>{
  let cls='opt';
  if(ex&&it.pick===k)cls+=' sel';
  if(reveal){if(o.ok)cls+=' ok';else if(it.pick===k)cls+=' bad';else cls+=' dim'}
  return `<li><button type="button" class="${cls}" data-a="pick" data-i="${k}" ${reveal?'disabled':''}><span class="l">${LET[k]}</span><span>${esc(o.t)}</span></button></li>`;
 }).join('');
 let fb='';
 if(reveal){
  const ok=isOk(it);
  fb=`<div class="fb ${ok?'good':'miss'}" role="status"><strong>${ok?'Correct':'Not quite'}</strong>${ok?'':`<p><b>Answer:</b> ${esc(q.c)}</p>`}<p>${esc(q.e)}</p></div>`;
 }
 const last=S.i===n-1;
 let foot;
 if(ex){
  const un=n-nDone;
  foot=`<div class="row between foot">
   <span class="row"><button type="button" class="btn ghost" data-a="prev" ${S.i===0?'disabled':''}>Previous</button><button type="button" class="btn ghost" data-a="next" ${last?'disabled':''}>Next</button></span>
   <span class="row"><button type="button" class="btn ghost small ${it.flag?'flagged':''}" data-a="flag" aria-pressed="${it.flag}">${it.flag?'Flagged':'Flag'}</button><button type="button" class="btn small" data-a="finish">Finish exam</button></span>
  </div>
  ${S.ask?`<div class="warn" role="alert"><p>${un?`You left ${un} question${un>1?'s':''} unanswered. They will count as wrong.`:'All questions answered.'} Finish and see your results?</p><div class="row"><button type="button" class="btn small" data-a="finish-yes">Finish</button><button type="button" class="btn ghost small" data-a="finish-no">Keep going</button></div></div>`:''}
  <div class="nav" aria-label="Question navigator">${S.list.map((x,k)=>`<button type="button" data-a="jump" data-i="${k}" class="${x.pick!==null?'a':''} ${x.flag?'f':''} ${k===S.i?'c':''}" aria-label="Question ${k+1}${x.flag?', flagged':''}${x.pick!==null?', answered':''}">${k+1}</button>`).join('')}</div>`;
 }else{
  foot=`<div class="row between foot"><button type="button" class="linkish" data-a="home">Quit</button><button type="button" class="btn" data-a="${last?'finish-yes':'next'}" ${ans?'':'disabled'}>${last?'See results':'Next question'}</button></div>`;
 }
 app.innerHTML=`
 <div class="topbar"><span class="tag">Question ${S.i+1} of ${n} · <b>${esc(secName(q.s))}</b></span>
  ${ex?`<span class="clock" id="clock">${fmt(Date.now()-S.t0)}</span>`:`<span class="score" aria-label="Score so far">✓ ${good} · ✗ ${bad}</span>`}</div>
 <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="${n}" aria-valuenow="${ex?nDone:S.i+(ans?1:0)}"><i style="width:${(ex?nDone:S.i+(ans?1:0))/n*100}%"></i></div>
 <div class="qtext" id="q"><h2>${esc(q.q)}</h2><span class="lvl">${LVL[q.l]}</span></div>
 <ul class="opts">${opts}</ul>${fb}${foot}`;
 window.scrollTo(0,0);
}

function pick(k){
 const it=S.list[S.i];
 if(S.mode==='practice'){
  if(it.pick!==null)return;
  it.pick=k;store.done[it.q.id]=it.opts[k].ok?'c':'w';save();
 }else{it.pick=k}
 quiz();
}

function finish(){
 clearInterval(timer);
 S.list.forEach(it=>{if(S.mode==='exam'){store.done[it.q.id]=isOk(it)?'c':'w'}});
 save();S.end=Date.now();S.over=true;results();
}

/* ---------- RESULTS ---------- */
function results(){
 const L=S.list,n=L.length,ok=L.filter(isOk).length,pct=Math.round(ok/n*100);
 const verdict=pct>=85?'Exam-ready on this set. Keep the weak spots fresh.':pct>=70?'Solid base. Tighten the sections marked in pink.':'Keep drilling. Redo your mistakes, then try again.';
 const secs=SECS.map(s=>{const l=L.filter(x=>x.q.s===s.k);if(!l.length)return '';const c=l.filter(isOk).length,p=Math.round(c/l.length*100);
  return `<div class="brow"><span>${esc(s.n)}</span><span class="num">${c}/${l.length}</span><span class="meter"><i class="${p<70?'low':''}" style="width:${p}%"></i></span></div>`}).join('');
 const wrong=L.filter(x=>!isOk(x));
 const shown=S.rf==='wrong'?wrong:L;
 const rev=shown.map(it=>{const k=L.indexOf(it);
  const yours=it.pick===null?'<b>No answer</b>':`<b>${esc(it.opts[it.pick].t)}</b>`;
  return `<article class="item"><span class="tag">Question ${k+1} · ${esc(secName(it.q.s))}</span><p class="q">${esc(it.q.q)}</p>
  ${isOk(it)?'':`<p class="yours">Your answer: ${yours}</p>`}<p class="right">Correct: <b>${esc(it.q.c)}</b></p><p class="ex">${esc(it.q.e)}</p></article>`}).join('');
 app.innerHTML=`
 <p class="eyebrow">${S.mode==='exam'?'Exam':'Practice'} complete · ${fmt(S.end-S.t0)}</p>
 <div class="big">${ok}<small> / ${n}</small></div>
 <h2 style="margin-top:8px">${pct}% · ${verdict}</h2>
 <div class="row start"><button type="button" class="btn" data-a="retry" ${wrong.length?'':'disabled'}>Redo my ${wrong.length} mistake${wrong.length===1?'':'s'}</button><button type="button" class="btn ghost" data-a="home">Back to start</button></div>
 <p class="sec-title">By section</p><div class="breakdown">${secs}</div>
 <p class="sec-title">Review</p>
 <div class="row"><button type="button" class="btn small ${S.rf==='wrong'?'':'ghost'}" data-a="rf" data-v="wrong">Mistakes (${wrong.length})</button><button type="button" class="btn small ${S.rf==='all'?'':'ghost'}" data-a="rf" data-v="all">All questions</button></div>
 <div class="rev">${rev||'<p class="lead">No mistakes in this run.</p>'}</div>`;
 window.scrollTo(0,0);
}

/* ---------- FLASHCARDS ---------- */
function cards(pool){
 if(!pool.length)return;
 C={list:shuffle(pool),i:0,f:false};renderCard();
}
function renderCard(){
 const q=C.list[C.i],n=C.list.length;
 app.innerHTML=`
 <div class="topbar"><span class="tag">Card ${C.i+1} of ${n} · <b>${esc(secName(q.s))}</b></span><button type="button" class="linkish" data-a="home">Back to start</button></div>
 <div class="bar"><i style="width:${(C.i+1)/n*100}%"></i></div>
 <button type="button" class="card ${C.f?'back':''}" id="card" data-a="flip" aria-live="polite">
  ${C.f?`<span class="side">Answer</span><span class="ans">${esc(q.c)}</span><span class="ex">${esc(q.e)}</span>`:`<span class="side">Question</span><h2>${esc(q.q)}</h2>`}
 </button>
 <p class="hint">Tap the card or press Space to flip. Arrow keys move between cards.</p>
 <div class="row between foot"><button type="button" class="btn ghost" data-a="cprev" ${C.i===0?'disabled':''}>Previous</button><button type="button" class="btn" data-a="cnext" ${C.i===n-1?'disabled':''}>Next card</button></div>`;
}

/* ---------- EVENTS ---------- */
app.addEventListener('change',e=>{if(e.target.name==='scope')scope=e.target.value});
app.addEventListener('click',e=>{
 const b=e.target.closest('[data-a]');if(!b||b.disabled)return;
 const a=b.dataset.a,v=b.dataset.v,i=b.dataset.i!==undefined?+b.dataset.i:null;
 switch(a){
  case 'mode':mode=v;document.querySelectorAll('.seg button').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.v===mode)));$('#mnote').textContent=MODE_NOTE[mode];break;
  case 'start':{const p=poolFor(scope);if(mode==='cards')cards(p);else startSession(mode,p);break}
  case 'reset':resetAsk=true;home();break;
  case 'reset-no':resetAsk=false;home();break;
  case 'reset-yes':store={done:{}};save();resetAsk=false;home();break;
  case 'pick':pick(i);break;
  case 'next':if(S.i<S.list.length-1){S.i++;S.ask=false;quiz()}break;
  case 'prev':if(S.i>0){S.i--;S.ask=false;quiz()}break;
  case 'jump':S.i=i;S.ask=false;quiz();break;
  case 'flag':S.list[S.i].flag=!S.list[S.i].flag;quiz();break;
  case 'finish':S.ask=true;quiz();break;
  case 'finish-no':S.ask=false;quiz();break;
  case 'finish-yes':finish();break;
  case 'home':home();break;
  case 'rf':S.rf=v;results();break;
  case 'retry':startSession('practice',S.list.filter(x=>!isOk(x)).map(x=>x.q));break;
  case 'flip':C.f=!C.f;renderCard();break;
  case 'cnext':if(C.i<C.list.length-1){C.i++;C.f=false;renderCard()}break;
  case 'cprev':if(C.i>0){C.i--;C.f=false;renderCard()}break;
 }
});
document.addEventListener('keydown',e=>{
 if(e.metaKey||e.ctrlKey||e.altKey)return;
 if(S&&!S.over&&$('#q')){
  const k='1234'.indexOf(e.key),k2='abcd'.indexOf(e.key.toLowerCase());
  const idx=k>-1?k:k2;
  if(idx>-1&&idx<4){pick(idx);return}
  if(e.key==='ArrowRight'){const nx=S.list[S.i].pick!==null||S.mode==='exam';if(nx&&S.i<S.list.length-1){S.i++;S.ask=false;quiz()}}
  if(e.key==='ArrowLeft'&&S.mode==='exam'&&S.i>0){S.i--;S.ask=false;quiz()}
 }else if(C&&$('#card')){
  if(e.key===' '&&document.activeElement===document.body){e.preventDefault();C.f=!C.f;renderCard()}
  if(e.key==='ArrowRight'&&C.i<C.list.length-1){C.i++;C.f=false;renderCard()}
  if(e.key==='ArrowLeft'&&C.i>0){C.i--;C.f=false;renderCard()}
 }
});
home();
})();
</script>

</body></html>
