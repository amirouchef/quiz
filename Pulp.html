<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Pulp Question Bank</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one calm column, like a stained-slide study sheet. Hematoxylin indigo for structure, eosin pink for emphasis. */
:root{
  --bg:#FAF6FA; --surface:#FFFFFF; --fg:#241B35; --muted:#6B5F7E; --line:#E4DBEA;
  --hema:#3A2E8C; --hema-ink:#FFFFFF; --hema-soft:#ECE8F8; --eosin:#C42E79;
  --ok:#17694A; --ok-bg:#E1F3EA; --bad:#A8231B; --bad-bg:#FBE6E3;
  --f-display:'Bricolage Grotesque',system-ui,sans-serif;
  --f-body:'Public Sans',system-ui,-apple-system,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#130F1D; --surface:#1D1830; --fg:#EEE9F7; --muted:#A79BBD; --line:#352C4E;
    --hema:#A99BFF; --hema-ink:#150F2E; --hema-soft:#2A2350; --eosin:#F26CA9;
    --ok:#5CD6A0; --ok-bg:#123628; --bad:#FF8A80; --bad-bg:#3A1A1E; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#130F1D; --surface:#1D1830; --fg:#EEE9F7; --muted:#A79BBD; --line:#352C4E;
  --hema:#A99BFF; --hema-ink:#150F2E; --hema-soft:#2A2350; --eosin:#F26CA9;
  --ok:#5CD6A0; --ok-bg:#123628; --bad:#FF8A80; --bad-bg:#3A1A1E; color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--fg); font:16px/1.55 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:20px 56px;
}
.wrap{max-width:760px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
h1{font-size:clamp(28px,6.4vw,42px);line-height:1.08;letter-spacing:-.01em;margin:6px 0 10px}
h2{font-size:clamp(19px,4.4vw,24px);line-height:1.3;font-weight:600}
h3{font-size:15px;font-weight:600}
p{margin:0}
.eyebrow{font:500 12px var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--eosin)}
.lead{color:var(--muted);max-width:60ch}
.mono{font-family:var(--f-mono)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--eosin);outline-offset:2px}

/* stage ribbon */
.ribbon{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px;margin:22px 0 6px}
.ribbon div{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--hema);border-radius:8px;padding:8px 10px;min-width:0}
.ribbon div:nth-child(1){border-top-color:color-mix(in srgb,var(--hema) 40%,var(--line))}
.ribbon div:nth-child(2){border-top-color:color-mix(in srgb,var(--hema) 55%,var(--line))}
.ribbon div:nth-child(3){border-top-color:color-mix(in srgb,var(--hema) 72%,var(--line))}
.ribbon div:nth-child(5){border-top-color:var(--eosin)}
.ribbon b{display:block;font-family:var(--f-display);font-size:15px}
.ribbon span{font:500 12px var(--f-mono);color:var(--muted)}
.cap{font-size:13px;color:var(--muted);margin-bottom:26px}

.sec-title{margin:26px 0 10px;font:500 12px var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--hema-soft);padding:5px;border-radius:12px}
.seg button{border:0;background:transparent;padding:10px 8px;border-radius:9px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--hema);color:var(--hema-ink)}
.mode-note{margin-top:10px;color:var(--muted);font-size:14.5px;min-height:2.9em}

.scopes{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px}
.scope{display:block;position:relative;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:11px 14px;cursor:pointer;min-width:0}
.scope input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.scope:has(input:checked){border-color:var(--hema);background:var(--hema-soft)}
.scope:has(input:focus-visible){outline:3px solid var(--eosin);outline-offset:2px}
.scope:has(input:disabled){opacity:.5;cursor:not-allowed}
.sc-name{display:block;font-weight:600;line-height:1.3}
.sc-meta{display:block;font-size:13px;color:var(--muted);margin:2px 0 7px}
.meter{display:block;height:5px;background:var(--line);border-radius:3px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--hema);border-radius:3px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--hema);background:var(--hema);color:var(--hema-ink);border-radius:11px;padding:12px 20px;font-weight:600}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--hema)}
.btn.small{padding:8px 13px;font-size:14px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.flagged{border-color:var(--eosin);color:var(--eosin)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row.between{justify-content:space-between}
.start{margin-top:24px}
.linkish{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;font-size:14px}

/* quiz */
.topbar{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-bottom:10px}
.tag{font:500 12px var(--f-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.tag b{color:var(--eosin);font-weight:500}
.clock{font:500 15px var(--f-mono);font-variant-numeric:tabular-nums}
.score{font:500 14px var(--f-mono);font-variant-numeric:tabular-nums;color:var(--muted)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:22px}
.bar i{display:block;height:100%;background:var(--hema);transition:width .25s}
.qtext{margin-bottom:18px}
.lvl{display:inline-block;margin-top:8px;font:500 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:20px;padding:2px 9px}
.opts{display:grid;gap:9px;margin:0;padding:0;list-style:none}
.opt{width:100%;display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;line-height:1.45}
.opt:hover:not([disabled]){border-color:var(--hema)}
.opt .l{font:500 13px var(--f-mono);display:grid;place-items:center;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);color:var(--muted)}
.opt.sel{border-color:var(--hema);background:var(--hema-soft)}
.opt.sel .l{background:var(--hema);color:var(--hema-ink);border-color:var(--hema)}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.ok .l{background:var(--ok);border-color:var(--ok);color:var(--bg)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt.bad .l{background:var(--bad);border-color:var(--bad);color:var(--bg)}
.opt.dim{opacity:.62}
.opt[disabled]{cursor:default}
.fb{margin-top:16px;border-radius:12px;padding:14px 16px;display:grid;gap:6px}
.fb.good{background:var(--ok-bg)}
.fb.miss{background:var(--bad-bg)}
.fb strong{font-family:var(--f-display);font-size:17px}
.fb.good strong{color:var(--ok)}
.fb.miss strong{color:var(--bad)}
.foot{margin-top:22px}
.nav{display:flex;flex-wrap:wrap;gap:6px;margin-top:22px}
.nav button{width:34px;height:34px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);font:500 12px var(--f-mono);font-variant-numeric:tabular-nums;padding:0}
.nav button.a{background:var(--hema-soft);border-color:var(--hema)}
.nav button.f{border-color:var(--eosin);box-shadow:inset 0 -3px 0 var(--eosin)}
.nav button.c{background:var(--hema);color:var(--hema-ink);border-color:var(--hema)}
.warn{margin-top:16px;background:var(--hema-soft);border-radius:12px;padding:14px 16px;display:grid;gap:10px}

/* results */
.big{font-family:var(--f-display);font-size:clamp(54px,16vw,88px);line-height:1;font-weight:700;color:var(--hema);font-variant-numeric:tabular-nums}
.big small{font-size:.4em;color:var(--muted);font-weight:600}
.breakdown{display:grid;gap:10px;margin-top:6px}
.brow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center}
.brow .meter{grid-column:1/-1;height:7px}
.brow .meter i.low{background:var(--eosin)}
.num{font:500 13px var(--f-mono);font-variant-numeric:tabular-nums;color:var(--muted)}
.rev{display:grid;gap:12px;margin-top:12px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:8px;min-width:0}
.item .q{font-weight:600}
.item .yours,.item .right{font-size:15px}
.item .yours b{color:var(--bad)}
.item .right b{color:var(--ok)}
.item .ex{font-size:14.5px;color:var(--muted)}

/* flashcards */
.card{display:block;width:100%;min-height:260px;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:24px 22px;position:relative}
.card.back{background:var(--hema-soft);border-color:var(--hema)}
.card .side{font:500 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--eosin);margin-bottom:12px;display:block}
.card .ans{font-family:var(--f-display);font-size:clamp(19px,4.6vw,24px);line-height:1.3;font-weight:600;display:block;margin-bottom:12px}
.card .ex{color:var(--muted);display:block}
.hint{font-size:13px;color:var(--muted);margin-top:8px}

@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>

<script>
/* Each row: section, question, CORRECT answer, wrong 1, wrong 2, wrong 3, explanation, level (1 recall, 2 understand, 3 tricky). Option order is shuffled at runtime. */
const SECS=[
 {k:'A',n:'Introduction and pulp anatomy'},
 {k:'B',n:'Functions of the pulp'},
 {k:'C',n:'Odontoblasts'},
 {k:'D',n:'Fibroblasts, stem and inflammatory cells'},
 {k:'E',n:'Fibers and ground substance'},
 {k:'F',n:'Histological layers'},
 {k:'G',n:'Vascularization'},
 {k:'H',n:'Innervation'},
 {k:'I',n:'Aging and environmental responses'}
];
const RAW=[
['A',"What is the approximate composition of the dental pulp?","75% water and 25% organic matter","25% water and 75% organic matter","50% water and 50% inorganic matter","70% inorganic matter and 30% water","The pulp is 75% water and 25% organic matter (cells and extracellular matrix). The 70% inorganic figure belongs to dentin.",1],
['A',"Which statement best defines the dental pulp?","The only soft tissue of the tooth, a highly vascularized and innervated connective tissue","A mineralized tissue that covers the root","An epithelial tissue derived from the enamel organ","An avascular tissue nourished by the periodontal ligament","The pulp is the single soft tissue of the tooth. It supports dentin physically and nutritionally.",1],
['A',"What are the two portions of the pulp cavity?","Coronal portion (pulp chamber) and root portion (root canal)","Cervical portion and apical portion only","Enamel chamber and dentin canal","Vestibular chamber and palatal canal","The pulp cavity has a coronal part, the pulp chamber, and a root part, the root canal.",1],
['A',"What are pulp horns?","Extensions of the pulp chamber below the cusps","Branches of the root canal toward the periodontal ligament","Nerve bundles in the root pulp","Calcifications of the pulp core","Pulp horns lie below the cusps. They are especially prominent under the vestibular cusp of premolars and the mesiovestibular cusp of molars.",1],
['A',"Where do the pulp and the periodontal ligament meet, with major nerves and vessels entering and leaving the tooth?","At the apical foramen","At the pulp horn","At the cementoenamel junction","At the cell-free zone of Weil","The root canal ends at the apical foramen, the main communication between pulp and periodontium.",1],
['A',"How does the apical foramen change as the tooth develops?","Wide and central in developing teeth, smaller and eccentric in developed teeth","Small and eccentric in developing teeth, wide and central in developed teeth","It stays wide and central throughout life","It closes completely after eruption","In a developing tooth the foramen is wide and central. In a developed tooth it is smaller (0.3 to 0.6 mm) and eccentric.",2],
['A',"Where is the apical foramen usually located in a developed tooth?","At the anatomical apex or slightly more occlusal, about 0.5 to 0.75 mm from it","Exactly at the cementoenamel junction","2 to 3 mm from the apex, in the middle third","Always exactly at the anatomical apex","It lies at the root end or 0.5 to 0.75 mm occlusal to the apex, which is why working length is not simply the radiographic apex.",2],
['A',"If a root has more than one foramen, how are they named?","The largest is the apical foramen and the others are accessory foramina","All are called apical foramina","The largest is a lateral canal and the others are apical","The smallest is the apical foramen","Only the largest foramen is called apical. The others are accessory foramina.",2],
['A',"What is the clinical importance of lateral canals?","They connect pulp and periodontal tissues and can spread disease from one to the other","They only carry nerves to the enamel","They are blocked from birth and have no clinical role","They connect the pulp with enamel","Lateral canals link pulp and periodontium. Pulp disease can alter periodontal tissues, and more rarely periodontal disease affects the pulp.",2],
['A',"Which spread of disease through lateral canals is described as MORE common?","Pulp disease affecting periodontal tissues","Periodontal disease affecting the pulp","Both are equally common","Neither can occur","Diseases of the pulp more often lead to periodontal changes. The reverse happens more rarely.",3],
['B',"Which function describes the pulp's role in enamel synthesis?","Inductive: dentin deposition is necessary for enamel synthesis","Formative: it builds enamel prisms","Nutritive: it feeds ameloblasts","Defensive: it repairs enamel","In the inductive function, dentin deposition is needed for enamel formation. The formative function concerns dentin.",2],
['B',"Which function is the pulp essential for regarding dentin?","Formative: formation and preservation of dentin","Sensitive: abolishing dentin pain","Inductive: forming cementum","Nutritive: producing enamel","The pulp is essential for the formation and preservation of dentin through the odontoblasts.",1],
['B',"How does the pulp nourish dentin?","Through the odontoblastic extensions","Through lateral canals only","Through enamel rods","Through the cementum","The nutritive function relies on odontoblastic extensions inside the dentinal tubules.",1],
['B',"How does pain differ between dentin and pulp?","Dentin pain is acute; pulp pain is dull and throbbing","Dentin pain is dull; pulp pain is acute","Both are always acute and well localized","Neither tissue transmits pain","The pulp is the only dental tissue with nerve fibers. Dentin pain is acute, pulp pain is dull and throbbing.",2],
['B',"Which are the two repair responses of the pulp's defense function?","Peritubular dentin formation and tertiary dentin formation","Enamel and cementum formation","Predentin and mantle dentin formation","Hypercementosis and root resorption","The pulp defends itself by peritubular dentin (sclerosis) and tertiary dentin formation.",2],
['C',"Which cells are specific to the pulp?","Odontoblasts","Fibroblasts","Macrophages","Pericytes","Odontoblasts are the specific pulp cells. They form a peripheral layer and send processes into dentin.",1],
['C',"Where are odontoblast cell bodies and processes located?","Bodies at the pulp periphery, processes extending toward dentin","Bodies inside the dentinal tubules","Bodies in the pulp core","Bodies in the cementum","They form a layer covering the pulp periphery and extend their processes toward the dentin.",1],
['C',"How do odontoblasts differ between crown and root?","Crown odontoblasts are larger than root odontoblasts","Root odontoblasts are larger than crown odontoblasts","They are identical","Crown odontoblasts are flat, root ones are columnar in all cases","Odontoblasts of the crown are larger than those of the root. The number also varies with tooth type and location.",2],
['C',"What happens to odontoblasts once they differentiate?","They cannot undergo further cell division","They keep dividing throughout life","They become fibroblasts","They turn into ameloblasts","Differentiated odontoblasts are post-mitotic. Replacement comes from pulp stem cells.",2],
['C',"What is the shape of odontoblasts along the pulp?","Columnar (about 50 µm) in the crown, cuboid in the middle, flattened apically","Flattened in the crown, columnar apically","Cuboid everywhere","Columnar in the root, flattened in the crown","Odontoblasts are columnar in the crown (about 50 µm high), cuboid in the middle third and flattened in the apical part.",2],
['C',"Which features characterize an active (secretory) odontoblast?","Basal nucleus, basophilic cytoplasm, prominent Golgi zone, many mitochondria and secretory granules","Apical nucleus, small cytoplasm, few or no secretory granules","No organelles at all","Multiple nuclei and abundant lysosomes","Active cells are elongated with abundant synthetic organelles. Aged cells have a more apical nucleus and few or no secretory granules.",2],
['C',"What does the odontoblastic process contain?","Few major organelles but many microtubules and filaments arranged linearly","Nucleus and Golgi apparatus","Abundant rough endoplasmic reticulum","Mitochondria packed in clusters","The process lacks major organelles but is rich in microtubules and filaments. Granules along its membrane reflect pinocytotic activity.",3],
['C',"What is dentinal fluid?","The fluid filling the space between the odontoblastic process and the tubule wall","The fluid inside the odontoblast nucleus","Blood plasma inside capillaries","Saliva entering the tubule","Dentinal fluid occupies the periprocessal space and contains proteoglycans, tenascin, fibronectin, serum albumin and transferrin among others.",2],
['D',"Which are the main cells of the pulp, especially in the crown?","Fibroblasts","Odontoblasts","Macrophages","Lymphocytes","Fibroblasts are the most numerous pulp cells. They form, maintain and regulate the matrix.",1],
['D',"What do pulp fibroblasts secrete?","Precursors of collagen, reticular and elastic fibers and the ground substance","Enamel matrix proteins","Only hydroxyapatite crystals","Antibodies","Fibroblasts produce fibers and ground substance, and can also degrade collagen, so they are multifunctional.",1],
['D',"How do fibroblasts change in aged pulps?","Matrix synthesis and organelles decrease, cells flatten and become fibrocytes","They become rounded with long extensions and more organelles","They become odontoblasts","They increase matrix synthesis","Young pulps have active, rounded fibroblasts. In aged pulps they flatten and transform into fibrocytes.",2],
['D',"What is the role of ectomesenchymal (undifferentiated mesenchymal) cells?","They form the pulp reserve and can differentiate according to the stimulus","They secrete enamel","They only transport oxygen","They produce dentinal fluid","They are the reserve population. They can become fibroblasts, osteoblasts, cementoblasts or odontoblasts.",2],
['D',"What is the embryonic origin of ectomesenchymal pulp cells?","Ectoderm of the neural crest","Endoderm","Paraxial mesoderm","Enamel organ epithelium","Despite the name undifferentiated mesenchymal, they derive from neural crest ectoderm.",3],
['D',"How does the number of mesenchymal cells change with age?","It decreases, reducing pulp defense","It increases, improving defense","It stays constant","It increases only in the root","Fewer mesenchymal cells means less regenerative and defensive capacity.",2],
['D',"What is the function of pulp macrophages?","Removal of dead cells; they derive from blood","Secretion of dentin matrix","Formation of the von Korff plexus","Transmission of pain","Macrophages are blood-derived and remove dead cells.",1],
['D',"What is the role of pulp dendritic cells?","They carry MHC II and capture and present antigens to T cells","They secrete collagen type I","They line the capillary lumen","They produce dentin","Dendritic cells start the primary immune response by presenting foreign antigens to T lymphocytes.",2],
['E',"Which collagen types are synthesized by pulp fibroblasts, with a stable ratio?","Types I and III","Types II and IV","Types IV and V","Type X only","Fibroblasts produce types I and III and the ratio between them remains stable.",1],
['E',"How does type I collagen vary along the pulp?","Few and irregular in the coronal pulp, parallel and more concentrated in the root","Dense in the crown, absent in the root","Equal everywhere","Parallel in the crown, irregular in the root","Collagen is more abundant in the apical portion of the pulp and increases with age.",2],
['E',"What forms the von Korff plexus?","Thin type III collagen fibrils with fibronectin, interwoven with odontoblasts","Thick type I bundles in the pulp core","Elastic fibers around arterioles","Nerve fibers below the odontoblasts","Type III collagen (reticulin) with fibronectin intertwines with odontoblasts. Do not confuse it with the nerve plexus of Raschkow.",3],
['E',"Where are elastic fibers found in the pulp?","Very scarce, around afferent blood vessels","Abundant in the pulp core","In the odontoblastic layer","In predentin","Elastic fibers, made of elastin, are scarce and located around afferent vessels. Oxytalan fibers are immature elastic fibers.",2],
['E',"What is the role of the pulp ground substance?","Transport of nutrients from vessels to cells and of waste back to the vasculature","Mineralization of dentin","Immune presentation of antigens","Contraction of arterioles","It acts as the transport medium. Its glycosaminoglycans give the matrix a gelatinous viscosity and it decreases with age.",2],
['F',"What is the correct order of pulp layers from the periphery to the center?","Odontoblastic zone, cell-free zone of Weil, cell-rich zone, pulp core","Pulp core, cell-rich zone, cell-free zone, odontoblastic zone","Cell-rich zone, odontoblastic zone, pulp core, cell-free zone","Cell-free zone, odontoblastic zone, pulp core, cell-rich zone","From external to internal: odontoblasts, zone of Weil, cell-rich zone, then the core.",1],
['F',"What does the cell-free zone of Weil contain despite its name?","Raschkow nerve plexus, fibroblasts and dendritic cells","Only odontoblast bodies","Dense bundles of type I collagen","Main arteries of the pulp","It is poor in cells but contains the subodontoblastic nerve plexus, capillaries and some fibroblasts and dendritic cells.",2],
['F',"Which cells dominate the cell-rich zone?","Mesenchymal cells and fibroblasts","Odontoblasts","Neutrophils","Pericytes only","The cell-rich zone has high cell density, mostly mesenchymal cells and fibroblasts. It decreases with aging.",2],
['F',"Where are the main vessels and nerves of the pulp located?","In the pulp core (central zone)","In the odontoblastic zone","In predentin","In the cell-free zone only","The core is rich in vessels and nerves and has few fibers.",1],
['F',"Where are the cell-free and cell-rich zones more prominent?","In the coronal pulp more than in the root pulp","In the root pulp more than in the coronal pulp","Equally in both","Only at the apex","Both zones are more prominent in the coronal pulp.",2],
['G',"What happens to pulp vessels in the coronal region?","They branch, decrease in caliber and form the subodontoblastic capillary plexus","They enlarge into sinusoids","They end blindly in the core","They enter the dentinal tubules","The capillary plexus below the odontoblasts nourishes them. Capillaries can be continuous or fenestrated.",2],
['G',"How does blood flow compare between crown and root?","Almost twice as much blood reaches the crown","Almost twice as much reaches the root","Flow is identical","The root receives all the blood","Blood flow to the crown is about double that of the root region.",2],
['G',"How do metabolites cross fenestrated and continuous capillaries?","Through pores in fenestrated ones; by transcytosis with pinocytic vesicles in continuous ones","Pinocytic vesicles in fenestrated ones; pores in continuous ones","Only by passive leakage between nerves","Only through the lymphatics","Fenestrated capillaries use pores. Continuous capillaries rely on transcytosis.",3],
['G',"What do pericytes do in pulp capillaries?","Wrap around the endothelium, stabilize walls and can differentiate into macrophages","Secrete dentin","Conduct pain","Form the cell-free zone","Pericytes regulate and maintain capillary walls and help maintain the basal lamina.",2],
['G',"Which lymph nodes drain the anterior lower teeth?","Submental nodes","Submandibular nodes","Deep cervical nodes","Parotid nodes","Anterior lower teeth drain to submental nodes. Upper teeth drain to submandibular and deep cervical nodes.",2],
['H',"How are nerve fibers classified?","By myelin and caliber: A (myelinated, large, fastest), B (myelinated, medium), C (unmyelinated, small)","By length only","By color","By the tooth where they are found","A fibers are the fastest, B are medium and C are unmyelinated and small.",1],
['H',"Where is the subodontoblastic plexus of Raschkow?","In the crown, in the cell-free zone just below the odontoblast bodies","In the root, in the pulp core","In predentin","In the cementum","In the crown nerves form this plexus. In the root there is no plexus and each branch supplies its own territory.",2],
['H',"Which are the two types of pulp innervation?","Autonomic and sensory","Motor and sensory","Somatic and visceral motor","Parasympathetic only","Pulp nerves are autonomic (vessel control) and sensory (pain).",1],
['H',"What do sympathetic C fibers of the pulp do?","Control arteriolar caliber (vasomotor), from the superior cervical ganglion, with noradrenaline","Dilate vessels via acetylcholine and VIP","Conduct sharp pain","Innervate odontoblasts directly","Sympathetic fibers are slow and vasomotor. Parasympathetic C-type fibers with acetylcholine and VIP contribute to vasodilation.",3],
['H',"Which fibers conduct acute, well-localized pain triggered by hydrodynamic, tactile, osmotic or thermal stimuli?","Myelinated A fibers of the peripheral pulp","C unmyelinated fibers of the internal pulp","B fibers","Sympathetic C fibers","A fibers are fast, in the peripheral pulp and can reach the odontoblast processes. C fibers give poorly localized, prolonged pain.",2],
['H',"Why is lack of pulp response not a sign of death in an immature tooth?","A delta fibers mature only after 4 or 5 years of occlusion","C fibers are absent from birth","The pulp has no vessels","Odontoblasts are not yet formed","Because A delta fibers are not mature, the lack of response may be normal in an immature tooth.",3],
['H',"Which fibers respond to bradykinin and histamine but not to hydrodynamic stimuli?","C unmyelinated fibers","A delta fibers","A beta fibers","Sympathetic B fibers","C fibers respond to chemical inflammatory mediators and give dull, poorly localized pain.",3],
['I',"Which change does NOT occur in the pulp with aging?","Increase in vascularization and innervation","Reduction in pulp volume","Decrease in cell population","Increase in collagen","With aging, irrigation and innervation decrease.",2],
['I',"How does pulp connective tissue evolve with age?","Lax tissue becomes semi-dense: more collagen and less ground substance","Semi-dense tissue becomes lax","Ground substance increases and collagen decreases","It stays unchanged","Increased collagen and reduced amorphous ground substance reduce the tissue's capacity to respond.",2],
['I',"What are the irregular centers of mineralization of the adult pulp?","Pulp calcifications formed by mineral salts on the collagen matrix, true (with tubules) or false (in layers)","Tertiary dentin lining the cavity","Enamel pearls","Cementicles of the periodontal ligament","They are common in the central pulp and increase with age. True ones have dentinal tubules, false ones are laminated.",3]
];
const QS=RAW.map((r,i)=>({id:i+1,s:r[0],q:r[1],c:r[2],w:[r[3],r[4],r[5]],e:r[6],l:r[7]}));

</script>

<script>
(function(){
const LET=['A','B','C','D'];
const LVL={1:'Recall',2:'Understand',3:'Tricky'};
const STAGES=[['Odontoblastic zone','periphery'],['Zone of Weil','cell-free'],['Cell-rich zone','reserve cells'],['Pulp core','vessels and nerves']];
const KEY='dental-pulp-qb-v1';
const app=document.getElementById('app');
let store={done:{}};
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&s.done)store=s}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}}
const $=s=>document.querySelector(s);
function esc(t){return String(t).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function secName(k){return SECS.find(s=>s.k===k).n}
function fmt(ms){const t=Math.floor(ms/1000);return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')}
const isOk=it=>it.pick!==null&&it.opts[it.pick].ok;

let mode='practice',scope='all',S=null,C=null,timer=null,resetAsk=false;

const MODE_NOTE={
 practice:'One question at a time. You see right away whether you were correct and read the explanation.',
 exam:'No feedback until you finish. Move back and forth, flag questions, and watch the clock.',
 cards:'The question on the front, the answer and its explanation on the back. Good for a last pass.'
};

function poolFor(sc){
 if(sc==='all')return QS.slice();
 if(sc==='weak')return QS.filter(q=>store.done[q.id]==='w');
 return QS.filter(q=>q.s===sc);
}

/* ---------- HOME ---------- */
function home(){
 clearInterval(timer);S=null;C=null;
 const weak=poolFor('weak').length;
 if(scope==='weak'&&!weak)scope='all';
 const tried=QS.filter(q=>store.done[q.id]).length;
 const right=QS.filter(q=>store.done[q.id]==='c').length;
 const rows=[{k:'all',n:'All sections'}].concat(SECS).map(s=>{
  const p=poolFor(s.k),c=p.filter(q=>store.done[q.id]==='c').length;
  return `<label class="scope"><input type="radio" name="scope" value="${s.k}" ${scope===s.k?'checked':''}><span class="sc-name">${esc(s.n)}</span><span class="sc-meta">${p.length} questions · ${c} answered correctly</span><span class="meter"><i style="width:${Math.round(c/p.length*100)}%"></i></span></label>`;
 }).join('')+`<label class="scope"><input type="radio" name="scope" value="weak" ${scope==='weak'?'checked':''} ${weak?'':'disabled'}><span class="sc-name">My mistakes</span><span class="sc-meta">${weak?weak+' questions you last got wrong':'Nothing to review yet'}</span><span class="meter"><i style="width:${weak?Math.round(weak/QS.length*100):0}%;background:var(--eosin)"></i></span></label>`;
 app.innerHTML=`
 <p class="eyebrow">Dental Tissues I · Lesson 4</p>
 <h1>Pulp Question Bank</h1>
 <p class="lead">${QS.length} single-answer questions with a full explanation for each one, built from the Lesson 4 slides: pulp anatomy, functions, odontoblasts and other cells, fibers and ground substance, histological layers, vascularization, innervation and age-related changes.</p>
 <div class="ribbon" aria-label="Pulp layers">${STAGES.map(s=>`<div><b>${s[0]}</b><span>${s[1]}</span></div>`).join('')}</div>
 <p class="cap">The four histological layers of the pulp, from periphery to center. Progress so far: ${right} of ${QS.length} answered correctly${tried?`, ${tried} attempted`:''}.</p>
 <p class="sec-title">1 · Mode</p>
 <div class="seg" role="group" aria-label="Mode">
  ${[['practice','Practice'],['exam','Exam'],['cards','Flashcards']].map(m=>`<button type="button" data-a="mode" data-v="${m[0]}" aria-pressed="${mode===m[0]}">${m[1]}</button>`).join('')}
 </div>
 <p class="mode-note" id="mnote">${MODE_NOTE[mode]}</p>
 <p class="sec-title">2 · Scope</p>
 <div class="scopes">${rows}</div>
 <div class="start row between">
  <button type="button" class="btn" data-a="start">Start</button>
  ${resetAsk?`<span class="row"><span class="tag">Erase saved progress?</span><button type="button" class="btn ghost small" data-a="reset-yes">Erase</button><button type="button" class="btn ghost small" data-a="reset-no">Keep</button></span>`:`<button type="button" class="linkish" data-a="reset">Reset progress</button>`}
 </div>`;
}

/* ---------- SESSION ---------- */
function startSession(m,pool){
 if(!pool.length)return;
 S={mode:m,i:0,t0:Date.now(),ask:false,over:false,rf:'wrong',
  list:shuffle(pool).map(q=>({q,opts:shuffle([{t:q.c,ok:true}].concat(q.w.map(t=>({t,ok:false})))),pick:null,flag:false}))};
 clearInterval(timer);
 if(m==='exam'){timer=setInterval(()=>{const e=$('#clock');if(e)e.textContent=fmt(Date.now()-S.t0)},1000)}
 quiz();
}

function quiz(){
 const ex=S.mode==='exam',it=S.list[S.i],q=it.q,n=S.list.length;
 const ans=it.pick!==null,reveal=!ex&&ans;
 const nDone=S.list.filter(x=>x.pick!==null).length;
 const good=S.list.filter(isOk).length,bad=nDone-good;
 const opts=it.opts.map((o,k)=>{
  let cls='opt';
  if(ex&&it.pick===k)cls+=' sel';
  if(reveal){if(o.ok)cls+=' ok';else if(it.pick===k)cls+=' bad';else cls+=' dim'}
  return `<li><button type="button" class="${cls}" data-a="pick" data-i="${k}" ${reveal?'disabled':''}><span class="l">${LET[k]}</span><span>${esc(o.t)}</span></button></li>`;
 }).join('');
 let fb='';
 if(reveal){
  const ok=isOk(it);
  fb=`<div class="fb ${ok?'good':'miss'}" role="status"><strong>${ok?'Correct':'Not quite'}</strong>${ok?'':`<p><b>Answer:</b> ${esc(q.c)}</p>`}<p>${esc(q.e)}</p></div>`;
 }
 const last=S.i===n-1;
 let foot;
 if(ex){
  const un=n-nDone;
  foot=`<div class="row between foot">
   <span class="row"><button type="button" class="btn ghost" data-a="prev" ${S.i===0?'disabled':''}>Previous</button><button type="button" class="btn ghost" data-a="next" ${last?'disabled':''}>Next</button></span>
   <span class="row"><button type="button" class="btn ghost small ${it.flag?'flagged':''}" data-a="flag" aria-pressed="${it.flag}">${it.flag?'Flagged':'Flag'}</button><button type="button" class="btn small" data-a="finish">Finish exam</button></span>
  </div>
  ${S.ask?`<div class="warn" role="alert"><p>${un?`You left ${un} question${un>1?'s':''} unanswered. They will count as wrong.`:'All questions answered.'} Finish and see your results?</p><div class="row"><button type="button" class="btn small" data-a="finish-yes">Finish</button><button type="button" class="btn ghost small" data-a="finish-no">Keep going</button></div></div>`:''}
  <div class="nav" aria-label="Question navigator">${S.list.map((x,k)=>`<button type="button" data-a="jump" data-i="${k}" class="${x.pick!==null?'a':''} ${x.flag?'f':''} ${k===S.i?'c':''}" aria-label="Question ${k+1}${x.flag?', flagged':''}${x.pick!==null?', answered':''}">${k+1}</button>`).join('')}</div>`;
 }else{
  foot=`<div class="row between foot"><button type="button" class="linkish" data-a="home">Quit</button><button type="button" class="btn" data-a="${last?'finish-yes':'next'}" ${ans?'':'disabled'}>${last?'See results':'Next question'}</button></div>`;
 }
 app.innerHTML=`
 <div class="topbar"><span class="tag">Question ${S.i+1} of ${n} · <b>${esc(secName(q.s))}</b></span>
  ${ex?`<span class="clock" id="clock">${fmt(Date.now()-S.t0)}</span>`:`<span class="score" aria-label="Score so far">✓ ${good} · ✗ ${bad}</span>`}</div>
 <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="${n}" aria-valuenow="${ex?nDone:S.i+(ans?1:0)}"><i style="width:${(ex?nDone:S.i+(ans?1:0))/n*100}%"></i></div>
 <div class="qtext" id="q"><h2>${esc(q.q)}</h2><span class="lvl">${LVL[q.l]}</span></div>
 <ul class="opts">${opts}</ul>${fb}${foot}`;
 window.scrollTo(0,0);
}

function pick(k){
 const it=S.list[S.i];
 if(S.mode==='practice'){
  if(it.pick!==null)return;
  it.pick=k;store.done[it.q.id]=it.opts[k].ok?'c':'w';save();
 }else{it.pick=k}
 quiz();
}

function finish(){
 clearInterval(timer);
 S.list.forEach(it=>{if(S.mode==='exam'){store.done[it.q.id]=isOk(it)?'c':'w'}});
 save();S.end=Date.now();S.over=true;results();
}

/* ---------- RESULTS ---------- */
function results(){
 const L=S.list,n=L.length,ok=L.filter(isOk).length,pct=Math.round(ok/n*100);
 const verdict=pct>=85?'Exam-ready on this set. Keep the weak spots fresh.':pct>=70?'Solid base. Tighten the sections marked in pink.':'Keep drilling. Redo your mistakes, then try again.';
 const secs=SECS.map(s=>{const l=L.filter(x=>x.q.s===s.k);if(!l.length)return '';const c=l.filter(isOk).length,p=Math.round(c/l.length*100);
  return `<div class="brow"><span>${esc(s.n)}</span><span class="num">${c}/${l.length}</span><span class="meter"><i class="${p<70?'low':''}" style="width:${p}%"></i></span></div>`}).join('');
 const wrong=L.filter(x=>!isOk(x));
 const shown=S.rf==='wrong'?wrong:L;
 const rev=shown.map(it=>{const k=L.indexOf(it);
  const yours=it.pick===null?'<b>No answer</b>':`<b>${esc(it.opts[it.pick].t)}</b>`;
  return `<article class="item"><span class="tag">Question ${k+1} · ${esc(secName(it.q.s))}</span><p class="q">${esc(it.q.q)}</p>
  ${isOk(it)?'':`<p class="yours">Your answer: ${yours}</p>`}<p class="right">Correct: <b>${esc(it.q.c)}</b></p><p class="ex">${esc(it.q.e)}</p></article>`}).join('');
 app.innerHTML=`
 <p class="eyebrow">${S.mode==='exam'?'Exam':'Practice'} complete · ${fmt(S.end-S.t0)}</p>
 <div class="big">${ok}<small> / ${n}</small></div>
 <h2 style="margin-top:8px">${pct}% · ${verdict}</h2>
 <div class="row start"><button type="button" class="btn" data-a="retry" ${wrong.length?'':'disabled'}>Redo my ${wrong.length} mistake${wrong.length===1?'':'s'}</button><button type="button" class="btn ghost" data-a="home">Back to start</button></div>
 <p class="sec-title">By section</p><div class="breakdown">${secs}</div>
 <p class="sec-title">Review</p>
 <div class="row"><button type="button" class="btn small ${S.rf==='wrong'?'':'ghost'}" data-a="rf" data-v="wrong">Mistakes (${wrong.length})</button><button type="button" class="btn small ${S.rf==='all'?'':'ghost'}" data-a="rf" data-v="all">All questions</button></div>
 <div class="rev">${rev||'<p class="lead">No mistakes in this run.</p>'}</div>`;
 window.scrollTo(0,0);
}

/* ---------- FLASHCARDS ---------- */
function cards(pool){
 if(!pool.length)return;
 C={list:shuffle(pool),i:0,f:false};renderCard();
}
function renderCard(){
 const q=C.list[C.i],n=C.list.length;
 app.innerHTML=`
 <div class="topbar"><span class="tag">Card ${C.i+1} of ${n} · <b>${esc(secName(q.s))}</b></span><button type="button" class="linkish" data-a="home">Back to start</button></div>
 <div class="bar"><i style="width:${(C.i+1)/n*100}%"></i></div>
 <button type="button" class="card ${C.f?'back':''}" id="card" data-a="flip" aria-live="polite">
  ${C.f?`<span class="side">Answer</span><span class="ans">${esc(q.c)}</span><span class="ex">${esc(q.e)}</span>`:`<span class="side">Question</span><h2>${esc(q.q)}</h2>`}
 </button>
 <p class="hint">Tap the card or press Space to flip. Arrow keys move between cards.</p>
 <div class="row between foot"><button type="button" class="btn ghost" data-a="cprev" ${C.i===0?'disabled':''}>Previous</button><button type="button" class="btn" data-a="cnext" ${C.i===n-1?'disabled':''}>Next card</button></div>`;
}

/* ---------- EVENTS ---------- */
app.addEventListener('change',e=>{if(e.target.name==='scope')scope=e.target.value});
app.addEventListener('click',e=>{
 const b=e.target.closest('[data-a]');if(!b||b.disabled)return;
 const a=b.dataset.a,v=b.dataset.v,i=b.dataset.i!==undefined?+b.dataset.i:null;
 switch(a){
  case 'mode':mode=v;document.querySelectorAll('.seg button').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.v===mode)));$('#mnote').textContent=MODE_NOTE[mode];break;
  case 'start':{const p=poolFor(scope);if(mode==='cards')cards(p);else startSession(mode,p);break}
  case 'reset':resetAsk=true;home();break;
  case 'reset-no':resetAsk=false;home();break;
  case 'reset-yes':store={done:{}};save();resetAsk=false;home();break;
  case 'pick':pick(i);break;
  case 'next':if(S.i<S.list.length-1){S.i++;S.ask=false;quiz()}break;
  case 'prev':if(S.i>0){S.i--;S.ask=false;quiz()}break;
  case 'jump':S.i=i;S.ask=false;quiz();break;
  case 'flag':S.list[S.i].flag=!S.list[S.i].flag;quiz();break;
  case 'finish':S.ask=true;quiz();break;
  case 'finish-no':S.ask=false;quiz();break;
  case 'finish-yes':finish();break;
  case 'home':home();break;
  case 'rf':S.rf=v;results();break;
  case 'retry':startSession('practice',S.list.filter(x=>!isOk(x)).map(x=>x.q));break;
  case 'flip':C.f=!C.f;renderCard();break;
  case 'cnext':if(C.i<C.list.length-1){C.i++;C.f=false;renderCard()}break;
  case 'cprev':if(C.i>0){C.i--;C.f=false;renderCard()}break;
 }
});
document.addEventListener('keydown',e=>{
 if(e.metaKey||e.ctrlKey||e.altKey)return;
 if(S&&!S.over&&$('#q')){
  const k='1234'.indexOf(e.key),k2='abcd'.indexOf(e.key.toLowerCase());
  const idx=k>-1?k:k2;
  if(idx>-1&&idx<4){pick(idx);return}
  if(e.key==='ArrowRight'){const nx=S.list[S.i].pick!==null||S.mode==='exam';if(nx&&S.i<S.list.length-1){S.i++;S.ask=false;quiz()}}
  if(e.key==='ArrowLeft'&&S.mode==='exam'&&S.i>0){S.i--;S.ask=false;quiz()}
 }else if(C&&$('#card')){
  if(e.key===' '&&document.activeElement===document.body){e.preventDefault();C.f=!C.f;renderCard()}
  if(e.key==='ArrowRight'&&C.i<C.list.length-1){C.i++;C.f=false;renderCard()}
  if(e.key==='ArrowLeft'&&C.i>0){C.i--;C.f=false;renderCard()}
 }
});
home();
})();
</script>

</body></html>
