<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Odontogenesis Question Bank</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one calm column, like a stained-slide study sheet. Hematoxylin indigo for structure, eosin pink for emphasis. */
:root{
  --bg:#FAF6FA; --surface:#FFFFFF; --fg:#241B35; --muted:#6B5F7E; --line:#E4DBEA;
  --hema:#3A2E8C; --hema-ink:#FFFFFF; --hema-soft:#ECE8F8; --eosin:#C42E79;
  --ok:#17694A; --ok-bg:#E1F3EA; --bad:#A8231B; --bad-bg:#FBE6E3;
  --f-display:'Bricolage Grotesque',system-ui,sans-serif;
  --f-body:'Public Sans',system-ui,-apple-system,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#130F1D; --surface:#1D1830; --fg:#EEE9F7; --muted:#A79BBD; --line:#352C4E;
    --hema:#A99BFF; --hema-ink:#150F2E; --hema-soft:#2A2350; --eosin:#F26CA9;
    --ok:#5CD6A0; --ok-bg:#123628; --bad:#FF8A80; --bad-bg:#3A1A1E; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#130F1D; --surface:#1D1830; --fg:#EEE9F7; --muted:#A79BBD; --line:#352C4E;
  --hema:#A99BFF; --hema-ink:#150F2E; --hema-soft:#2A2350; --eosin:#F26CA9;
  --ok:#5CD6A0; --ok-bg:#123628; --bad:#FF8A80; --bad-bg:#3A1A1E; color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--fg); font:16px/1.55 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:20px 56px;
}
.wrap{max-width:760px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
h1{font-size:clamp(28px,6.4vw,42px);line-height:1.08;letter-spacing:-.01em;margin:6px 0 10px}
h2{font-size:clamp(19px,4.4vw,24px);line-height:1.3;font-weight:600}
h3{font-size:15px;font-weight:600}
p{margin:0}
.eyebrow{font:500 12px var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--eosin)}
.lead{color:var(--muted);max-width:60ch}
.mono{font-family:var(--f-mono)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--eosin);outline-offset:2px}

/* stage ribbon */
.ribbon{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px;margin:22px 0 6px}
.ribbon div{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--hema);border-radius:8px;padding:8px 10px;min-width:0}
.ribbon div:nth-child(1){border-top-color:color-mix(in srgb,var(--hema) 40%,var(--line))}
.ribbon div:nth-child(2){border-top-color:color-mix(in srgb,var(--hema) 55%,var(--line))}
.ribbon div:nth-child(3){border-top-color:color-mix(in srgb,var(--hema) 72%,var(--line))}
.ribbon div:nth-child(5){border-top-color:var(--eosin)}
.ribbon b{display:block;font-family:var(--f-display);font-size:15px}
.ribbon span{font:500 12px var(--f-mono);color:var(--muted)}
.cap{font-size:13px;color:var(--muted);margin-bottom:26px}

.sec-title{margin:26px 0 10px;font:500 12px var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--hema-soft);padding:5px;border-radius:12px}
.seg button{border:0;background:transparent;padding:10px 8px;border-radius:9px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--hema);color:var(--hema-ink)}
.mode-note{margin-top:10px;color:var(--muted);font-size:14.5px;min-height:2.9em}

.scopes{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px}
.scope{display:block;position:relative;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:11px 14px;cursor:pointer;min-width:0}
.scope input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.scope:has(input:checked){border-color:var(--hema);background:var(--hema-soft)}
.scope:has(input:focus-visible){outline:3px solid var(--eosin);outline-offset:2px}
.scope:has(input:disabled){opacity:.5;cursor:not-allowed}
.sc-name{display:block;font-weight:600;line-height:1.3}
.sc-meta{display:block;font-size:13px;color:var(--muted);margin:2px 0 7px}
.meter{display:block;height:5px;background:var(--line);border-radius:3px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--hema);border-radius:3px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--hema);background:var(--hema);color:var(--hema-ink);border-radius:11px;padding:12px 20px;font-weight:600}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--hema)}
.btn.small{padding:8px 13px;font-size:14px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.flagged{border-color:var(--eosin);color:var(--eosin)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row.between{justify-content:space-between}
.start{margin-top:24px}
.linkish{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;font-size:14px}

/* quiz */
.topbar{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-bottom:10px}
.tag{font:500 12px var(--f-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.tag b{color:var(--eosin);font-weight:500}
.clock{font:500 15px var(--f-mono);font-variant-numeric:tabular-nums}
.score{font:500 14px var(--f-mono);font-variant-numeric:tabular-nums;color:var(--muted)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:22px}
.bar i{display:block;height:100%;background:var(--hema);transition:width .25s}
.qtext{margin-bottom:18px}
.lvl{display:inline-block;margin-top:8px;font:500 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:20px;padding:2px 9px}
.opts{display:grid;gap:9px;margin:0;padding:0;list-style:none}
.opt{width:100%;display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;line-height:1.45}
.opt:hover:not([disabled]){border-color:var(--hema)}
.opt .l{font:500 13px var(--f-mono);display:grid;place-items:center;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);color:var(--muted)}
.opt.sel{border-color:var(--hema);background:var(--hema-soft)}
.opt.sel .l{background:var(--hema);color:var(--hema-ink);border-color:var(--hema)}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.ok .l{background:var(--ok);border-color:var(--ok);color:var(--bg)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt.bad .l{background:var(--bad);border-color:var(--bad);color:var(--bg)}
.opt.dim{opacity:.62}
.opt[disabled]{cursor:default}
.fb{margin-top:16px;border-radius:12px;padding:14px 16px;display:grid;gap:6px}
.fb.good{background:var(--ok-bg)}
.fb.miss{background:var(--bad-bg)}
.fb strong{font-family:var(--f-display);font-size:17px}
.fb.good strong{color:var(--ok)}
.fb.miss strong{color:var(--bad)}
.foot{margin-top:22px}
.nav{display:flex;flex-wrap:wrap;gap:6px;margin-top:22px}
.nav button{width:34px;height:34px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);font:500 12px var(--f-mono);font-variant-numeric:tabular-nums;padding:0}
.nav button.a{background:var(--hema-soft);border-color:var(--hema)}
.nav button.f{border-color:var(--eosin);box-shadow:inset 0 -3px 0 var(--eosin)}
.nav button.c{background:var(--hema);color:var(--hema-ink);border-color:var(--hema)}
.warn{margin-top:16px;background:var(--hema-soft);border-radius:12px;padding:14px 16px;display:grid;gap:10px}

/* results */
.big{font-family:var(--f-display);font-size:clamp(54px,16vw,88px);line-height:1;font-weight:700;color:var(--hema);font-variant-numeric:tabular-nums}
.big small{font-size:.4em;color:var(--muted);font-weight:600}
.breakdown{display:grid;gap:10px;margin-top:6px}
.brow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center}
.brow .meter{grid-column:1/-1;height:7px}
.brow .meter i.low{background:var(--eosin)}
.num{font:500 13px var(--f-mono);font-variant-numeric:tabular-nums;color:var(--muted)}
.rev{display:grid;gap:12px;margin-top:12px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:8px;min-width:0}
.item .q{font-weight:600}
.item .yours,.item .right{font-size:15px}
.item .yours b{color:var(--bad)}
.item .right b{color:var(--ok)}
.item .ex{font-size:14.5px;color:var(--muted)}

/* flashcards */
.card{display:block;width:100%;min-height:260px;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:24px 22px;position:relative}
.card.back{background:var(--hema-soft);border-color:var(--hema)}
.card .side{font:500 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--eosin);margin-bottom:12px;display:block}
.card .ans{font-family:var(--f-display);font-size:clamp(19px,4.6vw,24px);line-height:1.3;font-weight:600;display:block;margin-bottom:12px}
.card .ex{color:var(--muted);display:block}
.hint{font-size:13px;color:var(--muted);margin-top:8px}

@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>

<script>
/* Each row: section, question, CORRECT answer, wrong 1, wrong 2, wrong 3, explanation, level (1 recall, 2 understand, 3 tricky). Option order is shuffled at runtime. */
const SECS=[
 {k:'A',n:'Foundations and tissue origins'},
 {k:'B',n:'Timeline and numbers'},
 {k:'C',n:'Initiation and induction'},
 {k:'D',n:'Signalling molecules and genes'},
 {k:'E',n:'Bud and cap stages'},
 {k:'F',n:'Bell stage and apposition'},
 {k:'G',n:'Anomalies of odontogenesis'},
 {k:'H',n:'Root formation'}
];
const RAW=[
/* A. Foundations */
['A',"Embryology is best defined as the study of…","the progressive growth and differentiation that occur during the early stages of embryonic development","the eruption sequence of primary and permanent teeth","the structure of fully differentiated adult tissues","the genetic mutations that cause congenital malformations","Embryology covers the progressive growth and differentiation of the early embryo. It is the framework in which odontogenesis takes place.",1],
['A',"Which organ derives from the endoderm?","Pancreas","Kidney","Skeletal muscle","Skin","Endoderm gives endocrine glands, lungs and airways, the digestive system, liver, pancreas and urinary bladder. Kidneys and muscle are mesodermal; skin is ectodermal.",1],
['A',"Which list contains only mesodermal derivatives?","Skeleton, kidneys, blood and lymphatic cells","Nervous system, skin, skeleton","Lungs, liver, skeletal muscle","Skin, kidneys, pancreas","Mesoderm forms muscles, skeleton, kidneys, the reproductive system, and blood and lymphatic cells. Each wrong list mixes in an ectodermal or endodermal organ.",2],
['A',"The nervous system and the skin derive from which germ layer?","Ectoderm","Mesoderm","Endoderm","Both mesoderm and endoderm","Ectoderm forms the nervous system and the skin. This is why the oral epithelium that starts odontogenesis is ectodermal.",1],
['A',"Which embryonic components take part in odontogenesis?","Ectoderm, mesoderm and neural crest cells","Endoderm and mesoderm only","Ectoderm and endoderm only","Neural crest cells only","Odontogenesis is part of the embryogenesis of the cranial and maxillofacial complex and involves ectoderm, mesoderm and cells from the neural crest.",1],
['A',"The enamel organ derives from the…","oral ectoderm","ectomesenchyme","dental papilla","dental sac","The enamel organ comes from the oral ectoderm and produces enamel, which is the only ectodermal tissue of the tooth.",1],
['A',"The dental papilla gives rise to…","dentin and dental pulp","enamel only","cementum and periodontal ligament","enamel and cementum","The papilla is ectomesenchymal and forms the dentin–pulp complex.",1],
['A',"Which tissue does NOT derive from the dental sac (follicle)?","Dentin","Cementum","Periodontal ligament","Alveolar bone","The dental sac gives cementum, periodontal ligament and alveolar bone. Dentin comes from the dental papilla.",3],
['A',"Histogenesis (cytodifferentiation) consists of…","the formation of enamel, dentin and pulp within the patterns already formed","the development of coronal and radicular patterns by division, displacement and organization of parts","the differentiation of the vestibular lamina","the migration of neural crest cells into the maxillary process","Morphogenesis builds the patterns (crown and root); histogenesis fills them with tissues. Do not swap the two definitions.",2],
['A',"At which stage do morphogenesis and histogenesis converge?","Bell stage","Bud stage","Cap stage","Dental lamina stage","The two phases meet at the bell stage, where cell differentiation begins while the crown pattern is being completed.",1],

/* B. Timeline */
['B',"Odontogenesis begins between the…","4th and 6th week of intrauterine life","7th and 8th week of intrauterine life","9th and 13th week of intrauterine life","5th and 6th month of intrauterine life","The formation of the dental lamina opens odontogenesis between the 4th and 6th week.",1],
['B',"The bud stage corresponds to the…","7th–8th week","4th–6th week","9th–13th week","14th–18th week","Sequence: dental lamina 4th–6th week, bud 7th–8th, cap 9th–13th, bell 14th–18th, apposition 5th–6th month.",1],
['B',"Which stage occurs between the 9th and 13th week?","Cap stage","Bud stage","Bell stage","Appositional stage","The cap stage is the 9th–13th week. It follows the bud (7th–8th) and precedes the bell (14th–18th).",1],
['B',"The bell period is placed between the…","14th and 18th week","9th and 13th week","7th and 8th week","5th and 6th month","Bell stage: 14th–18th week of intrauterine life.",1],
['B',"The dental appositional (follicular) period takes place during the…","5th–6th month of intrauterine life","14th–18th week of intrauterine life","first year after birth","4th–6th week of intrauterine life","Hard-tissue secretion starts in the 5th–6th month, after the bell period.",2],
['B',"How many epithelial growths (buds) form in each jaw by the 8th week?","10","16","20","32","Ten per jaw, 20 in total, matching the 20 primary teeth. The 32 refers to permanent tooth germs formed later.",1],
['B',"The germs of the 32 permanent teeth are formed around…","the 5th month of gestation","the 6th week","birth","the 8th week","Primary tooth buds appear by the 8th week; the germs of the permanent dentition form around the 5th month of pregnancy.",2],
['B',"The first permanent molar begins to develop as early as…","the 4th month of intrauterine life","the 6th week of intrauterine life","birth","age 4–5 years","The onset of the first permanent molar is already in the 4th month of intrauterine life.",2],
['B',"The germs of the second and third permanent molars begin to develop…","after birth (around 4–5 years)","in the 4th month of intrauterine life","in the 8th week of intrauterine life","at the cap stage of the primary teeth","Only the first permanent molar starts before birth. The second and third molars start after birth.",3],
['B',"Which is the correct chronological order of the stages?","Dental lamina → bud → cap → bell → apposition","Dental lamina → cap → bud → bell → apposition","Bud → dental lamina → cap → bell → apposition","Dental lamina → bud → bell → cap → apposition","Order: lamina, bud, cap, bell, apposition. Remember it as a bud that invaginates into a cap, which deepens into a bell.",1],

/* C. Initiation and induction */
['C',"Ectomesenchymal cells are…","neural crest–derived cells of ectodermal origin that migrate to the cephalic region and acquire a mesenchymal phenotype","mesodermal cells that migrate into the oral epithelium","endodermal cells lining the primitive gut","cells of the stellate reticulum","The name says it: ecto (ectodermal origin, neural crest) plus mesenchymal (phenotype acquired after migration).",2],
['C',"Ectomesenchymal cells will later give rise to…","the dentin–pulp complex and the dental sac","the enamel organ","enamel and dentin","the vestibular sulcus","Ectomesenchyme forms the dental papilla (dentin–pulp) and the dental sac. The enamel organ is ectodermal.",1],
['C',"How do ectomesenchymal cells form?","Epithelial cells divide by mitosis, cross the basal lamina and migrate toward the mesoderm","Mesenchymal cells migrate into the epithelium and become epithelial","Stellate reticulum cells dedifferentiate","Odontoblasts transform into mesenchymal cells","Epithelial cells of ectodermal origin proliferate, cross the basal lamina and enter the mesoderm. Those that contact the mesoderm become ectomesenchymal cells.",2],
['C',"Neural crest cells migrate into the ectomesenchyme of the maxillary and mandibular processes, usually…","from the anterior portion toward the posterior","from the posterior portion toward the anterior","only into the mandible","only after birth","Correct neural crest migration is essential for face and tooth development; it proceeds from anterior to posterior.",3],
['C',"Which structure arises from the basal layer of the ectodermal oral epithelium and then divides into two laminae?","The primary epithelial band","The enamel knot","Hertwig's sheath","The dental follicle","The basal layer forms the primary epithelial band, which splits into the vestibular lamina and the dental lamina.",2],
['C',"The primary epithelial band gives rise to which two structures?","Vestibular lamina and dental lamina","Dental papilla and dental sac","Inner and outer enamel epithelium","Cervical loop and diaphragm","Vestibular lamina (outside, forms the sulcus) and dental lamina (forms the tooth buds).",1],
['C',"The vestibular lamina…","proliferates, then degenerates to form the vestibular sulcus between the cheek and the tooth zone","gives rise to the 10 buds of each jaw","forms the enamel knot","differentiates into the dental papilla","The vestibular lamina is located toward the exterior. Its cells enlarge, then degenerate and leave a cleft: the vestibular sulcus.",2],
['C',"The dental lamina is characterized by…","intense, localized proliferation that gives 10 epithelial growths per jaw by the 8th week","degeneration that forms a cleft","the formation of root odontoblasts","the production of dentin","Intense localized proliferation of the dental lamina produces the 10 buds per jaw. Degeneration into a cleft describes the vestibular lamina.",2],
['C',"What is the first manifestation of morphogenesis, which starts around the 6th week?","Differentiation of the dental lamina from the ectoderm lining the primitive oral cavity","Appearance of the enamel knot","Differentiation of odontoblasts","Formation of Hertwig's sheath","Morphogenesis begins at about the 6th week with the differentiation of the dental lamina.",2],
['C',"What induces the basal cells of the buccal epithelium to form the vestibular and dental laminae?","The underlying ectomesenchyme","The enamel knot","The dental pulp","The periodontal ligament","Induced by the underlying ectomesenchyme, the basal cells proliferate along the free edge of the future jaws.",3],
['C',"The tooth germ (primordium) is formed by…","an aggregation of differentiating cells that will form the future tooth","the fusion of inner and outer enamel epithelium","a layer of mature ameloblasts","the calcification of predentin","The primordium or tooth germ is an aggregate of differentiating cells.",1],
['C',"Which pairing of tooth germ components and their derivatives is INCORRECT?","Ectomesenchyme → dental papilla → enamel","Ectoderm → enamel organ → enamel","Ectomesenchyme → dental papilla → dentin–pulp complex","Ectomesenchyme → dental sac → cementum","Enamel comes from the ectodermal enamel organ. The papilla is ectomesenchymal and gives the dentin–pulp complex.",3],

/* D. Signals and genes */
['D',"Which balance is important in determining the site of tooth germ formation?","Growth and differentiation factors (FGFs, Wnts, Shh) versus inhibitory signals (BMPs)","Growth factors (BMPs) versus inhibitory signals (FGFs, Wnts, Shh)","Msx genes versus Pax9","Odontoblast signals versus ameloblast signals","FGFs, Wnts and Shh promote growth and differentiation. BMPs act as inhibitory signals in this balance. Watch for the inverted version.",3],
['D',"Which molecule is the main signal capable of inducing odontogenesis?","BMP4","Lef1","Pax9","EDA","BMP4 is the main signalling component able to induce odontogenesis. BMPs are expressed during early morphogenesis.",2],
['D',"BMPs, expressed during early morphogenesis, induce the expression of…","Msx genes","collagen type I","TCOF1","AXIN2 only","BMPs induce Msx genes. Msx stands for muscle segment homeobox.",2],
['D',"FGFs in dental development…","stimulate epithelial and mesenchymal proliferation and induce Msx1 expression","inhibit the formation of tooth germs","are expressed only after tooth eruption","cause supernumerary roots","FGFs mediate growth and differentiation, stimulate division of epithelial and mesenchymal cells, and induce Msx1.",2],
['D',"Which gene is important for the formation of the cap stage?","Lef1","TCOF1","EDA","PDGF","Lef1 (lymphoid enhancer factor) is important for forming the cap stage.",1],
['D',"Pax9 is…","expressed in mesenchyme and essential for morphogenesis; alterations cause severe oligodontia","expressed in the stratum intermedium and needed for enamel secretion","a growth factor released by the enamel knot","the gene responsible for Treacher Collins syndrome","Pax9 (paired box gene) is mesenchymal and essential for morphogenesis. Its alteration causes severe oligodontia.",2],
['D',"Alterations in the Msx genes produce…","hypodontia and cleft palate","supernumerary teeth with larger crowns","ectodermal dysplasia with colorectal cancer","Treacher Collins syndrome","Msx genes are needed where epithelium–mesenchyme interaction occurs, for incisor initiation and for the bud and enamel stages. Defects cause hypodontia and cleft palate.",2],
['D',"Defects in the p63, TNF and ectodysplasin (EDA) pathways typically lead to…","ectodermal dysplasias characterized by lack of teeth","multiple supernumerary teeth","an extra root on every molar","excess enamel thickness","Loss of function in these pathways gives ectodermal dysplasias with tooth agenesis.",2],
['D',"Overactivation of the EDA receptor (EDAr) via TNF leads to…","additional teeth with aberrant morphology","agenesis of all teeth","absence of cementum","premature root closure","Too little signalling gives missing teeth; overactivation gives extra teeth (supernumerary) with aberrant shape.",3],
['D',"Why are FGF4 and Slit-1 considered the best molecular markers of enamel knot formation?","They are the only two genes observed in both primary and secondary enamel knots","They are expressed only in the dental papilla","They are expressed only in Hertwig's sheath","They are inhibitory signals secreted by BMPs","FGF4 and Slit-1 appear in both primary and secondary knots, which makes them the best markers.",3],

/* E. Bud and cap */
['E',"At the bud stage, how many buds form in the mandible and in the maxilla?","10 in each, matching the position of the primary teeth","16 in each","10 in the maxilla and 6 in the mandible","20 in each","There are 10 buds in each jaw, 20 in total, one per primary tooth.",1],
['E',"Buds arise from mitotic division of…","stem cells of the basal layer of the epithelium","odontoblasts of the dental papilla","ameloblasts of the inner epithelium","fibroblasts of the dental sac","Buds are the future enamel organs and come from stem cells of the epithelial basal layer.",2],
['E',"The bud (future enamel organ) will form the only ectodermal tissue of the tooth, which is…","enamel","dentin","cementum","pulp","Enamel is the only ectodermal tissue of the tooth. Dentin, pulp and cementum are ectomesenchymal.",1],
['E',"Within the bud, the central cells are…","polygonal cells with very narrow intercellular spaces","stellate cells with wide intercellular spaces","tall cylindrical cells","flat cells with elongated nuclei","The bud has peripheral cylindrical cells and inner polygonal cells with narrow spaces, with condensed ectomesenchyme around it. Wide spaces belong to the stellate reticulum, which appears later.",3],
['E',"The transition from bud to cap marks…","the beginning of morphological differences between tooth germs that give rise to different types of teeth","the first deposition of dentin","the formation of Hertwig's sheath","the end of crown formation","At this transition germs start to differ, which later gives incisors, canines, premolars and molars. Pax9 and Msx1 are needed for these transitions.",2],
['E',"The cap forms when the bud…","invaginates because of unequal proliferation, creating a concavity","fuses with the vestibular lamina","fragments into epithelial rests","differentiates into ameloblasts","Unequal proliferation makes the bud invaginate and form a concavity: the cap.",2],
['E',"At the cap stage, ectomesenchymal cells condense under the influence of the proliferating epithelium and form…","the dental papilla, the future dentin–pulp complex","the stratum intermedium","the cervical loop","the epithelial diaphragm","The condensed ectomesenchyme with capillaries is the dental papilla.",2],
['E',"The mesenchymal tissue surrounding the cap condenses to form…","the primitive dental sac or dental follicle","the dental papilla","the enamel knot","the stellate reticulum","Surrounding tissue condenses into the dental sac (follicle), which later gives cementum, periodontal ligament and alveolar bone.",1],
['E',"Which is NOT a component of the enamel organ at the cap stage?","Dental papilla","Outer enamel epithelium","Stellate reticulum","Inner enamel epithelium","At the cap stage the enamel organ (ectodermal) has three parts. The dental papilla is ectomesenchymal and lies beside it.",2],
['E',"At the cap stage, the inner enamel epithelium consists of…","tall cylindrical cells that surround the dental papilla and will become ameloblasts","flattened stellate cells with large intercellular spaces","cuboidal cells that form Hertwig's sheath","loose collagen fibers","Inner epithelium: innermost layer of tall cylindrical cells, later ameloblasts that secrete enamel. The stellate cells describe the reticulum.",2],

/* F. Bell and apposition */
['F',"Between the cap and bell stages, which organizational center forms and orchestrates morphogenesis?","The enamel knot","The vestibular sulcus","The epithelial diaphragm","The stratum intermedium","The enamel knot is an organizational center that orchestrates morphogenesis.",1],
['F',"Receptors for enamel knot signals are located in…","the epithelial cells surrounding the enamel knot","the odontoblasts","the fibroblasts of the dental sac","the alveolar bone","The knot signals to the surrounding epithelial cells, which carry the receptors.",3],
['F',"The bell stage (14th–18th week) is reached when…","the invagination of the inner dental epithelium deepens, giving the structure a bell shape","the first buds appear","the dental lamina first thickens","the root sheath forms","Deepening of the invagination of the inner dental epithelium gives the bell appearance.",1],
['F',"The stratum intermedium is located…","between the stellate reticulum and the inner enamel epithelium","between the outer enamel epithelium and the dental sac","inside the dental papilla","between dentin and predentin","It is the intermediate layer of 4 or 5 rows of flat cells, between the stellate reticulum and the inner epithelium.",2],
['F',"In the early bell stage, how many layers does the enamel organ show?","Four","Two","Three","Five","Four layers: outer enamel epithelium, stellate reticulum, stratum intermedium and inner enamel epithelium (preameloblasts). At the cap there were three.",2],
['F',"In the early bell stage, the cells of the outer enamel epithelium change from…","cuboidal to flattened","flattened to cuboidal","cylindrical to stellate","polygonal to cylindrical","Outer enamel epithelium cells flatten as the bell forms.",3],
['F',"In the bell stage, the inner enamel epithelium differentiates into…","preameloblasts, which induce odontoblast differentiation and later become young ameloblasts","odontoblasts, which later become ameloblasts","cementoblasts that line the root","cells of the stellate reticulum","Preameloblasts induce papilla cells to become odontoblasts. Once odontoblasts exist, preameloblasts become young ameloblasts.",2],
['F',"Which statement describes the dental papilla in the EARLY bell stage?","No odontoblastic differentiation has occurred yet","Odontoblasts are already secreting predentin","Mineralized dentin is already present","It has already become mature dental pulp","Odontoblast differentiation and unmineralized predentin appear in the late bell stage.",2],
['F',"In the bell stage, the dental sac is modified into two layers:","an internal cellulovascular layer and an external layer rich in collagen fibers","an internal fibrous layer and an external cellulovascular layer","an enamel layer and a dentin layer","a stellate layer and an intermediate layer","Internal: cellulovascular. External (superficial): abundant collagen fibers. Do not invert them.",3],
['F',"In the late bell stage, ameloblasts change polarity and can secrete enamel proteins, but they stay inactive until…","odontoblasts secrete the first layer of predentin","Hertwig's sheath fragments","the tooth erupts","the dental lamina degenerates","Ameloblasts wait until the odontoblasts have laid down predentin, the first unmineralized layer of dentin.",2],
['F',"In the apposition (follicular) stage, what is the sequence of crown hard-tissue deposition?","Odontoblasts deposit dentin first, then ameloblasts deposit enamel","Ameloblasts deposit enamel first, then odontoblasts deposit dentin","Both start together at the cervical loop","Cementoblasts deposit cementum first, then dentin","It begins at the future cusps or incisal edges. Dentin is laid first, then enamel over it.",3],
['F',"What determines the shape, number and distribution of the cusps of the crown?","Specific signals between the enamel organ and the dental papilla","The pattern of dental sac fibers","The eruption path through the alveolar bone","The timing of Hertwig's sheath formation","Crown morphology depends on signals between enamel organ and dental papilla. The crown pattern forms first, then the root.",2],

/* G. Anomalies */
['G',"Hypodontia is defined as the congenital absence of…","1 to 6 teeth","more than 6 teeth","all teeth","only third molars","Hypodontia: 1–6 teeth missing. Oligodontia: more than 6. Anodontia: complete absence.",1],
['G',"Which term describes the congenital absence of more than 6 teeth?","Oligodontia","Hypodontia","Anodontia","Hyperdontia","Oligodontia is more than 6 missing teeth; anodontia is a complete lack of teeth.",1],
['G',"Oligodontia caused by MSX1 mutations typically manifests as…","agenesis of second premolars and third molars, possibly with cleft lip and palate","absence of most permanent molars","multiple agenesis with a high risk of colorectal cancer","complete anodontia with fused roots","MSX1 (4p16.1): second premolars and third molars, can come with cleft lip and palate.",2],
['G',"Oligodontia caused by PAX9 mutations typically results in…","absence of most permanent molars","agenesis of second premolars and third molars with cleft palate","a high risk of colorectal cancer","supernumerary incisors","PAX9 (14q12–q13): absence of most permanent molars, sometimes with hypodontia in the primary dentition.",2],
['G',"Which gene linked to oligodontia is associated with a significantly higher risk of colorectal cancer?","AXIN2","MSX1","PAX9","TCOF1","AXIN2 (17q23–24): multiple agenesis of permanent teeth and higher colorectal cancer risk.",2],
['G',"In Down syndrome, which teeth are among the most frequently affected by agenesis?","Maxillary lateral incisors, mandibular central incisors and second premolars","Maxillary central incisors, canines and first molars","Mandibular canines and first premolars","Maxillary first molars and mandibular lateral incisors","Agenesis occurs in 70% of women and 91% of men with Down syndrome. Maxillary lateral incisor agenesis, uni- or bilateral, appears in more than 10% of patients.",3],
['G',"Which statement about supernumerary teeth is TRUE?","Prevalence is 0.2–0.9%, they are more frequent in the upper jaw, and multiple ones are often linked to syndromes such as cleidocranial dysplasia or Gardner syndrome","They are more frequent in the mandible and a single causal mutation has been identified","They are always multiple and unrelated to syndromes","They are caused exclusively by PAX9 mutations","A genetic factor exists, but no mutation responsible for non-syndromic hyperdontia has been identified so far.",3],
['G',"Treacher Collins syndrome is most often caused by mutations in which gene?","TCOF1, on chromosome 5 (dominant)","MSX1, on chromosome 4","PAX9, on chromosome 14","AXIN2, on chromosome 17","It is a congenital craniofacial disorder with bilateral symmetrical otomandibular dysplasia. Oral signs: incomplete malar bones, malocclusion, ogival or cleft palate, early feeding problems.",2],

/* H. Root */
['H',"Hertwig's epithelial root sheath forms at the cervical loop by…","fusion of the inner and outer enamel epithelium, without stellate reticulum","fusion of the stellate reticulum and stratum intermedium","proliferation of the dental papilla","condensation of the dental sac","Root formation starts after the crown. The absence of stellate reticulum at the fusion is the key detail.",2],
['H',"Hertwig's sheath induces cells of the dental papilla to differentiate into…","root odontoblasts that form root dentin","ameloblasts that form root enamel","cementoblasts that form cementum","osteoblasts","The sheath is the inducer and modulator of the root. It induces root odontoblasts in the papilla.",2],
['H',"When Hertwig's sheath loses its continuity and fragments, it forms…","the epithelial rests of Malassez, which persist in the periodontal ligament","the stratum intermedium","the enamel knot","the vestibular sulcus","Fragments of the sheath remain as epithelial rests of Malassez inside the periodontal ligament.",2],
['H',"The sheath epithelium shapes the dentinocemental junction by inducing…","dentin on the inside and cementum on the outside","cementum on the inside and dentin on the outside","enamel on the inside and cementum on the outside","pulp on the inside and bone on the outside","Dentin forms toward the pulp side and cementum toward the outside, which defines the dentinocemental junction.",3],
['H',"Which pairing from dental sac cell differentiation is INCORRECT?","Fibroblasts → cementum","Cementoblasts → cementum","Fibroblasts → periodontal ligament","Osteoblasts → alveolar bone","Cementoblasts form cementum; fibroblasts form the periodontal ligament; osteoblasts form alveolar bone.",3],
['H',"Which factors are listed as growth factors and signalling molecules in the differentiation of dental sac cells?","TGF, PDGF, FGF and the adhesion molecule E-cadherin","Msx1, Pax9, Lef1 and Slit-1","EDA, p63, TNF and AXIN2","BMP4, Shh, Wnt and TCOF1","For root and sac differentiation the course lists TGF, PDGF, FGF and E-cadherin. The other sets belong to crown signalling or anomalies.",3],
['H',"Multi-radicular teeth arise when Hertwig's sheath…","produces 2 or 3 tongue-like extensions at the cervical region, directed toward the axis of the tooth","fails to fragment","fuses with the oral epithelium","lacks an epithelial diaphragm","The tongue-like extensions delimit the floor of the pulp chamber, then proliferate individually in each root.",2],
['H',"After root formation, the epithelial sheath curves inward to form the…","diaphragm, which defines the root limit and the primary apical foramen","cervical loop, which defines the crown limit","enamel knot, which defines the cusps","vestibular sulcus, which defines the vestibule","Nerves and vessels enter the pulp chamber through the apical foramen. At this point the dental papilla becomes the dental pulp.",2]
];
const QS=RAW.map((r,i)=>({id:i+1,s:r[0],q:r[1],c:r[2],w:[r[3],r[4],r[5]],e:r[6],l:r[7]}));
</script>

<script>
(function(){
const LET=['A','B','C','D'];
const LVL={1:'Recall',2:'Understand',3:'Tricky'};
const STAGES=[['Dental lamina','weeks 4–6'],['Bud','weeks 7–8'],['Cap','weeks 9–13'],['Bell','weeks 14–18'],['Apposition','months 5–6']];
const KEY='odontogenesis-qb-v1';
const app=document.getElementById('app');
let store={done:{}};
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&s.done)store=s}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}}
const $=s=>document.querySelector(s);
function esc(t){return String(t).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function secName(k){return SECS.find(s=>s.k===k).n}
function fmt(ms){const t=Math.floor(ms/1000);return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')}
const isOk=it=>it.pick!==null&&it.opts[it.pick].ok;

let mode='practice',scope='all',S=null,C=null,timer=null,resetAsk=false;

const MODE_NOTE={
 practice:'One question at a time. You see right away whether you were correct and read the explanation.',
 exam:'No feedback until you finish. Move back and forth, flag questions, and watch the clock.',
 cards:'The question on the front, the answer and its explanation on the back. Good for a last pass.'
};

function poolFor(sc){
 if(sc==='all')return QS.slice();
 if(sc==='weak')return QS.filter(q=>store.done[q.id]==='w');
 return QS.filter(q=>q.s===sc);
}

/* ---------- HOME ---------- */
function home(){
 clearInterval(timer);S=null;C=null;
 const weak=poolFor('weak').length;
 if(scope==='weak'&&!weak)scope='all';
 const tried=QS.filter(q=>store.done[q.id]).length;
 const right=QS.filter(q=>store.done[q.id]==='c').length;
 const rows=[{k:'all',n:'All sections'}].concat(SECS).map(s=>{
  const p=poolFor(s.k),c=p.filter(q=>store.done[q.id]==='c').length;
  return `<label class="scope"><input type="radio" name="scope" value="${s.k}" ${scope===s.k?'checked':''}><span class="sc-name">${esc(s.n)}</span><span class="sc-meta">${p.length} questions · ${c} answered correctly</span><span class="meter"><i style="width:${Math.round(c/p.length*100)}%"></i></span></label>`;
 }).join('')+`<label class="scope"><input type="radio" name="scope" value="weak" ${scope==='weak'?'checked':''} ${weak?'':'disabled'}><span class="sc-name">My mistakes</span><span class="sc-meta">${weak?weak+' questions you last got wrong':'Nothing to review yet'}</span><span class="meter"><i style="width:${weak?Math.round(weak/QS.length*100):0}%;background:var(--eosin)"></i></span></label>`;
 app.innerHTML=`
 <p class="eyebrow">Embryology · Lesson 2</p>
 <h1>Odontogenesis Question Bank</h1>
 <p class="lead">${QS.length} single-answer questions with a full explanation for each one, built from the Lesson 2 slides: embryology, tooth germ stages, signalling, anomalies and root formation.</p>
 <div class="ribbon" aria-label="Intrauterine timeline">${STAGES.map(s=>`<div><b>${s[0]}</b><span>${s[1]}</span></div>`).join('')}</div>
 <p class="cap">Stage timeline as taught in the lesson. Progress so far: ${right} of ${QS.length} answered correctly${tried?`, ${tried} attempted`:''}.</p>
 <p class="sec-title">1 · Mode</p>
 <div class="seg" role="group" aria-label="Mode">
  ${[['practice','Practice'],['exam','Exam'],['cards','Flashcards']].map(m=>`<button type="button" data-a="mode" data-v="${m[0]}" aria-pressed="${mode===m[0]}">${m[1]}</button>`).join('')}
 </div>
 <p class="mode-note" id="mnote">${MODE_NOTE[mode]}</p>
 <p class="sec-title">2 · Scope</p>
 <div class="scopes">${rows}</div>
 <div class="start row between">
  <button type="button" class="btn" data-a="start">Start</button>
  ${resetAsk?`<span class="row"><span class="tag">Erase saved progress?</span><button type="button" class="btn ghost small" data-a="reset-yes">Erase</button><button type="button" class="btn ghost small" data-a="reset-no">Keep</button></span>`:`<button type="button" class="linkish" data-a="reset">Reset progress</button>`}
 </div>`;
}

/* ---------- SESSION ---------- */
function startSession(m,pool){
 if(!pool.length)return;
 S={mode:m,i:0,t0:Date.now(),ask:false,over:false,rf:'wrong',
  list:shuffle(pool).map(q=>({q,opts:shuffle([{t:q.c,ok:true}].concat(q.w.map(t=>({t,ok:false})))),pick:null,flag:false}))};
 clearInterval(timer);
 if(m==='exam'){timer=setInterval(()=>{const e=$('#clock');if(e)e.textContent=fmt(Date.now()-S.t0)},1000)}
 quiz();
}

function quiz(){
 const ex=S.mode==='exam',it=S.list[S.i],q=it.q,n=S.list.length;
 const ans=it.pick!==null,reveal=!ex&&ans;
 const nDone=S.list.filter(x=>x.pick!==null).length;
 const good=S.list.filter(isOk).length,bad=nDone-good;
 const opts=it.opts.map((o,k)=>{
  let cls='opt';
  if(ex&&it.pick===k)cls+=' sel';
  if(reveal){if(o.ok)cls+=' ok';else if(it.pick===k)cls+=' bad';else cls+=' dim'}
  return `<li><button type="button" class="${cls}" data-a="pick" data-i="${k}" ${reveal?'disabled':''}><span class="l">${LET[k]}</span><span>${esc(o.t)}</span></button></li>`;
 }).join('');
 let fb='';
 if(reveal){
  const ok=isOk(it);
  fb=`<div class="fb ${ok?'good':'miss'}" role="status"><strong>${ok?'Correct':'Not quite'}</strong>${ok?'':`<p><b>Answer:</b> ${esc(q.c)}</p>`}<p>${esc(q.e)}</p></div>`;
 }
 const last=S.i===n-1;
 let foot;
 if(ex){
  const un=n-nDone;
  foot=`<div class="row between foot">
   <span class="row"><button type="button" class="btn ghost" data-a="prev" ${S.i===0?'disabled':''}>Previous</button><button type="button" class="btn ghost" data-a="next" ${last?'disabled':''}>Next</button></span>
   <span class="row"><button type="button" class="btn ghost small ${it.flag?'flagged':''}" data-a="flag" aria-pressed="${it.flag}">${it.flag?'Flagged':'Flag'}</button><button type="button" class="btn small" data-a="finish">Finish exam</button></span>
  </div>
  ${S.ask?`<div class="warn" role="alert"><p>${un?`You left ${un} question${un>1?'s':''} unanswered. They will count as wrong.`:'All questions answered.'} Finish and see your results?</p><div class="row"><button type="button" class="btn small" data-a="finish-yes">Finish</button><button type="button" class="btn ghost small" data-a="finish-no">Keep going</button></div></div>`:''}
  <div class="nav" aria-label="Question navigator">${S.list.map((x,k)=>`<button type="button" data-a="jump" data-i="${k}" class="${x.pick!==null?'a':''} ${x.flag?'f':''} ${k===S.i?'c':''}" aria-label="Question ${k+1}${x.flag?', flagged':''}${x.pick!==null?', answered':''}">${k+1}</button>`).join('')}</div>`;
 }else{
  foot=`<div class="row between foot"><button type="button" class="linkish" data-a="home">Quit</button><button type="button" class="btn" data-a="${last?'finish-yes':'next'}" ${ans?'':'disabled'}>${last?'See results':'Next question'}</button></div>`;
 }
 app.innerHTML=`
 <div class="topbar"><span class="tag">Question ${S.i+1} of ${n} · <b>${esc(secName(q.s))}</b></span>
  ${ex?`<span class="clock" id="clock">${fmt(Date.now()-S.t0)}</span>`:`<span class="score" aria-label="Score so far">✓ ${good} · ✗ ${bad}</span>`}</div>
 <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="${n}" aria-valuenow="${ex?nDone:S.i+(ans?1:0)}"><i style="width:${(ex?nDone:S.i+(ans?1:0))/n*100}%"></i></div>
 <div class="qtext" id="q"><h2>${esc(q.q)}</h2><span class="lvl">${LVL[q.l]}</span></div>
 <ul class="opts">${opts}</ul>${fb}${foot}`;
 window.scrollTo(0,0);
}

function pick(k){
 const it=S.list[S.i];
 if(S.mode==='practice'){
  if(it.pick!==null)return;
  it.pick=k;store.done[it.q.id]=it.opts[k].ok?'c':'w';save();
 }else{it.pick=k}
 quiz();
}

function finish(){
 clearInterval(timer);
 S.list.forEach(it=>{if(S.mode==='exam'){store.done[it.q.id]=isOk(it)?'c':'w'}});
 save();S.end=Date.now();S.over=true;results();
}

/* ---------- RESULTS ---------- */
function results(){
 const L=S.list,n=L.length,ok=L.filter(isOk).length,pct=Math.round(ok/n*100);
 const verdict=pct>=85?'Exam-ready on this set. Keep the weak spots fresh.':pct>=70?'Solid base. Tighten the sections marked in pink.':'Keep drilling. Redo your mistakes, then try again.';
 const secs=SECS.map(s=>{const l=L.filter(x=>x.q.s===s.k);if(!l.length)return '';const c=l.filter(isOk).length,p=Math.round(c/l.length*100);
  return `<div class="brow"><span>${esc(s.n)}</span><span class="num">${c}/${l.length}</span><span class="meter"><i class="${p<70?'low':''}" style="width:${p}%"></i></span></div>`}).join('');
 const wrong=L.filter(x=>!isOk(x));
 const shown=S.rf==='wrong'?wrong:L;
 const rev=shown.map(it=>{const k=L.indexOf(it);
  const yours=it.pick===null?'<b>No answer</b>':`<b>${esc(it.opts[it.pick].t)}</b>`;
  return `<article class="item"><span class="tag">Question ${k+1} · ${esc(secName(it.q.s))}</span><p class="q">${esc(it.q.q)}</p>
  ${isOk(it)?'':`<p class="yours">Your answer: ${yours}</p>`}<p class="right">Correct: <b>${esc(it.q.c)}</b></p><p class="ex">${esc(it.q.e)}</p></article>`}).join('');
 app.innerHTML=`
 <p class="eyebrow">${S.mode==='exam'?'Exam':'Practice'} complete · ${fmt(S.end-S.t0)}</p>
 <div class="big">${ok}<small> / ${n}</small></div>
 <h2 style="margin-top:8px">${pct}% · ${verdict}</h2>
 <div class="row start"><button type="button" class="btn" data-a="retry" ${wrong.length?'':'disabled'}>Redo my ${wrong.length} mistake${wrong.length===1?'':'s'}</button><button type="button" class="btn ghost" data-a="home">Back to start</button></div>
 <p class="sec-title">By section</p><div class="breakdown">${secs}</div>
 <p class="sec-title">Review</p>
 <div class="row"><button type="button" class="btn small ${S.rf==='wrong'?'':'ghost'}" data-a="rf" data-v="wrong">Mistakes (${wrong.length})</button><button type="button" class="btn small ${S.rf==='all'?'':'ghost'}" data-a="rf" data-v="all">All questions</button></div>
 <div class="rev">${rev||'<p class="lead">No mistakes in this run.</p>'}</div>`;
 window.scrollTo(0,0);
}

/* ---------- FLASHCARDS ---------- */
function cards(pool){
 if(!pool.length)return;
 C={list:shuffle(pool),i:0,f:false};renderCard();
}
function renderCard(){
 const q=C.list[C.i],n=C.list.length;
 app.innerHTML=`
 <div class="topbar"><span class="tag">Card ${C.i+1} of ${n} · <b>${esc(secName(q.s))}</b></span><button type="button" class="linkish" data-a="home">Back to start</button></div>
 <div class="bar"><i style="width:${(C.i+1)/n*100}%"></i></div>
 <button type="button" class="card ${C.f?'back':''}" id="card" data-a="flip" aria-live="polite">
  ${C.f?`<span class="side">Answer</span><span class="ans">${esc(q.c)}</span><span class="ex">${esc(q.e)}</span>`:`<span class="side">Question</span><h2>${esc(q.q)}</h2>`}
 </button>
 <p class="hint">Tap the card or press Space to flip. Arrow keys move between cards.</p>
 <div class="row between foot"><button type="button" class="btn ghost" data-a="cprev" ${C.i===0?'disabled':''}>Previous</button><button type="button" class="btn" data-a="cnext" ${C.i===n-1?'disabled':''}>Next card</button></div>`;
}

/* ---------- EVENTS ---------- */
app.addEventListener('change',e=>{if(e.target.name==='scope')scope=e.target.value});
app.addEventListener('click',e=>{
 const b=e.target.closest('[data-a]');if(!b||b.disabled)return;
 const a=b.dataset.a,v=b.dataset.v,i=b.dataset.i!==undefined?+b.dataset.i:null;
 switch(a){
  case 'mode':mode=v;document.querySelectorAll('.seg button').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.v===mode)));$('#mnote').textContent=MODE_NOTE[mode];break;
  case 'start':{const p=poolFor(scope);if(mode==='cards')cards(p);else startSession(mode,p);break}
  case 'reset':resetAsk=true;home();break;
  case 'reset-no':resetAsk=false;home();break;
  case 'reset-yes':store={done:{}};save();resetAsk=false;home();break;
  case 'pick':pick(i);break;
  case 'next':if(S.i<S.list.length-1){S.i++;S.ask=false;quiz()}break;
  case 'prev':if(S.i>0){S.i--;S.ask=false;quiz()}break;
  case 'jump':S.i=i;S.ask=false;quiz();break;
  case 'flag':S.list[S.i].flag=!S.list[S.i].flag;quiz();break;
  case 'finish':S.ask=true;quiz();break;
  case 'finish-no':S.ask=false;quiz();break;
  case 'finish-yes':finish();break;
  case 'home':home();break;
  case 'rf':S.rf=v;results();break;
  case 'retry':startSession('practice',S.list.filter(x=>!isOk(x)).map(x=>x.q));break;
  case 'flip':C.f=!C.f;renderCard();break;
  case 'cnext':if(C.i<C.list.length-1){C.i++;C.f=false;renderCard()}break;
  case 'cprev':if(C.i>0){C.i--;C.f=false;renderCard()}break;
 }
});
document.addEventListener('keydown',e=>{
 if(e.metaKey||e.ctrlKey||e.altKey)return;
 if(S&&!S.over&&$('#q')){
  const k='1234'.indexOf(e.key),k2='abcd'.indexOf(e.key.toLowerCase());
  const idx=k>-1?k:k2;
  if(idx>-1&&idx<4){pick(idx);return}
  if(e.key==='ArrowRight'){const nx=S.list[S.i].pick!==null||S.mode==='exam';if(nx&&S.i<S.list.length-1){S.i++;S.ask=false;quiz()}}
  if(e.key==='ArrowLeft'&&S.mode==='exam'&&S.i>0){S.i--;S.ask=false;quiz()}
 }else if(C&&$('#card')){
  if(e.key===' '&&document.activeElement===document.body){e.preventDefault();C.f=!C.f;renderCard()}
  if(e.key==='ArrowRight'&&C.i<C.list.length-1){C.i++;C.f=false;renderCard()}
